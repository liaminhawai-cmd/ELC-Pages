<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AQWF Vocabulary — Flashcard Practice</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4efe6;
    --paper: #fbf7ee;
    --ink: #1f1f1f;
    --muted: #6b6256;
    --line: #d8cfbb;
    --line-soft: #e8e0cd;
    --accent: #a83232;
    --correct: #2f6a3e;
    --correct-bg: #eaf2ec;
    --wrong: #a83232;
    --wrong-bg: #f7eaea;
    --shadow: 0 1px 2px rgba(60, 50, 30, 0.05), 0 6px 16px rgba(60, 50, 30, 0.06);
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .l1-text {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei',
                 'Noto Sans Arabic', 'Noto Nastaliq Urdu', 'Segoe UI',
                 -apple-system, sans-serif;
  }
  .rtl { direction: rtl; }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line-soft);
  }

  h1 { font-size: 24px; font-weight: 600; letter-spacing: 0.04em; }
  h1 .sub {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .opt-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }

  .opt-btn {
    padding: 8px 14px;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 3px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
    transition: all 0.12s ease;
  }
  .opt-btn:hover { border-color: var(--muted); }
  .opt-btn.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .opt-btn .count { font-size: 11px; color: inherit; opacity: 0.6; margin-left: 4px; }

  .start-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .deck-size { font-size: 13px; color: var(--muted); }

  .primary-btn {
    padding: 10px 26px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .primary-btn:disabled { opacity: 0.4; cursor: default; }

  .ghost-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--muted); color: var(--ink); }

  /* ─── Game ─── */
  .hidden { display: none !important; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }

  .progress-track {
    height: 6px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-fill {
    height: 100%;
    background: var(--correct);
    width: 0%;
    transition: width 0.3s ease;
  }

  .prompt-card {
    text-align: center;
    padding: 40px 24px 32px;
  }

  .prompt-lang {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .prompt-word {
    font-size: 34px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .prompt-chapter {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .hint-area { min-height: 28px; margin-bottom: 18px; }
  .hint-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline dotted;
  }
  .hint-text {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    max-width: 480px;
    margin: 0 auto;
  }

  .answer-row {
    display: flex;
    gap: 8px;
    max-width: 440px;
    margin: 0 auto;
  }

  #answer-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 17px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }
  #answer-input:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  #answer-input.flash-correct { outline: 2px solid var(--correct); background: var(--correct-bg); }
  #answer-input.flash-wrong { outline: 2px solid var(--wrong); background: var(--wrong-bg); }

  .feedback {
    min-height: 60px;
    margin-top: 18px;
    font-size: 15px;
  }
  .feedback .big { font-size: 18px; font-weight: 600; }
  .feedback.ok .big { color: var(--correct); }
  .feedback.no .big { color: var(--wrong); }
  .feedback .reveal { color: var(--muted); margin-top: 4px; }
  .feedback .reveal strong { color: var(--ink); }

  .next-btn {
    margin-top: 14px;
    padding: 10px 28px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-size: 15px;
    cursor: pointer;
  }

  /* shelf of mastered words */
  .shelf {
    margin-top: 26px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
  }
  .shelf .chip {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 10px;
    background: var(--correct-bg);
    color: var(--correct);
    border: 1px solid #cfe0d3;
  }

  /* ─── Done screen ─── */
  .done-card { text-align: center; padding: 48px 24px; }
  .done-card h2 { font-size: 26px; margin-bottom: 10px; }
  .done-stats { color: var(--muted); margin-bottom: 26px; font-size: 15px; }

  footer {
    margin-top: auto;
    padding-top: 30px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  @media (max-width: 480px) {
    .prompt-word { font-size: 27px; }
    .answer-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>All Quiet on the Western Front
      <span class="sub">Vocabulary Flashcards</span>
    </h1>
  </header>

  <!-- SETUP -->
  <div id="screen-setup" class="card">
    <div class="section-label">Chapters</div>
    <div class="opt-row" id="chapter-row"></div>

    <div class="section-label">Your language</div>
    <div class="opt-row" id="lang-row"></div>

    <div class="section-label">Direction</div>
    <div class="opt-row" id="dir-row">
      <button class="opt-btn active" data-dir="l1-en">Translation → English</button>
      <button class="opt-btn" data-dir="en-l1">English → Translation</button>
    </div>

    <div class="start-row">
      <span class="deck-size" id="deck-size">—</span>
      <button class="primary-btn" id="start-btn" disabled>Start</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="hidden">
    <div class="topbar">
      <span id="remaining-label"></span>
      <button class="ghost-btn" id="quit-btn">Back to setup</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="card prompt-card">
      <div class="prompt-lang" id="prompt-lang"></div>
      <div class="prompt-word l1-text" id="prompt-word"></div>
      <div class="prompt-chapter" id="prompt-chapter"></div>

      <div class="hint-area" id="hint-area">
        <button class="hint-btn" id="hint-btn">show English meaning hint</button>
        <div class="hint-text hidden" id="hint-text"></div>
      </div>

      <div class="answer-row">
        <input id="answer-input" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="type the English word…">
        <button class="primary-btn" id="check-btn">Check</button>
      </div>

      <div class="feedback" id="feedback"></div>
    </div>

    <div class="shelf" id="shelf"></div>
  </div>

  <!-- DONE -->
  <div id="screen-done" class="hidden">
    <div class="card done-card">
      <h2>Deck cleared! 🎉</h2>
      <div class="done-stats" id="done-stats"></div>
      <button class="primary-btn" id="again-btn">Practise again</button>
      &nbsp;
      <button class="ghost-btn" id="setup-btn">Change settings</button>
    </div>
  </div>

  <footer>Kew High School · EAL · Remarque vocabulary</footer>
</div>

<script>
const VOCAB = [{"ch": 1, "word": "artillery", "meaning": "Crew-served projectile weapons designed for long-range ground combat", "zh": "炮兵 / 火炮部队", "vi": "pháo binh / súng đại bác", "fa": "توپخانه", "ro": "artilerie", "ur": "توپ خانہ"}, {"ch": 1, "word": "authority", "meaning": "The power or right to make decisions; official power or command", "zh": "权力 / 权威", "vi": "quyền hạn / chính quyền", "fa": "قدرت / اختیار", "ro": "autoritate / putere", "ur": "اختیار / طاقت"}, {"ch": 1, "word": "barrack-square", "meaning": "Open parade ground in a military camp where soldiers drill", "zh": "兵营广场 / 操场", "vi": "sân baroques / sân tập", "fa": "میدان آرام درو / صحن", "ro": "curtea cazarmii", "ur": "بیرک کا میدان"}, {"ch": 1, "word": "barracks", "meaning": "Military building or group of buildings where soldiers live", "zh": "兵营 / 军营", "vi": "doanh trại / khu quân sự", "fa": "آرام درو / ثکنة", "ro": "cazarma", "ur": "بیرک / فوجی چھاونی"}, {"ch": 1, "word": "barrage", "meaning": "A concentrated, continuous delivery of something (e.g. gunfire)", "zh": "弹幕 / 猛烈炮击", "vi": "làn đạn / pháo kích dồn dập", "fa": "سد آتش / بمباران شدید", "ro": "baraj / tir de baraj", "ur": "گولہ باری / یلغار"}, {"ch": 1, "word": "bayonet", "meaning": "Long blade fixed to end of a rifle for stabbing", "zh": "刺刀 / 匕首", "vi": "lưỡi dao tiếp nòng", "fa": "سرنیزه / شمشیر کوتاه", "ro": "baioneta", "ur": "سنگین"}, {"ch": 1, "word": "beckoning", "meaning": "To signal someone to come closer", "zh": "招手 / 招引", "vi": "vẫy tay / gọi", "fa": "اشاره کردن / فراخواندن", "ro": "a face semn / a chema", "ur": "اشارہ کرنا"}, {"ch": 1, "word": "bellies", "meaning": "Abdomens, stomachs", "zh": "肚子 / 腹部", "vi": "bụng (số nhiều)", "fa": "شکم‌ها", "ro": "burte / abdomen", "ur": "پیٹ"}, {"ch": 1, "word": "bewildered", "meaning": "Completely confused; thrown off", "zh": "困惑 / 不知所措", "vi": "bối rối / hoang mang", "fa": "حیرت‌زده / گیج", "ro": "uluit / derutat", "ur": "حیران / پریشان"}, {"ch": 1, "word": "bombardment", "meaning": "A continuous, heavy attack with bombs or shells", "zh": "轰炸 / 炮击", "vi": "sự pháo kích", "fa": "بمباران", "ro": "bombardament", "ur": "بمباری"}, {"ch": 1, "word": "bumble", "meaning": "A large hairy bee that buzzes loudly; to move clumsily", "zh": "大黄蜂", "vi": "ong nghệ / ong vò vẽ", "fa": "زنبور بزرگ / بامبل‌بی", "ro": "bondar / albină mare", "ur": "بھنورا / بڑی مکھی"}, {"ch": 1, "word": "camp", "meaning": "A temporary site where soldiers live and train", "zh": "营 / 营地", "vi": "trại / doanh trại", "fa": "اردوگاه / اردو", "ro": "tabără / camp militar", "ur": "کیمپ / فوجی پڑاؤ"}, {"ch": 1, "word": "carbolic", "meaning": "Relating to a pungent disinfectant used in hospitals and medical settings", "zh": "石炭酸 / 防腐剂", "vi": "axit carbolic / chất khử trùng", "fa": "اسید کربولیک / ضدعفونی‌کننده", "ro": "carbolic / dezinfectant", "ur": "کاربولک / جراثیم کش"}, {"ch": 1, "word": "commotion", "meaning": "A confused or disruptive movement; noisy tumult", "zh": "骚乱 / 喧闹", "vi": "xộn độn / hỗn loạn", "fa": "شورش / آشوب", "ro": "agitatie / zarva", "ur": "ہنگامہ / شور"}, {"ch": 1, "word": "comrade", "meaning": "A close fellow soldier; trusted companion in arms", "zh": "战友 / 同志", "vi": "đồng đội", "fa": "همرزم / رفیق", "ro": "tovaras / camarad", "ur": "ساتھی / رفیق"}, {"ch": 1, "word": "coveted", "meaning": "Strongly desired or longed for (often something belonging to someone else)", "zh": "令人垂涎 / 渴望得到", "vi": "được thèm muốn / rất ao ước", "fa": "حسرت‌برانگیز / مطلوب", "ro": "ravnit / dorit", "ur": "للچائی ہوئی چیز"}, {"ch": 1, "word": "defiance", "meaning": "Bold refusal to obey; open resistance to authority", "zh": "反抗 / 蔑视", "vi": "sự thách thức / không tuân", "fa": "سرپیچی / تحدی", "ro": "sfidare / nesupunere", "ur": "سرکشی / مزاحمت"}, {"ch": 1, "word": "diploma", "meaning": "An official certificate awarded on completing a course of study", "zh": "文凭 / 毕业证书", "vi": "bằng tốt nghiệp / văn bằng", "fa": "دیپلم / گواهینامه", "ro": "diplomă / certificat", "ur": "ڈپلومہ / سند"}, {"ch": 1 const LANGS = [
  { key:'zh', label:'中文 Mandarin', rtl:false },
  { key:'vi', label:'Tiếng Việt Vietnamese', rtl:false },
  { key:'fa', label:'دری Dari (Farsi)', rtl:true },
  { key:'ro', label:'Română Romanian', rtl:false },
  { key:'ur', label:'اردو Urdu', rtl:true },
];

const state = {
  chapters: new Set(),
  lang: null,
  dir: 'l1-en',   // 'l1-en' = see translation, type English; 'en-l1' = see English, type translation
  deck: [],
  current: null,
  mastered: [],
  attempts: 0,
  answered: false,
};

document.querySelectorAll('#dir-row .opt-btn').forEach(b => {
  b.addEventListener('click', () => {
    state.dir = b.dataset.dir;
    document.querySelectorAll('#dir-row .opt-btn').forEach(c => c.classList.remove('active'));
    b.classList.add('active');
  });

// ---- setup screen ----
const chapterCounts = {};
VOCAB.forEach(v => { chapterCounts[v.ch] = (chapterCounts[v.ch]||0)+1; });
const chapterRow = document.getElementById('chapter-row');
Object.keys(chapterCounts).map(Number).sort((a,b)=>a-b).forEach(ch => {
  const b = document.createElement('button');
  b.className = 'opt-btn';
  b.innerHTML = `Ch ${ch}<span class="count">${chapterCounts[ch]}</span>`;
  b.addEventListener('click', () => {
    state.chapters.has(ch) ? state.chapters.delete(ch) : state.chapters.add(ch);
    b.classList.toggle('active');
    refreshSetup();
  });
  chapterRow.appendChild(b);
});

const langRow = document.getElementById('lang-row');
LANGS.forEach(l => {
  const b = document.createElement('button');
  b.className = 'opt-btn l1-text';
  b.textContent = l.label;
  b.addEventListener('click', () => {
    state.lang = l;
    [...langRow.children].forEach(c => c.classList.remove('active'));
    b.classList.add('active');
    refreshSetup();
  });
  langRow.appendChild(b);
});

function poolSize() {
  return VOCAB.filter(v => state.chapters.has(v.ch) && v[state.lang?.key]).length;
}
function refreshSetup() {
  const n = state.lang && state.chapters.size ? poolSize() : 0;
  document.getElementById('deck-size').textContent =
    n ? `${n} cards in deck` : 'pick chapters + language';
  document.getElementById('start-btn').disabled = !n;
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('quit-btn').addEventListener('click', () => showScreen('setup'));
document.getElementById('again-btn').addEventListener('click', startGame);
document.getElementById('setup-btn').addEventListener('click', () => showScreen('setup'));

function showScreen(name) {
  ['setup','game','done'].forEach(s =>
    document.getElementById('screen-'+s).classList.toggle('hidden', s!==name));
}

// ---- game ----
function shuffle(a) {
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startGame() {
  state.deck = shuffle(VOCAB.filter(v => state.chapters.has(v.ch) && v[state.lang.key]));
  state.mastered = [];
  state.attempts = 0;
  document.getElementById('shelf').innerHTML = '';
  showScreen('game');
  nextCard();
}

function nextCard() {
  if (!state.deck.length) { finish(); return; }
  state.current = state.deck[0];
  state.answered = false;

  const langKey = state.lang.key;
  const toEnglish = state.dir === 'l1-en';
  const pw = document.getElementById('prompt-word');
  const inp = document.getElementById('answer-input');

  if (toEnglish) {
    document.getElementById('prompt-lang').textContent = state.lang.label;
    pw.textContent = state.current[langKey];
    pw.classList.toggle('rtl', state.lang.rtl);
    inp.placeholder = 'type the English word…';
    inp.classList.remove('l1-text','rtl');
    inp.removeAttribute('dir');
  } else {
    document.getElementById('prompt-lang').textContent = 'English';
    pw.textContent = state.current.word;
    pw.classList.remove('rtl');
    inp.placeholder = 'type it in ' + state.lang.label.split(' ').slice(1).join(' ') + '…';
    inp.classList.add('l1-text');
    if (state.lang.rtl) { inp.setAttribute('dir','rtl'); } else { inp.removeAttribute('dir'); }
  }
  document.getElementById('prompt-chapter').textContent = `Chapter ${state.current.ch}`;

  document.getElementById('hint-text').classList.add('hidden');
  document.getElementById('hint-text').textContent = state.current.meaning || '(no hint available)';
  document.getElementById('hint-btn').classList.remove('hidden');

  inp.value = '';
  inp.classList.remove('flash-correct','flash-wrong');
  inp.disabled = false;
  document.getElementById('check-btn').disabled = false;
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('feedback').className = 'feedback';

  updateProgress();
  inp.focus();
}

document.getElementById('hint-btn').addEventListener('click', () => {
  document.getElementById('hint-text').classList.remove('hidden');
  document.getElementById('hint-btn').classList.add('hidden');
});

function norm(s) {
  return s.toLowerCase().trim()
    .replace(/[-\u2010-\u2015\s]+/g, ' ')
    .replace(/[^a-z' ]/g, '');
}
// normaliser for non-English answers: strip spaces, punctuation, diacritic-insensitive latin
function normL1(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // strip latin diacritics (Vietnamese, Romanian)
    .replace(/[\u200c\u200d\u064b-\u065f\u0670]/g, '')        // strip ZWNJ/ZWJ + Arabic-script diacritics
    .replace(/[\s\u00a0]+/g, '')
    .replace(/[.,;:!?·。，、؛؟()（）'"'""-\u2010-\u2015\/]/g, '')
    .replace(/ي/g, 'ی').replace(/ك/g, 'ک')                    // Arabic ↔ Farsi/Urdu letter variants
    .toLowerCase();
}
function lev(a,b) {
  const m=a.length,n=b.length;
  if (Math.abs(m-n)>1) return 99;
  const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function isCorrect(guess, target) {
  const g = norm(guess), t = norm(target);
  if (!g) return false;
  if (g === t) return true;
  // allow one typo on longer words
  return t.length >= 6 && lev(g, t) <= 1;
}
// translation answers: accept any " / " variant; also accept if the guess
// matches a variant with bracketed glosses removed
function isCorrectL1(guess, targetField) {
  const g = normL1(guess);
  if (!g) return false;
  const variants = targetField.split('/').map(v => v.replace(/[（(].*?[)）]/g,'').trim()).filter(Boolean);
  for (const v of variants) {
    const t = normL1(v);
    if (!t) continue;
    if (g === t) return true;
    if (t.length >= 6 && lev(g, t) <= 1) return true;   // small slip on longer latin answers
  }
  return false;
}

function checkAnswer() {
  if (state.answered) return;
  const inp = document.getElementById('answer-input');
  const guess = inp.value;
  if (!guess.trim()) { inp.focus(); return; }

  state.answered = true;
  state.attempts++;
  inp.disabled = true;
  document.getElementById('check-btn').disabled = true;

  const fb = document.getElementById('feedback');
  const toEnglish = state.dir === 'l1-en';
  const langKey = state.lang.key;
  const word = state.current.word;
  const trans = state.current[langKey];
  const correct = toEnglish ? isCorrect(guess, word) : isCorrectL1(guess, trans);
  const answerShown = toEnglish ? word : trans;
  const revealCls = toEnglish ? '' : ' class="l1-text' + (state.lang.rtl ? ' rtl' : '') + '"';

  if (correct) {
    inp.classList.add('flash-correct');
    fb.className = 'feedback ok';
    fb.innerHTML = `<div class="big">✓ Correct — <span${revealCls}>${escapeHtml(answerShown)}</span></div>
      <div class="reveal">${escapeHtml(toEnglish ? (state.current.meaning||'') : word + ' — ' + (state.current.meaning||''))}</div>
      <button class="next-btn" id="next-btn">Next card →</button>`;
    // remove from circulation
    state.deck.shift();
    state.mastered.push(state.current);
    addToShelf(word);
  } else {
    inp.classList.add('flash-wrong');
    fb.className = 'feedback no';
    fb.innerHTML = `<div class="big">✗ Not quite</div>
      <div class="reveal">The answer was <strong${revealCls}>${escapeHtml(answerShown)}</strong> — ${escapeHtml(toEnglish ? (state.current.meaning||'') : word + ': ' + (state.current.meaning||''))}</div>
      <button class="next-btn" id="next-btn">Next card →</button>`;
    // keep in circulation: move to a random later position
    state.deck.shift();
    const pos = Math.min(state.deck.length, 2 + Math.floor(Math.random()*4));
    state.deck.splice(pos, 0, state.current);
  }
  document.getElementById('next-btn').addEventListener('click', nextCard);
  document.getElementById('next-btn').focus();
}

document.getElementById('check-btn').addEventListener('click', checkAnswer);
document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAnswer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && state.answered) {
    const nb = document.getElementById('next-btn');
    if (nb) { e.preventDefault(); nextCard(); }
  }
});

function addToShelf(word) {
  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.textContent = word;
  document.getElementById('shelf').appendChild(chip);
}

function updateProgress() {
  const total = state.mastered.length + state.deck.length;
  const done = state.mastered.length;
  document.getElementById('remaining-label').textContent =
    `${done} mastered · ${state.deck.length} to go`;
  document.getElementById('progress-fill').style.width =
    total ? (100*done/total)+'%' : '0%';
}

function finish() {
  const acc = state.attempts ? Math.round(100*state.mastered.length/state.attempts) : 0;
  document.getElementById('done-stats').textContent =
    `${state.mastered.length} words mastered in ${state.attempts} attempts (${acc}% accuracy)`;
  showScreen('done');
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

refreshSetup();
</script>
</body>
</html>
