<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">

<title>Homework — ELC Hub</title>
<style>
  :root {
    --bg:#f6f8fc; --card:#fff; --ink:#1c2333; --muted:#5b6478; --line:#e3e8f2;
    --accent:#0f766e; --soft:#ccfbf1; --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.07);
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#0f1420; --card:#171e2e; --ink:#fff; --muted:#c7d0e2; --line:#34405b; --accent:#5eead4; --soft:#123c39; --shadow:0 2px 10px rgba(0,0,0,.4); }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .shell { max-width:940px; margin:auto; padding:24px 18px 60px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
  .back { color:var(--accent); font-weight:800; text-decoration:none; }
  .back:hover { text-decoration:underline; }
  .language-select { border:1px solid var(--line); border-radius:999px; padding:7px 11px; background:var(--card); color:var(--ink); font-weight:750; }
  .hero { padding:28px; border-radius:20px; background:linear-gradient(135deg,#0f766e,#0d9488 55%,#0284c7); color:#fff; box-shadow:var(--shadow); }
  .eyebrow { margin:0 0 5px; font-size:.74rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; opacity:.88; }
  .hero h1 { margin:0; font-size:clamp(1.8rem,5.5vw,2.7rem); letter-spacing:-.5px; }
  .hero p { max-width:640px; margin:8px 0 0; }

  section { margin-top:34px; }
  section h2 { font-size:1.25rem; display:flex; align-items:center; gap:9px; }
  section > .blurb { color:var(--muted); font-size:.92rem; margin-top:4px; }
  section > h2 + .blurb { margin-top:6px; }
  .rule { height:2px; background:var(--line); border-radius:2px; margin-top:10px; }

  .grid { display:grid; gap:14px; margin-top:16px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
  .item { display:flex; flex-direction:column; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px; text-decoration:none; color:inherit; box-shadow:var(--shadow); }
  a.item { transition:transform .12s,border-color .12s; }
  a.item:hover { transform:translateY(-3px); border-color:var(--accent); }
  .item .emoji { font-size:1.5rem; line-height:1; }
  .item h3 { font-size:1rem; }
  .item p { font-size:.87rem; color:var(--muted); }
  .item .go { margin-top:auto; padding-top:8px; color:var(--accent); font-weight:800; font-size:.83rem; }
  .item .offline { margin-top:auto; padding-top:8px; color:var(--muted); font-weight:700; font-size:.83rem; }
  .note { margin-top:14px; padding:11px 13px; border-radius:11px; background:var(--soft); color:var(--ink); font-size:.87rem; }

  .prompt { background:var(--card); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); }
  .prompt + .prompt { margin-top:12px; }
  .prompt .tag { font-size:.72rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .prompt h3 { margin-top:4px; font-size:1.05rem; }
  .prompt p { margin-top:6px; font-size:.92rem; color:var(--muted); }
  .empty-prompt { margin-top:16px; padding:18px; border:2px dashed var(--line); border-radius:var(--radius); color:var(--muted); font-size:.92rem; text-align:center; }
  .steps { margin-top:14px; padding:14px 16px; border-radius:var(--radius); background:var(--card); border:1px solid var(--line); }
  .steps h3 { font-size:.95rem; }
  .steps ol { margin:8px 0 0 18px; font-size:.89rem; color:var(--muted); }
  .steps li { margin-top:4px; }

  .tips { display:grid; gap:14px; margin-top:16px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
  .tip { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow); }
  .tip h3 { font-size:.78rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  .tip p { margin-top:6px; font-size:.88rem; color:var(--muted); }

  .privacy { margin-top:26px; padding:10px 13px; border-radius:11px; background:var(--card); border:1px solid var(--line); color:var(--muted); font-size:.82rem; text-align:center; }
  @media (max-width:620px) { .shell { padding:16px 12px 44px; } .hero { padding:22px; } }
</style>
</head>

/* ═══════════════════ END OF DATA BLOCK — code below ═══════════════════ */

const VISITS_KEY = "elc_visited";
const LANG_KEY = "elc_page_language";
const LANG_KEYS = { en:"en", "zh-Hans":"zhHans", "zh-Hant":"zhHant" };
let langKey = "en";

function t(entry) {
  if (!entry) return "";
  return entry[langKey] || entry.en || "";
}

function element(tag, className, textContent) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (textContent) node.textContent = textContent;
  return node;
}

function sectionHead(parent, emoji, titleEntry, blurbEntry) {
  parent.append(element("h2", null, `${emoji} ${t(titleEntry)}`));
  if (blurbEntry) parent.append(element("p", "blurb", t(blurbEntry)));
  parent.append(element("div", "rule"));
}

function renderItem(item, categoryTitle) {
  const isLink = Boolean(item.href);
  const node = document.createElement(isLink ? "a" : "div");
  node.className = "item";
  if (isLink) {
    node.href = item.href;
    node.dataset.cat = categoryTitle;
    node.dataset.title = item.title.en;
    if (item.external) { node.target = "_blank"; node.rel = "noopener"; }
  }
  node.append(element("span", "emoji", item.emoji));
  node.querySelector(".emoji").setAttribute("aria-hidden", "true");
  node.append(element("h3", null, t(item.title)));
  node.append(element("p", null, t(item.text)));
  node.append(isLink
    ? element("span", "go", item.external ? t(UI.openNew) : t(UI.open))
    : element("span", "offline", t(UI.noLink)));
  return node;
}

function renderWritingSection() {
  const section = element("section");
  section.id = "writing";
  sectionHead(section, "🖊️", UI.writingTitle, UI.writingBlurb);

  if (WRITING_PROMPTS.length === 0) {
    section.append(element("p", "empty-prompt", t(UI.writingEmpty)));
  } else {
    const list = element("div");
    list.style.marginTop = "16px";
    WRITING_PROMPTS.forEach(prompt => {
      const card = element("div", "prompt");
      if (prompt.tag) card.append(element("span", "tag", t(prompt.tag)));
      card.append(element("h3", null, t(prompt.title)));
      if (prompt.detail) card.append(element("p", null, t(prompt.detail)));
      list.append(card);
    });
    section.append(list);
  }

  const steps = element("div", "steps");
  steps.append(element("h3", null, t(UI.stepsTitle)));
  const ordered = document.createElement("ol");
  [UI.step1, UI.step2, UI.step3, UI.step4].forEach(step => ordered.append(element("li", null, t(step))));
  steps.append(ordered);
  section.append(steps);
  return section;
}

function renderTipsSection() {
  const section = element("section");
  sectionHead(section, "✅", UI.tipsTitle);
  const grid = element("div", "tips");
  TIPS.forEach(tip => {
    const card = element("div", "tip");
    card.append(element("h3", null, t(tip.title)));
    card.append(element("p", null, t(tip.text)));
    grid.append(card);
  });
  section.append(grid);
  return section;
}

function renderPage() {
  document.getElementById("backLink").textContent = t(UI.back);
  document.getElementById("heroEyebrow").textContent = t(UI.eyebrow);
  document.getElementById("heroTitle").textContent = t(UI.title);
  document.getElementById("heroIntro").textContent = t(UI.intro);
  document.getElementById("privacyNote").textContent = t(UI.privacy);

  const host = document.getElementById("sections");
  host.replaceChildren();
  host.append(renderWritingSection());

  SECTIONS.forEach(group => {
    const section = element("section");
    section.id = group.id;
    sectionHead(section, group.emoji, group.title, group.blurb);
    const grid = element("div", "grid");
    group.items.forEach(item => grid.append(renderItem(item, group.title.en)));
    section.append(grid);
    if (group.note) section.append(element("p", "note", t(group.note)));
    host.append(section);
  });

  host.append(renderTipsSection());
  wireActivityRecord();
}

function wireActivityRecord() {
  document.querySelectorAll("a.item").forEach(card => {
    card.addEventListener("click", () => {
      let visits = [];
      try { visits = JSON.parse(localStorage.getItem(VISITS_KEY) || "[]"); } catch (e) {}
      if (!Array.isArray(visits)) visits = [];
      visits = visits.filter(item => item.title !== card.dataset.title);
      visits.push({ title:card.dataset.title, cat:card.dataset.cat, ts:Date.now() });
      localStorage.setItem(VISITS_KEY, JSON.stringify(visits));
    });
  });
}

function setPageLanguage(lang) {
  langKey = LANG_KEYS[lang] || "en";
  if (!LANG_KEYS[lang]) lang = "en";
  document.documentElement.lang = lang === "en" ? "en-AU" : lang;
  document.getElementById("pageLanguage").value = lang;
  localStorage.setItem(LANG_KEY, lang);
  renderPage();
}

document.getElementById("pageLanguage").addEventListener("change", e => setPageLanguage(e.target.value));
setPageLanguage(localStorage.getItem(LANG_KEY) || "en");
</script>
