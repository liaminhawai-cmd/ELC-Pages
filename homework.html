<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ELC homework — this week's writing prompts, the assigned practice apps, and places to read and listen.">
<title>Homework — ELC Hub</title>
<style>
  :root {
    --bg:#f6f8fc; --card:#fff; --ink:#1c2333; --muted:#5b6478; --line:#e3e8f2;
    --accent:#0f766e; --soft:#ccfbf1; --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.07);
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#0f1420; --card:#171e2e; --ink:#fff; --muted:#c7d0e2; --line:#34405b; --accent:#5eead4; --soft:#123c39; --shadow:0 2px 10px rgba(0,0,0,.4); }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .shell { max-width:1180px; margin:auto; padding:20px 18px 56px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
  .back { color:var(--accent); font-weight:800; text-decoration:none; }
  .back:hover { text-decoration:underline; }
  .language-select { border:1px solid var(--line); border-radius:999px; padding:7px 11px; background:var(--card); color:var(--ink); font-weight:750; }
  .hero { padding:20px 24px; border-radius:18px; background:linear-gradient(135deg,#0f766e,#0d9488 55%,#0284c7); color:#fff; box-shadow:var(--shadow); }
  .eyebrow { margin:0 0 3px; font-size:.72rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; opacity:.88; }
  .hero h1 { margin:0; font-size:clamp(1.5rem,4vw,2rem); letter-spacing:-.5px; }
  .hero p { max-width:640px; margin:6px 0 0; font-size:.92rem; opacity:.96; }

  /* ── layout: two lanes on wide screens, stacked on narrow ─────────── */
  .layout { display:grid; grid-template-columns:1fr; gap:20px; margin-top:20px; }
  @media (min-width:920px) { .layout { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start; } }

  .card-block { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; }
  .card-block + .card-block { margin-top:16px; }
  .card-block h2 { font-size:1.05rem; display:flex; align-items:center; gap:8px; }
  .card-block > .blurb { color:var(--muted); font-size:.86rem; margin-top:3px; }

  .sheet-button { display:inline-block; margin-top:12px; padding:11px 18px; border-radius:11px;
    background:var(--accent); color:#fff; font-weight:700; text-decoration:none; font-size:.92rem; }
  .sheet-button:hover { filter:brightness(1.08); }

  /* writing prompts */
  .prompt-now { margin-top:12px; background:linear-gradient(160deg,var(--soft),transparent 130%); border:1.5px solid var(--accent); border-radius:12px; padding:13px 15px; }
  .prompt-now .tag { display:inline-block; font-size:.68rem; font-weight:900; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); background:var(--card); padding:2px 9px; border-radius:999px; }
  .prompt-now h3 { margin-top:6px; font-size:1.05rem; }
  .prompt-now p { margin-top:5px; font-size:.9rem; color:var(--muted); }
  .prompt-hint { margin-top:10px; font-size:.84rem; color:var(--muted); }

  .prompt-list { margin-top:12px; border-top:1px solid var(--line); }
  .prompt-list details { border-bottom:1px solid var(--line); }
  .prompt-list summary { list-style:none; cursor:pointer; padding:9px 2px; display:flex; align-items:baseline; gap:9px; font-size:.88rem; }
  .prompt-list summary::-webkit-details-marker { display:none; }
  .prompt-list summary::before { content:"▸"; color:var(--muted); font-size:.75rem; transition:transform .12s; flex:none; }
  .prompt-list details[open] summary::before { transform:rotate(90deg); }
  .prompt-list summary .tag { flex:none; font-size:.72rem; font-weight:800; color:var(--accent); min-width:6.5em; }
  .prompt-list summary .ttl { font-weight:650; }
  .prompt-list .detail { padding:0 2px 12px 24px; font-size:.87rem; color:var(--muted); }
  .prompt-list details.current summary .ttl::after { content:" — this week"; font-weight:700; color:var(--accent); }

  .steps { margin-top:14px; padding:12px 14px; border-radius:11px; background:var(--bg); border:1px solid var(--line); }
  .steps h3 { font-size:.85rem; }
  .steps ol { margin:7px 0 0 18px; font-size:.85rem; color:var(--muted); }
  .steps li { margin-top:3px; }

  /* ── tabs (matches the Pronunciation Hub pattern) ──────────────────── */
  .tabs { display:flex; flex-wrap:wrap; gap:6px; }
  .tabs button { font-size:.82rem; padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--accent); color:#fff; border-color:transparent; font-weight:700; }
  .panel { display:none; }
  .panel.on { display:block; }
  .panel > .blurb { color:var(--muted); font-size:.86rem; margin:10px 0 0; }
  .panel > .note { margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--soft); color:var(--ink); font-size:.85rem; }

  .grid { display:grid; gap:12px; margin-top:14px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  .item { display:flex; flex-direction:column; gap:5px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:13px; text-decoration:none; color:inherit; }
  a.item { transition:transform .12s,border-color .12s; }
  a.item:hover { transform:translateY(-2px); border-color:var(--accent); }
  .item .emoji { font-size:1.35rem; line-height:1; }
  .item h3 { font-size:.92rem; }
  .item p { font-size:.81rem; color:var(--muted); }
  .item .go { margin-top:auto; padding-top:6px; color:var(--accent); font-weight:800; font-size:.78rem; }
  .item .offline { margin-top:auto; padding-top:6px; color:var(--muted); font-weight:700; font-size:.78rem; }

  /* tips: compact strip, always visible */
  .tips-strip { display:grid; gap:10px; margin-top:10px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .tip { background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:11px 13px; }
  .tip h3 { font-size:.72rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
  .tip p { margin-top:4px; font-size:.83rem; color:var(--muted); }

  .privacy { margin-top:20px; padding:9px 13px; border-radius:11px; background:var(--card); border:1px solid var(--line); color:var(--muted); font-size:.8rem; text-align:center; }
  @media (max-width:620px) { .shell { padding:14px 12px 40px; } .hero { padding:18px; } .card-block { padding:14px 15px; } }
</style>
</head>
<body>
<main class="shell">
  <div class="top">
    <a class="back" href="index.html" id="backLink">← ELC Hub</a>
    <select class="language-select" id="pageLanguage" aria-label="Page language">
      <option value="en">English</option>
      <option value="zh-Hans">简体中文（中国）</option>
      <option value="zh-Hant">繁體中文（台灣）</option>
    </select>
  </div>

  <header class="hero">
    <p class="eyebrow" id="heroEyebrow">Homework</p>
    <h1 id="heroTitle">📓 Homework</h1>
    <p id="heroIntro">Use the assigned app for phonics and grammar. For reading and listening, choose material that interests you and is at a useful level.</p>
  </header>

  <div class="layout">
    <div id="laneLeft"></div>
    <div id="laneRight"></div>
  </div>

  <p class="privacy" id="privacyNote">🔒 No account and no name. This page only stores which links you opened, on this device.</p>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   DATA BLOCK — teachers edit below this line. Nothing here is code.
   Every visible string has three versions: en · zhHans (中国) · zhHant (台灣).
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 0. CLASS HOMEWORK SHEET ────────────────────────────────────────────

   click straight through to each one.

   Leave this as "" and no button appears.

   Before filling it in, the sheet you point at must:
     • contain NO student names, emails, scores or Yes/No completion columns
       — a link to a Google Sheet opens the WHOLE file, and any viewer can
       click to any other tab, so a hidden tab is not protection;

   ────────────────────────────────────────────────────────────────────── */
const HOMEWORK_SHEET = "";

       title:{en:"...", zhHans:"...", zhHant:"..."},
       detail:{en:"...", zhHans:"...", zhHant:"..."} },

   ────────────────────────────────────────────────────────────────────── */
const CURRENT_WEEK = "";

const WRITING_PROMPTS = [

             zhHant:"ELC 應該取消家庭作業嗎？說出你的觀點，給出兩個有力的理由。老師會怎樣反駁你？請回應。" } },
  { tag:{ en:"Term 3 · Week 10", zhHans:"第3学期 · 第10周", zhHant:"第3學期 · 第10週" },

             zhHant:"比較你家鄉和澳洲的生活。想想學校、食物、家庭和空閒時間。哪些相同？哪些不同？最讓你意外的是什麼？" } },

  { tag:{ en:"Term 4 · Week 4", zhHans:"第4学期 · 第4周", zhHant:"第4學期 · 第4週" },

const VISITS_KEY = "elc_visited";
const LANG_KEY = "elc_page_language";
const LANG_KEYS = { en:"en", "zh-Hans":"zhHans", "zh-Hant":"zhHant" };
let langKey = "en";
let activeTab = SECTIONS[0].id;

function t(entry) {
  if (!entry) return "";
  return entry[langKey] || entry.en || "";
}

function element(tag, className, textContent) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (textContent) node.textContent = textContent;
  return node;
}

function renderItem(item, categoryTitle) {
  const isLink = Boolean(item.href);
  const node = document.createElement(isLink ? "a" : "div");
  node.className = "item";
  if (isLink) {
    node.href = item.href;
    node.dataset.cat = categoryTitle;
    node.dataset.title = item.title.en;
    if (item.external) { node.target = "_blank"; node.rel = "noopener"; }
  }
  node.append(element("span", "emoji", item.emoji));
  node.querySelector(".emoji").setAttribute("aria-hidden", "true");
  node.append(element("h3", null, t(item.title)));
  node.append(element("p", null, t(item.text)));
  node.append(isLink
    ? element("span", "go", item.external ? t(UI.openNew) : t(UI.open))
    : element("span", "offline", t(UI.noLink)));
  return node;
}

/* ── left lane: sheet button + writing prompts (always visible, no tab) ── */
function renderLeftLane() {
  const lane = document.getElementById("laneLeft");
  lane.replaceChildren();

  if (HOMEWORK_SHEET) {
    const block = element("div", "card-block");
    block.append(element("h2", null, t(UI.sheetTitle)));
    block.append(element("p", "blurb", t(UI.sheetBlurb)));
    const a = element("a", "sheet-button", t(UI.sheetButton));
    a.href = HOMEWORK_SHEET;
    a.target = "_blank";
    a.rel = "noopener";
    a.dataset.cat = "Homework";
    a.dataset.title = "Homework sheet";
    block.append(a);
    lane.append(block);
  }

  const block = element("div", "card-block");
  block.id = "writing";
  block.append(element("h2", null, "🖊️ " + t(UI.writingTitle)));
  block.append(element("p", "blurb", t(UI.writingBlurb)));

  const current = WRITING_PROMPTS.find(p => p.tag.en === CURRENT_WEEK);
  if (current) {
    const card = element("div", "prompt-now");
    card.append(element("span", "tag", t(current.tag)));
    card.append(element("h3", null, t(current.title)));
    card.append(element("p", null, t(current.detail)));
    block.append(card);
  } else if (WRITING_PROMPTS.length) {
    block.append(element("p", "prompt-hint", t(UI.pickWeek)));
  }

  if (WRITING_PROMPTS.length) {
    const list = element("div", "prompt-list");
    WRITING_PROMPTS.forEach(prompt => {
      const isCurrent = prompt.tag.en === CURRENT_WEEK;
      const d = document.createElement("details");
      if (isCurrent) d.className = "current";
      const s = document.createElement("summary");
      s.append(element("span", "tag", t(prompt.tag)));
      s.append(element("span", "ttl", t(prompt.title)));
      d.append(s);
      if (prompt.detail) d.append(element("p", "detail", t(prompt.detail)));
      list.append(d);
    });
    block.append(list);
  }

  const steps = element("div", "steps");
  steps.append(element("h3", null, t(UI.stepsTitle)));
  const ordered = document.createElement("ol");
  [UI.step1, UI.step2, UI.step3, UI.step4].forEach(step => ordered.append(element("li", null, t(step))));
  steps.append(ordered);
  block.append(steps);

  lane.append(block);
}

/* ── right lane: tabs across the browsing categories, then tips ─────── */
function renderRightLane() {
  const lane = document.getElementById("laneRight");
  lane.replaceChildren();

  const block = element("div", "card-block");

  const tabs = element("div", "tabs");
  tabs.setAttribute("role", "tablist");
  SECTIONS.forEach(group => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("role", "tab");
    btn.dataset.tab = group.id;
    btn.setAttribute("aria-selected", String(group.id === activeTab));
    btn.textContent = `${group.emoji} ${t(group.title)}`;
    tabs.append(btn);
  });
  block.append(tabs);

  SECTIONS.forEach(group => {
    const panel = element("div", "panel" + (group.id === activeTab ? " on" : ""));
    panel.id = "tab-" + group.id;
    if (group.blurb) panel.append(element("p", "blurb", t(group.blurb)));
    const grid = element("div", "grid");
    group.items.forEach(item => grid.append(renderItem(item, group.title.en)));
    panel.append(grid);
    if (group.note) panel.append(element("p", "note", t(group.note)));
    block.append(panel);
  });

  lane.append(block);

  const tipsBlock = element("div", "card-block");
  tipsBlock.append(element("h2", null, t(UI.tipsTitle)));
  const tipsGrid = element("div", "tips-strip");
  TIPS.forEach(tip => {
    const card = element("div", "tip");
    card.append(element("h3", null, t(tip.title)));
    card.append(element("p", null, t(tip.text)));
    tipsGrid.append(card);
  });
  tipsBlock.append(tipsGrid);
  lane.append(tipsBlock);
}

function renderPage() {
  document.getElementById("backLink").textContent = t(UI.back);
  document.getElementById("heroEyebrow").textContent = t(UI.eyebrow);
  document.getElementById("heroTitle").textContent = t(UI.title);
  document.getElementById("heroIntro").textContent = t(UI.intro);
  document.getElementById("privacyNote").textContent = t(UI.privacy);

  renderLeftLane();
  renderRightLane();
  wireActivityRecord();
}

function wireActivityRecord() {
  document.querySelectorAll("a.item, a.sheet-button").forEach(card => {
    card.addEventListener("click", () => {
      let visits = [];
      try { visits = JSON.parse(localStorage.getItem(VISITS_KEY) || "[]"); } catch (e) {}
      if (!Array.isArray(visits)) visits = [];
      visits = visits.filter(item => item.title !== card.dataset.title);
      visits.push({ title:card.dataset.title, cat:card.dataset.cat, ts:Date.now() });
      localStorage.setItem(VISITS_KEY, JSON.stringify(visits));
    });
  });
}

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (!tab) return;
  activeTab = tab.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b === tab)));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "tab-" + tab.dataset.tab));
});

// A link from outside this page (a printed sheet, a tracker spreadsheet) can
// point at one part of it — #tab-reading, #tab-listening, #writing — and land
// there directly instead of at the top. If the hash names a real tab, that
// tab is what renders as active; either way, once the DOM exists, scroll the
// target into view.
function applyHash() {
  const id = location.hash.slice(1);
  if (!id) return;
  if (id.startsWith("tab-") && SECTIONS.some(g => "tab-" + g.id === id)) {
    activeTab = id.slice(4);
  }
}
function scrollToHash() {
  const id = location.hash.slice(1);
  if (!id) return;
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function setPageLanguage(lang) {
  langKey = LANG_KEYS[lang] || "en";
  if (!LANG_KEYS[lang]) lang = "en";
  document.documentElement.lang = lang === "en" ? "en-AU" : lang;
  document.getElementById("pageLanguage").value = lang;
  localStorage.setItem(LANG_KEY, lang);
  applyHash();
  renderPage();
}

document.getElementById("pageLanguage").addEventListener("change", e => setPageLanguage(e.target.value));
window.addEventListener("hashchange", () => { applyHash(); renderPage(); scrollToHash(); });
setPageLanguage(localStorage.getItem(LANG_KEY) || "en");
scrollToHash();
</script>
</body>
</html>
