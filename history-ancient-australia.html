    <h1>Ancient Australia</h1>
    <p>Eight lessons on the Kulin Nation and Wurundjeri people: migration, Country, the Dreaming, kinship, trade, Lake Mungo and conservation.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Lessons" id="lessonTabs"></nav>

  <div id="lessons"></div>
</div>

<script>
/* ============================================================
   CONTENT DATA — edit lessons/steps here. Nothing below this
   block needs to change to add or edit lesson content.
   Sources: ELC Humanities Course Planner 2024 (Unit 2 — Ancient
   Australia), rebuilt as an interactive activity, not reproduced
   as-is. External links are the exact ones used in that planner.
   ============================================================ */
const LESSONS = [
{id:"migration",title:"1. Migration",subtitle:"How did people first arrive, tens of thousands of years ago?",
 li:"Understand how the first people came to Australia, tens of thousands of years ago.",
 sc:["I can outline the scientific 'Out of Africa' account.","I can describe the Aboriginal and Torres Strait Islander account of how the first people came to be here.","I can compare how scientists and Aboriginal and Torres Strait Islander people understand this history."],
 steps:[
  {phase:"Engage",blocks:[
    {t:"p",text:"Watch the first part of <i>First Peoples: Australia</i> (PBS/NOVA). It is a long documentary (about 21 minutes) — your teacher may play all or part of it."},
    {t:"link",label:"First Peoples: Australia — PBS/NOVA",url:"https://www.youtube.com/watch?v=00Wa7W3nzEs",dur:"~21 min"},
    {t:"write",id:"mig-e1",q:"Why is Mungo Man significant?"},
    {t:"write",id:"mig-e2",q:"About how old are Mungo Man's bones thought to be?"},
    {t:"write",id:"mig-e3",q:"Where do scientists think the first Australians travelled from?"},
    {t:"write",id:"mig-e4",q:"How was that journey possible?"}
  ]},
  {phase:"Discover & Develop",blocks:[
    {t:"p",text:"There are two different accounts of how people first came to be in Australia. Historians and scientists use <span class=\"term\">evidence</span> to build their account; Aboriginal and Torres Strait Islander peoples have their own account, passed down for tens of thousands of years."},
    {t:"p",text:"<b>The scientific account ('Out of Africa'):</b> around 100,000 years ago, early humans began moving out of Africa, likely looking for new hunting grounds and places to settle. Scientists think people reached Australia by walking — sea levels were much lower in the ice age, so land bridges joined many islands — and by travelling short distances across water on boats or canoes."},
    {t:"p",text:"<b>The Aboriginal and Torres Strait Islander account:</b> according to the beliefs of many Aboriginal and Torres Strait Islander peoples, they have lived in Australia since the beginning of time — since ancestor spirits came up through the earth and down from the sky, and took human form."},
    {t:"table",id:"mig-cmp",cols:["","The scientific account","The Aboriginal and Torres Strait Islander account"],
     rows:[["When?","mig-cmp-sci-when","mig-cmp-atsi-when"],["How?","mig-cmp-sci-how","mig-cmp-atsi-how"],["Where from?","mig-cmp-sci-where","mig-cmp-atsi-where"]]},
    {t:"write",id:"mig-d1",q:"Why might it matter that there are two different accounts of this history, and that both are taken seriously?"}
  ]},
  {phase:"Apply",blocks:[
    {t:"note",text:"<b>Class activity (no screen):</b> in small groups, each group gets one keyword in an envelope — <i>Aboriginal, Migration, Dreaming, Mungo Man</i>. Explain the word to your group in under a minute, without saying the word itself. The rest of the class guesses."},
    {t:"p",text:"<b>Extension:</b> research the history of Aboriginal peoples in Tasmania (the Palawa people)."},
    {t:"write",id:"mig-ext",q:"List three ways their culture and way of life differed from groups on the mainland. What were the reasons for these differences?",big:true}
  ]},
  {phase:"Review & Reflect",blocks:[
    {t:"write",id:"mig-r1",q:"In your own words: what does 'migration' mean?"},
    {t:"write",id:"mig-r2",q:"In your own words: what is 'the Dreaming'?"},
    {t:"write",id:"mig-r3",q:"In your own words: who was Mungo Man, and why does he matter?"}
  ]}
 ]},

{id:"geography",title:"2. Geography & seasons",subtitle:"How did land and climate shape life and language?",
 li:"Understand how land and geography shaped Aboriginal and Torres Strait Islander communities.",
 sc:["I can identify primary and secondary sources.","I can describe how land and climate shaped diet, shelter, clothing and custom.","I can explain why so many different languages existed across ancient Australia."],
 steps:[
  {phase:"Engage",blocks:[
    {t:"p",text:"Before 1788, more than 250 distinct Aboriginal languages were spoken across the continent, each tied to a particular Country."},
    {t:"write",id:"geo-e1",q:"Write your first idea: why might a continent this size have so many separate languages and nations, instead of just one?"}
  ]},
  {phase:"Discover & Develop",blocks:[
    {t:"p",text:"Studying ancient Australia is hard for historians, for a few reasons: most Aboriginal cultures did not leave permanent buildings behind the way some other ancient civilisations did; there was no system of writing to leave written records; and after 1788, many Aboriginal groups were forcibly moved off their land, many people died from introduced European diseases, and a great deal of cultural knowledge was lost."},
    {t:"p",text:"Historians piece together the story using two kinds of source. A <span class=\"term\">primary source</span> is evidence made <i>at the time</i> being studied — not just any old object, but something from that actual period, like oral tradition, rock art or an archaeological find. A <span class=\"term\">secondary source</span> is made <i>after</i> the time being studied, to explain it — not just any book, but something written about that period, like a textbook or a website. Historians need both to build an accurate picture."},
    {t:"table",id:"geo-ps",cols:["","Primary sources","Secondary sources"],
     rows:[["Definition in your own words","geo-ps-def-p","geo-ps-def-s"],["3 examples","geo-ps-ex-p","geo-ps-ex-s"],["1 advantage","geo-ps-adv-p","geo-ps-adv-s"],["1 disadvantage","geo-ps-dis-p","geo-ps-dis-s"]]},
    {t:"p",text:"<b>Geography.</b> Australia's climates range from tropical rainforest to desert to cool coast. Coastal and river groups, such as the Kulin Nation around Port Phillip Bay and the Yarra River (Birrarung), built diets around fish, shellfish and eels, and used reeds and bark for shelters and canoes. Desert groups relied on deep knowledge of where water and food could be found across a much larger range."},
    {t:"p",text:"<b>Seasons.</b> Many Aboriginal nations, including the Kulin Nation, tracked more than the four seasons used in Europe — some Kulin seasonal calendars describe up to seven seasons, each signalled by plant flowering, animal behaviour or weather, and each telling people when to move camp, hunt or gather a particular food."},
    {t:"p",text:"<b>Languages.</b> Because groups were tied to a specific Country and travelled within it rather than across the whole continent, separate languages developed over tens of thousands of years — in the same way that distance and time produced many different languages across Europe or Asia."},
    {t:"write",id:"geo-d1",q:"Pick one of geography, seasons or language. Explain in 2-3 sentences how it shaped daily life for a group like the Kulin Nation."}
  ]},
  {phase:"Apply",blocks:[
    {t:"p",text:"Use what you've just read to answer these."},
    {t:"write",id:"geo-a1",q:"Why do you think coastal groups and desert groups developed very different ways of life, even though both were 'Aboriginal Australia'?"},
    {t:"write",id:"geo-a2",q:"Give one piece of evidence that the Kulin Nation's knowledge of seasons was detailed and precise."},
    {t:"write",id:"geo-a3",q:"Explain, in your own words, why there wasn't just one Aboriginal language across the whole continent."}
  ]},
  {phase:"Review & Reflect",blocks:[
    {t:"write",id:"geo-r1",q:"What is a primary source?"},
    {t:"write",id:"geo-r2",q:"What is a secondary source?"},
    {t:"write",id:"geo-r3",q:"Name one thing you learned today."},
    {t:"write",id:"geo-r4",q:"What is one question you still have?"}
  ]}
 ]},

{id:"dreaming",title:"3. Beliefs & the Dreaming",subtitle:"What is the Dreaming, and why does it matter?",
 li:"Understand the Dreaming, and why it matters to the Kulin Nation.",
 sc:["I can define the Dreaming.","I can describe an example of a Dreaming story.","I can explain why the Dreaming matters to Aboriginal people today."],
 steps:[
  {phase:"Engage",blocks:[
    {t:"quote",text:"The 'Dreaming' is First Nations peoples' understanding of the world and its creation. Passed from generation to generation through storytelling, the Dreaming shares beliefs connected to Country and the natural world. These stories cover creation, rules for living, and right behaviour.",cite:null},
    {t:"p",text:"The Kulin Nation — the traditional owners of the greater Melbourne area — believe the land was created as part of the Dreaming. Their creation stories describe how spiritual ancestors shaped the landscape and everything living on it. The Kulin Nation's main spiritual ancestor is <span class=\"term\">Bunjil</span>, the eagle, who is said to have created the land, sea, rivers, mountains, animals and trees."},
    {t:"link",label:"Bunjil the Eagle — creation story",url:"https://vimeo.com/97185996",dur:"~4 min"}
  ]},
  {phase:"Discover & Develop",blocks:[
    {t:"p",text:"Bunjil created Birrarung (the Yarra River) along with the rest of the Kulin Nation's Country. A large sculpture of Bunjil now stands in Docklands, in inner Melbourne."},
    {t:"link",label:"Joy Murphy-Wandin (Wurundjeri elder) speaking about Bunjil — Yarra Healing",url:"http://www.yarrahealing.catholic.edu.au/stories-voices/index.cfm?loadref=79",dur:"~2.5 min"},
    {t:"write",id:"dr-d1",q:"Who is Bunjil to the Kulin Nation?"},
    {t:"write",id:"dr-d2",q:"What do creation stories like this one explain?"},
    {t:"write",id:"dr-d3",q:"Why might it matter that a large sculpture of Bunjil was placed in a newly developed part of Melbourne?"},
    {t:"write",id:"dr-d4",q:"After listening to Joy Murphy-Wandin: in your own words, how does Bunjil continue to matter to the Wurundjeri people today?"}
  ]},
  {phase:"Apply",blocks:[
    {t:"p",text:"Build a one-page fact file on the importance of the Dreaming to Australia's First Peoples."},
    {t:"factfile",id:"dr-ff",fields:[
      {id:"def",label:"DEFINITION — what is the Dreaming? How do Australia's First Peoples believe the mountains, rivers, forests and deserts were created?"},
      {id:"land",label:"DREAMING & THE LAND — why is the land so important?"},
      {id:"law",label:"DREAMING & THE LAW — what is the link between the Dreaming and the law?"},
      {id:"view",label:"VIEW OF THE WORLD — how do European and First Peoples' views of land and property differ?"},
      {id:"examples",label:"EXAMPLES — research online to find two or three Dreaming stories not covered in class (Tiddalik the frog and the Wagyl rainbow serpent are a good place to start). For each, briefly describe it and explain what lesson it teaches — a natural event, a danger, a relationship, or right behaviour."}
    ]}
  ]},
  {phase:"Review & Reflect",blocks:[
    {t:"write",id:"dr-r1",q:"Exit ticket: write three things you learned this lesson.",big:true}
  ]}
 ]},

{id:"country",title:"4. Living off the land",subtitle:"How did people live from Country, including land management and food?",
 li:"Understand how Australia's First Peoples lived from the land, including land management, hunting and fishing.",
 sc:["I can define 'Country'.","I can describe land management, hunting, gathering and medicine methods.","I can analyse historical sources about life in ancient Australia."],
 steps:[
  {phase:"Engage",blocks:[
    {t:"link",label:"Joseph Lycett, Aboriginal people spearing fish, c.1817 — National Library of Australia",url:"http://www.nla.gov.au/apps/cdview/?pi=nla.pic-an2962715-s17&referercode=cat",dur:null},
    {t:"p",text:"Look at the painting at the link above before you answer."},
    {t:"write",id:"ctry-e1",q:"SEE — what do you see in the painting?"},
    {t:"write",id:"ctry-e2",q:"THINK — what do you think is going on?"},
    {t:"write",id:"ctry-e3",q:"WONDER — what does it make you wonder?"}
  ]},
  {phase:"Discover & Develop",blocks:[
    {t:"p",text:"Land is of great significance to Aboriginal and Torres Strait Islander peoples — the connection felt to <span class=\"term\">Country</span> can be a difficult concept for non-Indigenous people to grasp. For First Nations people, Country is an interdependent relationship between a person and their ancestral lands and seas — not land as property, but land as identity, sustained by a two-way relationship between people and the environment."},
    {t:"quote",text:"The land is the mother and we are of the land; we do not own the land rather the land owns us. The land is our food, our culture, our spirit and our identity.",cite:"Dennis Foley, Gai-mariagal and Wiradjuri man, Fulbright scholar"},
    {t:"p",text:"When people talk about Country, it is often spoken of like a person: people speak to Country, sing to Country, worry about Country, and long for Country."},
    {t:"write",id:"ctry-d1",q:"In your own words, what makes 'Country' different from just owning land?"}
  ]},
  {phase:"Apply",blocks:[
    {t:"p",text:"Australia's First Peoples adapted the resources they found to build shelters, manage their environments, make tools, weapons and musical instruments, make carry bags, water containers and cradles, and to stay warm, fed and watered."},
    {t:"p",text:"<b>Firestick farming</b> — deliberately, carefully burning small areas of land — was used by many groups, including around the Kulin Nation's Country, to clear undergrowth, encourage new plant growth that attracted animals to hunt, and reduce the risk of large, uncontrolled bushfires."},
    {t:"write",id:"ctry-a1",q:"How important do you think firestick farming was to the Aboriginal way of life? How did it affect the environment?"},
    {t:"write",id:"ctry-a2",q:"What do you think the consequences were for the land once firestick farming largely stopped, after 1788?"},
    {t:"p",text:"<b>Bush medicine.</b> Aboriginal peoples across Australia used plants for medicine. In Victoria, the Wurundjeri people valued the manna gum tree — its sap dries into a sweet, edible substance called manna, and the tree had food and medicinal uses."},
    {t:"write",id:"ctry-a3",q:"Why do you think a single tree, like the manna gum, could matter this much to a community?"},
    {t:"venn",id:"ctry-venn",left:"Gathering food — often done by women and children (e.g. plants, shellfish, small game)",mid:"Shared knowledge of Country, seasons and food sources",right:"Hunting larger game — often done by men (e.g. kangaroo, emu)",note:"Research or discuss: how were food-gathering roles shared in Aboriginal communities? What was shared between roles, and what typically differed? Fill in the diagram in your own words — these starting labels are a prompt, not the full answer."}
  ]},
  {phase:"Review & Reflect",blocks:[
    {t:"write",id:"ctry-r1",q:"Which part of today's lesson taught you the most about how the Kulin Nation lived from the land? Why?"}
  ]}
 ]},

{id:"kinship",title:"5. Kinship & family",subtitle:"How did kinship organise Aboriginal family and community life?",
 li:"Understand the importance of kinship for Australia's First Peoples.",
 sc:["I can define 'kinship'.","I can describe how elders played a key role within the kinship system.","I can explain why there were strict rules about marriage."],
 steps:[
  {phase:"Engage",blocks:[
    {t:"link",label:"Family and kinship",url:"https://www.youtube.com/watch?v=mNtPcW4t1PY",dur:null}
  ]},
  {phase:"Discover & Develop",blocks:[
    {t:"p",text:"<span class=\"term\">Kinship</span> is a system of rules that organises family and social life for Aboriginal and Torres Strait Islander peoples. It made sure everyone knew their responsibilities within the community — who could marry whom, who was responsible for teaching and caring for children, who held particular knowledge, and how people were connected to each other and to Country."},
    {t:"p",text:"Elders hold deep knowledge of law, culture, history and Country, and the kinship system gives them the authority and responsibility to pass that knowledge on."}
  ]},
  {phase:"Apply",blocks:[

{id:"trade",title:"6. Trade, warfare & funerals",subtitle:"How did groups trade, come into conflict, and farewell their dead?",
 li:"Understand the significant beliefs, values and practices of Aboriginal and Torres Strait Islander peoples and cultures, including trade, the causes and effects of warfare, and death and funerary customs.",
 sc:["I can describe trading via overland pathways and songlines as a way of sharing resources and staying in contact.","I can explain the causes and effects of conflict between groups.","I can analyse the importance of death and funerary customs in ancient Australia."],
 steps:[
  {phase:"Engage",blocks:[
    {t:"link",label:"Joseph Lycett, A Contest with Spears, Shields and Clubs, c.1817 — National Library of Australia",url:"http://www.nla.gov.au/apps/cdview/?pi=nla.pic-an2962715-s9&referercode=cat",dur:null},
    {t:"write",id:"tr-e1",q:"SEE, THINK, WONDER — write at least one point for each."}
  ]},
  {phase:"Discover & Develop",blocks:[
    {t:"p",text:"For thousands of years, Aboriginal groups mostly lived within their own traditional Country, but also had regular contact with neighbouring groups — sometimes social, sometimes for trade, and sometimes in conflict. Read each topic below, then summarise it in your own words."},
    {t:"note",text:"<b>Class jigsaw:</b> this works well in small groups — one person reads and summarises each topic, then the group teaches each other what they found. It also works alone."},
    {t:"p",text:"<b>Trade networks and songlines.</b> Aboriginal nations traded goods such as ochre, stone tools, shells and wood along established overland and coastal routes, sometimes over huge distances. Songlines — pathways marked by story and song that encode navigation, law and history — guided travel across Country and between trading partners."},
    {t:"write",id:"tr-d1",q:"Summarise 'trade networks and songlines' in your own words (2-3 dot points)."},
    {t:"p",text:"<b>Clan gatherings.</b> Large gatherings brought neighbouring clans together for ceremony, trade, marriage arrangements and resolving disputes, often timed to a seasonal abundance of a particular food."},
    {t:"write",id:"tr-d2",q:"Summarise 'clan gatherings' in your own words (2-3 dot points)."},
    {t:"p",text:"<b>Warfare and conflict.</b> Conflict between groups did happen, usually over specific disputes — such as breaches of law, disputes over resources, or retaliation — rather than large-scale war for territory. Conflict typically followed known customary rules and was often resolved through ritual combat rather than ongoing war."},
    {t:"write",id:"tr-d3",q:"Summarise 'warfare and conflict' in your own words (2-3 dot points)."},
    {t:"p",text:"<b>Death and funerary customs.</b> Funerary customs varied between nations but were taken very seriously, often involving particular ceremonies, mourning periods, and care for how and where a person was laid to rest — practices that also give historians today some of their clearest evidence of ancient belief and social structure (as at Lake Mungo — see Lesson 7)."},
    {t:"write",id:"tr-d4",q:"Summarise 'death and funerary customs' in your own words (2-3 dot points)."}
  ]},
  {phase:"Apply",blocks:[

    {t:"write",id:"tr-a4",q:"Features — describe what you see in the image."},
    {t:"write",id:"tr-a5",q:"Accuracy — is it an accurate depiction of life in ancient Australia? Why or why not?"},
    {t:"write",id:"tr-a6",q:"Extension — reliability: is it a reliable piece of evidence for a historian? Why or why not?"},
    {t:"write",id:"tr-a7",q:"Extension — usefulness: how could a historian use this image? What are its strengths, weaknesses or limitations as evidence?"}
  ]},
  {phase:"Review & Reflect",blocks:[
    {t:"p",text:"Self-assessment — click where you think you are."},

/* ============================================================
   RENDERER — generic, data-driven. Should not need edits when
   lesson content changes.
   ============================================================ */
const STORE_KEY = "elc.history.ancientAustralia.v1";
let STORE = {};
try { STORE = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) {}
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); } catch (e) {} }
function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function writeField(id, q, big, hint) {
  const val = STORE[id] || "";
  return `<div class="writeblock"><label class="q" for="${id}">${q}</label>${hint ? `<div class="hint">${hint}</div>` : ""}<textarea class="ans" id="${id}" style="${big ? "min-height:90px" : ""}">${esc(val)}</textarea><div class="saved" id="${id}-saved"></div></div>`;
}
function wireWrite(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("input", () => {
    STORE[id] = el.value;
    saveStore();
    const s = document.getElementById(id + "-saved");
    if (s) { s.textContent = "Saved"; clearTimeout(s._t); s._t = setTimeout(() => { s.textContent = ""; }, 1200); }
  });
}

function renderBlock(b, lessonId) {
  if (b.t === "p") return `<p>${b.text}</p>`;
  if (b.t === "div") return b.html;
  if (b.t === "quote") return `<div class="quote">${b.text}${b.cite ? `<cite>— ${esc(b.cite)}</cite>` : ""}</div>`;
  if (b.t === "link") return `<div class="linklist"><a class="extlink" href="${b.url}" target="_blank" rel="noopener">${esc(b.label)} ↗${b.dur ? ` <span class="dur">(${esc(b.dur)})</span>` : ""}</a></div>`;
  if (b.t === "linklist") return `<div class="linklist">${b.items.map(i => `<a class="extlink" href="${i.url}" target="_blank" rel="noopener">${esc(i.label)} ↗</a>`).join("")}</div>`;
  if (b.t === "write") return writeField(b.id, b.q, b.big);
  if (b.t === "note") return `<div class="note">${b.text}</div>`;
  if (b.t === "table") {
    const rows = b.rows.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${writeField(r[1], "", false)}</td><td>${writeField(r[2], "", false)}</td></tr>`).join("");
    return `<table class="cmptable"><thead><tr>${b.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  if (b.t === "venn") {
    const lid = b.id + "-l", mid = b.id + "-m", rid = b.id + "-r";
    return `<p class="hint">${b.note}</p><div class="venn"><div class="venn-l"><textarea class="ans" id="${lid}" placeholder="${esc(b.left)}">${esc(STORE[lid] || "")}</textarea></div><div class="venn-m"><textarea class="ans" id="${mid}" placeholder="${esc(b.mid)}">${esc(STORE[mid] || "")}</textarea></div><div class="venn-r"><textarea class="ans" id="${rid}" placeholder="${esc(b.right)}">${esc(STORE[rid] || "")}</textarea></div></div>`;
  }
  if (b.t === "factfile") {
    return `<div class="factfile">${b.fields.map(f => { const id = b.id + "-" + f.id; return `<div class="fcard"><b>${esc(f.label)}</b>${writeField(id, "", true)}</div>`; }).join("")}</div>`;
  }
  if (b.t === "tf") {
    const tId = b.id, selected = STORE[tId + "-v"];
    return `<div class="tfrow"><div class="q">${esc(b.q)}</div><div class="tfbtns" id="${tId}-btns"><button type="button" class="t" data-v="true" aria-pressed="${selected === "true"}">True</button><button type="button" class="f" data-v="false" aria-pressed="${selected === "false"}">False</button></div>${writeField(tId + "-why", b.why, false)}</div>`;
  }
  if (b.t === "rubric") {
    const selected = STORE[b.id];
    return `<div class="rubric" id="${b.id}">${b.options.map((o, i) => `<button type="button" data-i="${i}" aria-pressed="${String(selected) === String(i)}">${esc(o)}</button>`).join("")}</div>`;
  }
  return "";
}

function wireBlock(b) {
  if (b.t === "write") wireWrite(b.id);
  if (b.t === "table") b.rows.forEach(r => { wireWrite(r[1]); wireWrite(r[2]); });
  if (b.t === "venn") { wireWrite(b.id + "-l"); wireWrite(b.id + "-m"); wireWrite(b.id + "-r"); }
  if (b.t === "factfile") b.fields.forEach(f => wireWrite(b.id + "-" + f.id));
  if (b.t === "tf") {
    wireWrite(b.id + "-why");
    const btns = document.getElementById(b.id + "-btns");
    if (btns) btns.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
      STORE[b.id + "-v"] = btn.dataset.v; saveStore();
      btns.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
    }));
  }
  if (b.t === "rubric") {
    const box = document.getElementById(b.id);
    if (box) box.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
      STORE[b.id] = btn.dataset.i; saveStore();
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
    }));
  }
}

let activeLesson = LESSONS[0].id;
const activeStep = {};
LESSONS.forEach(l => activeStep[l.id] = 0);

function renderTabs() {
  const box = document.getElementById("lessonTabs");
  box.innerHTML = LESSONS.map(l => `<button type="button" role="tab" data-lesson="${l.id}" aria-selected="${l.id === activeLesson}">${esc(l.title)}</button>`).join("");
  box.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => showLesson(btn.dataset.lesson)));
}

function renderLessons() {
  const box = document.getElementById("lessons");
  box.innerHTML = LESSONS.map(l => `
    <section class="lesson" id="lesson-${l.id}">
      <div class="lesson-head">
        <h2>${esc(l.title.replace(/^\d+\.\s*/, ""))} <span style="color:var(--muted);font-weight:600;font-size:.8rem">— ${esc(l.subtitle)}</span></h2>
        <div class="li-sc"><b>Learning intention</b><div>${esc(l.li)}</div><b>Success criteria</b><ul>${l.sc.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
      </div>
      <div class="phase-nav" id="phasenav-${l.id}">
        ${l.steps.map((s, i) => `<button type="button" class="phase-btn" data-step="${i}">${esc(s.phase)}</button>`).join("")}
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-${l.id}"></div></div>
      ${l.steps.map((s, i) => `<div class="phase-panel" id="phase-${l.id}-${i}">${s.blocks.map(b => renderBlock(b, l.id)).join("")}</div>`).join("")}
      <div class="phase-foot"><button type="button" class="navbtn" data-prev="${l.id}">‹ Previous</button><span class="steplabel" id="steplabel-${l.id}"></span><button type="button" class="navbtn primary" data-next="${l.id}">Next ›</button></div>
    </section>
  `).join("");

  LESSONS.forEach(l => {
    l.steps.forEach(s => s.blocks.forEach(b => wireBlock(b)));
    document.getElementById("phasenav-" + l.id).querySelectorAll(".phase-btn").forEach(btn =>
      btn.addEventListener("click", () => showStep(l.id, Number(btn.dataset.step))));
    document.querySelectorAll(`[data-prev="${l.id}"]`).forEach(btn => btn.addEventListener("click", () => showStep(l.id, activeStep[l.id] - 1)));
    document.querySelectorAll(`[data-next="${l.id}"]`).forEach(btn => btn.addEventListener("click", () => showStep(l.id, activeStep[l.id] + 1)));
  });
}

function showLesson(id) {
  activeLesson = id;
  document.querySelectorAll("#lessonTabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.lesson === id)));
  document.querySelectorAll(".lesson").forEach(s => s.classList.toggle("on", s.id === "lesson-" + id));
  showStep(id, activeStep[id] || 0, false);
}

function showStep(lessonId, i, scroll) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  i = Math.max(0, Math.min(lesson.steps.length - 1, i));
  activeStep[lessonId] = i;
  document.querySelectorAll(`#phasenav-${lessonId} .phase-btn`).forEach((b, n) => b.classList.toggle("on", n === i));
  lesson.steps.forEach((s, n) => document.getElementById(`phase-${lessonId}-${n}`).classList.toggle("on", n === i));
  document.getElementById("progress-" + lessonId).style.width = ((i + 1) / lesson.steps.length * 100) + "%";
  document.getElementById("steplabel-" + lessonId).textContent = lesson.steps[i].phase + " — step " + (i + 1) + " of " + lesson.steps.length;
  document.querySelectorAll(`[data-prev="${lessonId}"]`).forEach(b => b.disabled = i === 0);
  document.querySelectorAll(`[data-next="${lessonId}"]`).forEach(b => b.disabled = i === lesson.steps.length - 1);
  if (scroll !== false) document.getElementById("phase-" + lessonId + "-" + i).scrollIntoView({ behavior: "smooth", block: "start" });
}

function applyHash() {
  const id = location.hash.slice(1);
  if (!id) return;
  if (LESSONS.some(l => l.id === id)) showLesson(id);
}
window.addEventListener("hashchange", applyHash);

renderTabs();
renderLessons();
showLesson(activeLesson);
applyHash();
</script>
