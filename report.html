<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A private, device-local record of ELC activities and a saved learning goal.">
<title>My Learning Record — ELC Hub</title>
<style>
  :root { --bg:#f6f8fc; --card:#fff; --ink:#1c2333; --muted:#5b6478; --line:#e3e8f2; --accent:#2563eb; --green:#15803d; --green-soft:#dcfce7; --radius:14px; }
  @media (prefers-color-scheme:dark) { :root { --bg:#0f1420; --card:#171e2e; --ink:#e8ecf5; --muted:#9aa4b8; --line:#263048; --accent:#7aa5ff; --green:#6ee7a0; --green-soft:#183d2a; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.5; padding:24px 16px 60px; }
  .wrap { max-width:680px; margin:0 auto; }
  a.back { color:var(--accent); text-decoration:none; font-size:.9rem; font-weight:700;
           display:inline-flex; align-items:center; min-height:34px; }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-top:16px; box-shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06); }
  h1 { font-size:1.55rem; margin-bottom:2px; }
  h2 { margin-top:22px; font-size:1.05rem; }
  .meta,.privacy { color:var(--muted); font-size:.86rem; }
  .privacy { margin-top:8px; padding:9px 11px; background:var(--bg); border-radius:9px; }
  .goal { margin-top:9px; padding:13px 14px; border:1px solid color-mix(in srgb,var(--green) 45%,var(--line)); border-radius:10px; background:var(--green-soft); }
  .goal p { margin:3px 0; font-size:.9rem; }
  .empty { color:var(--muted); font-size:.9rem; padding:12px 0; }
  .stem-box { margin-top:9px; padding:13px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .stem-stats { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:6px; }
  .stem-stats div b { display:block; font-size:1.3rem; }
  .stem-stats div span { font-size:.78rem; color:var(--muted); }
  .stem-box p { margin:6px 0 2px; font-size:.88rem; }
  ul.stem-behind { margin:2px 0 0; padding-left:18px; font-size:.88rem; }
  ul.stem-behind li { margin:2px 0; }
  .stem-box a.more { display:inline-block; margin-top:9px; color:var(--accent); font-weight:700; font-size:.88rem; text-decoration:none; }
  ul.log { list-style:none; padding:0; margin-top:8px; }
  ul.log li { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:.92rem; }
  ul.log li .cat { color:var(--muted); font-size:.8rem; text-align:right; }
  .actions { margin-top:22px; display:flex; flex-wrap:wrap; gap:9px; }
  button { padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:700; cursor:pointer; font-size:.88rem; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button.clear { color:var(--muted); margin-left:auto; }
  @media print {
    .noprint,a.back { display:none!important; }
    body { background:#fff; color:#000; padding:0; }
    .sheet { border:0; box-shadow:none; }
    .goal { background:#fff; border:1px solid #999; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back noprint" href="index.html">← Back to ELC Hub</a>
  <main class="sheet">
    <h1>My Learning Record</h1>
    <p class="meta" id="dateLine"></p>
    <p class="privacy noprint">🔒 Anonymous and stored in this browser only. This record shows what you opened; it is not an official assessment.</p>

    <h2>My learning direction</h2>
    <div id="goal"></div>

    <h2>🧪 STEM progress</h2>
    <div id="stem"></div>

    <h2>Activities opened</h2>
    <ul class="log" id="log"></ul>
    <p class="empty" id="emptyActivities" hidden>Nothing opened yet — return to the hub and choose a tool.</p>

    <div class="actions noprint">
      <button class="primary" id="print">🖨️ Print / Save</button>
      <button id="another">Do another activity</button>
      <button class="clear" id="clear">Clear activity record</button>
    </div>
  </main>
</div>

<script src="stem-shared.js?v=20260821-1"></script>
<script>
const VISITS_KEY="elc_visited", GOAL_KEY="elc_learning_compass_goal";
document.getElementById("dateLine").textContent=new Date().toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});

function text(tag,value,className){
  const element=document.createElement(tag);
  element.textContent=value;
  if(className) element.className=className;
  return element;
}

let goal=null;
try { goal=JSON.parse(localStorage.getItem(GOAL_KEY)||"null"); } catch(e) {}
const goalBox=document.getElementById("goal");
if(goal){
  goalBox.className="goal";
  goalBox.append(text("p",`${goal.modeLabel} · ${goal.level}`));
  goalBox.append(text("p",goal.goal));
  if(goal.evidence) goalBox.append(text("p",`Evidence: ${goal.evidence}`));
} else {
  goalBox.append(text("p","No goal saved yet — use the Learning Compass to choose one.","empty"));
}

const stemBox=document.getElementById("stem");
(function(){
  const hasSTEM2 = typeof window.STEM2 !== "undefined";
  const vocab = hasSTEM2 ? STEM2.Store.vocab() : {};
  const skillIds = hasSTEM2 ? Object.keys(STEM2.SKILLS) : [];

  let mastered = 0, anyPractice = false;
  skillIds.forEach(id => {
    const st = STEM2.Mastery.state(id);
    if (st.status !== "none") anyPractice = true;
    if (st.status === "mastered") mastered++;
  });

  const anyData = anyPractice || Object.keys(vocab).length > 0;
  if (!hasSTEM2 || !anyData) {
    stemBox.append(text("p","No STEM practice recorded yet.","empty"));
    return;
  }

  let wordsBuilt = 0;
  Object.keys(vocab).forEach(w => { if (vocab[w].built) wordsBuilt++; });

  /* "behind" = not yet mastered, and the checkpoint it is needed by has
     already passed (each skill names the checkpoint id it belongs to) */
  const behindNames = [];
  skillIds.forEach(id => {
    if (STEM2.Mastery.mastered(id)) return;
    const sk = STEM2.SKILLS[id];
    if (!sk.needs) return;
    const unit = STEM2.UNIT_BY_ID[sk.unit];
    const cp = unit && unit.checkpoints.filter(c => c.id === sk.needs)[0];
    /* behind = a task the class has already sat still has an unmastered skill */
    if (cp && STEM2.cpDone(cp)) behindNames.push(sk.name);
  });

  const box=document.createElement("div");
  box.className="stem-box";

  const stats=document.createElement("div");
  stats.className="stem-stats";
  function stat(n,label){
    const d=document.createElement("div");
    d.append(text("b",String(n)));
    d.append(text("span",label));
    return d;
  }
  stats.append(stat(mastered,"skills mastered"));
  stats.append(stat(wordsBuilt,"words built"));
  box.append(stats);

  if (behindNames.length){
    box.append(text("p","Behind schedule:"));
    const ul=document.createElement("ul");
    ul.className="stem-behind";
    behindNames.slice(0,3).forEach(name => ul.append(text("li",name)));
    box.append(ul);
  } else {
    box.append(text("p","Nothing behind schedule — nice work.","empty"));
  }

  const link=document.createElement("a");
  link.className="more"; link.href="stem-progress.html"; link.textContent="See my full STEM report →";
  box.append(link);

  stemBox.append(box);
})();

let visits=[];
try { visits=JSON.parse(localStorage.getItem(VISITS_KEY)||"[]"); } catch(e) {}
visits=Array.isArray(visits)?visits.sort((a,b)=>a.ts-b.ts):[];
const log=document.getElementById("log");
document.getElementById("emptyActivities").hidden=visits.length!==0;
visits.forEach(item=>{
  const li=document.createElement("li");
  li.append(text("span",item.title||"Activity"));
  const when=new Date(item.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  li.append(text("span",`${item.cat||"ELC Hub"} · ${when}`,"cat"));
  log.append(li);
});

document.getElementById("print").onclick=()=>window.print();
document.getElementById("another").onclick=()=>location.href="index.html";
document.getElementById("clear").onclick=()=>{
  localStorage.removeItem(VISITS_KEY);
  log.replaceChildren();
  document.getElementById("emptyActivities").hidden=false;
};
</script>
</body>
</html>
