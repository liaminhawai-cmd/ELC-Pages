<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f4b4b'/><path d='M4 13h24M4 19h24' stroke='%23e8b36a' stroke-width='2'/><path d='M9 8v18M16 8v18M23 8v18' stroke='%23f5efe4' stroke-width='3' stroke-linecap='round'/></svg>">
<meta name="description" content="Rabbit-Proof Fence film techniques: shots, angles, camera movement, sound, light and colour. Slides to teach from, and a quiz to test yourself.">
<title>Film Techniques — Rabbit-Proof Fence</title>
<style>
:root{
  --bg:#f5efe4; --card:#fffaf1; --ink:#2a2118; --muted:#6c5f50; --line:#e1d2ba;
  --earth:#b5532a; --earth-soft:#f6dfcf; --deep:#1f4b4b; --deep-soft:#dcebe8;
  --ok:#2f7a4a; --ok-soft:#dff1e4; --bad:#b23a2a; --bad-soft:#f8e0dc;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.08);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#17140f; --card:#241f18; --ink:#f4ede1; --muted:#c9bba6; --line:#463c2e;
         --earth:#e58a5c; --earth-soft:#3d2518; --deep:#8fcfc6; --deep-soft:#173230;
         --ok:#7fd29a; --ok-soft:#173222; --bad:#f08a7a; --bad-soft:#3a1d18; --shadow:0 2px 10px rgba(0,0,0,.45); }
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
button,select{font:inherit}
a{color:inherit}

/* ---------- top bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.bar .back{color:var(--earth);font-weight:800;text-decoration:none}
.bar .back:hover{text-decoration:underline}
.bar h1{font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;margin-right:auto}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:800;border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--deep);color:#fff}
.bar select{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--card);color:var(--ink);font-weight:700;max-width:100%}

/* ---------- slides ---------- */
#slides{display:flex;flex-direction:column;height:calc(100dvh - 56px);min-height:420px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
.slide{width:min(100%,calc((100dvh - 150px) * 16 / 9));aspect-ratio:16/9;background:var(--card);border:1px solid var(--line);
       border-radius:16px;box-shadow:var(--shadow);padding:2.4% 3%;display:flex;flex-direction:column;overflow:hidden;
       font-size:clamp(12px,1.55vw,30px)}
.slide .kicker{font-size:.62em;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--earth)}
.slide h2{font-family:Georgia,"Times New Roman",serif;font-size:1.65em;line-height:1.1;margin:.15em 0 .45em;color:var(--deep)}
.slide .cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:4%;align-items:start}
.slide .cols.wide{grid-template-columns:1fr}
.slide .rule{background:var(--deep-soft);border-left:.28em solid var(--deep);border-radius:.4em;padding:.45em .7em;margin-bottom:.6em;font-weight:650}
.slide ul.pts{list-style:none;padding:0;display:grid;gap:.5em}
.slide ul.pts li{padding-left:1em;position:relative;font-size:.86em;line-height:1.35}
.slide ul.pts li::before{content:"";position:absolute;left:0;top:.5em;width:.45em;height:.45em;border-radius:50%;background:var(--earth)}
.slide ul.pts b{color:var(--deep)}
.slide ol.qs{padding-left:1.3em;display:grid;gap:.45em;font-size:.95em}
.slide .figs{display:grid;gap:.6em;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));align-content:start}
.slide figure{background:var(--bg);border:1px solid var(--line);border-radius:.5em;padding:.3em;display:flex;flex-direction:column;gap:.25em}
.slide figure svg{width:100%;height:auto;display:block;border-radius:.3em}
.slide figcaption{font-size:.62em;font-weight:800;text-align:center;color:var(--muted)}
.slide .terms{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.5em}
.term{font-size:.6em;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.2em .7em}
.term b{color:var(--earth)}
.term .tr{margin-left:.35em;color:var(--muted)}
.slide .note{font-size:.55em;color:var(--muted);margin-top:.4em;border-top:1px dashed var(--line);padding-top:.35em}
.slide table.apply{width:100%;border-collapse:collapse;font-size:.54em}
.slide table.apply th,.slide table.apply td{border:1px solid var(--line);padding:.16em .5em;text-align:left}
.slide table.apply th{background:var(--deep-soft)}
.slide .frame{font-size:.7em;background:var(--earth-soft);border-radius:.4em;padding:.4em .7em;margin-top:.45em}
.slidenav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px 12px 12px}
.slidenav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer}
.slidenav button:disabled{opacity:.35;cursor:default}
.slidenav select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px;max-width:min(60vw,420px)}
.slidenav .count{color:var(--muted);font-weight:700;min-width:5.5em;text-align:center}

/* ---------- quiz ---------- */
#quiz{max-width:780px;margin:0 auto;padding:18px 14px 50px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.qtop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:700;font-size:.9rem;margin-bottom:8px}
.qtext{font-size:1.15rem;font-weight:650;margin:6px 0 12px}
.qfig{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:12px}
.qfig svg{width:100%;height:auto;display:block;max-height:46vh}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.opts button{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font-weight:700;text-align:left;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--deep)}
.opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:12px;padding:10px 12px;border-radius:10px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--bad-soft)}
.qrow{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--deep);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.sum h2{font-family:Georgia,"Times New Roman",serif;color:var(--deep);margin-bottom:6px}
.sum .big{font-size:2.4rem;font-weight:900;color:var(--earth)}
.sum ul{margin:8px 0 0 1.2em}
.sum .honest{color:var(--muted);font-size:.85rem;margin-top:10px}
.trnote{color:var(--muted);font-size:.78rem;padding:0 16px 8px;text-align:center}
@media (max-width:760px){
  #slides{height:auto}
  .slide{width:100%;aspect-ratio:auto;font-size:16px;padding:16px}
  .slide .cols{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="bar">
  <a class="back" href="./">&larr; Rabbit-Proof Fence</a>
  <h1>Film techniques</h1>
  <div class="tabs" role="tablist" aria-label="Mode">
    <button type="button" role="tab" id="tabSlides" aria-selected="true">Slides</button>
    <button type="button" role="tab" id="tabQuiz" aria-selected="false">Quiz</button>
  </div>
  <label><span class="sr" hidden>Key words in</span><select id="lang" aria-label="Key words in another language">
    <option value="">Key words: English only</option>
    <option value="zh-Hant" lang="zh-Hant">Mandarin (Traditional) · 繁體國語</option>
    <option value="zh-Hans" lang="zh-Hans">Mandarin (Simplified) · 简体普通话</option>
    <option value="vi" lang="vi">Vietnamese · Tiếng Việt</option>
  </select></label>
</header>

<main id="slides">
  <div class="stage"><section class="slide" id="slide" aria-live="polite"></section></div>
  <nav class="slidenav" aria-label="Slides">
    <button type="button" id="prev">&larr; Back</button>
    <span class="count" id="count"></span>
    <button type="button" id="next">Next &rarr;</button>
    <select id="jump" aria-label="Go to slide"></select>
    <button type="button" id="full">Full screen</button>
  </nav>
  <p class="trnote" id="trnote" hidden>Translations are drafted and not yet checked by a speaker of each language.</p>
</main>

<main id="quiz" hidden></main>

<script>
/* =======================================================================
   CONTENT — edit here. Slides follow the unit's film techniques
   PowerPoint; every picture is drawn below, none is a film still.
   ======================================================================= */

/* Key words, with drafted translations: Simplified (Mainland usage),
   Traditional (Taiwan usage) and Vietnamese. */
const TERMS = {
  "shot":                    { "zh-Hans":"镜头", "zh-Hant":"鏡頭", vi:"cảnh quay" },
  "framing":                 { "zh-Hans":"取景", "zh-Hant":"取景", vi:"khung hình" },
  "extreme long shot":       { "zh-Hans":"大远景", "zh-Hant":"大遠景", vi:"đại toàn cảnh" },
  "long shot":               { "zh-Hans":"远景", "zh-Hant":"遠景", vi:"toàn cảnh" },
  "medium shot":             { "zh-Hans":"中景", "zh-Hant":"中景", vi:"trung cảnh" },
  "close-up":                { "zh-Hans":"特写", "zh-Hant":"特寫", vi:"cận cảnh" },
  "extreme close-up":        { "zh-Hans":"大特写", "zh-Hant":"大特寫", vi:"đặc tả" },
  "setting":                 { "zh-Hans":"场景", "zh-Hant":"場景", vi:"bối cảnh" },
  "body language":           { "zh-Hans":"肢体语言", "zh-Hant":"肢體語言", vi:"ngôn ngữ cơ thể" },
  "camera angle":            { "zh-Hans":"拍摄角度", "zh-Hant":"拍攝角度", vi:"góc máy" },
  "low angle":               { "zh-Hans":"仰拍镜头", "zh-Hant":"仰角鏡頭", vi:"góc máy thấp" },
  "high angle":              { "zh-Hans":"俯拍镜头", "zh-Hant":"俯角鏡頭", vi:"góc máy cao" },
  "eye level":               { "zh-Hans":"平视镜头", "zh-Hant":"平視鏡頭", vi:"góc ngang tầm mắt" },
  "bird's-eye view":         { "zh-Hans":"鸟瞰镜头", "zh-Hant":"鳥瞰鏡頭", vi:"góc nhìn từ trên cao" },
  "worm's-eye view":         { "zh-Hans":"极低角度仰拍", "zh-Hant":"極低角度仰角鏡頭", vi:"góc nhìn sát mặt đất" },
  "Dutch angle":             { "zh-Hans":"倾斜镜头", "zh-Hant":"傾斜鏡頭", vi:"góc máy nghiêng" },
  "point of view shot":      { "zh-Hans":"主观镜头", "zh-Hant":"主觀鏡頭", vi:"cảnh góc nhìn nhân vật" },
  "over-the-shoulder shot":  { "zh-Hans":"过肩镜头", "zh-Hant":"過肩鏡頭", vi:"cảnh qua vai" },
  "camera movement":         { "zh-Hans":"运镜", "zh-Hant":"運鏡", vi:"chuyển động máy quay" },
  "pan":                     { "zh-Hans":"水平摇镜", "zh-Hant":"水平搖鏡", vi:"lia máy ngang" },
  "tilt":                    { "zh-Hans":"垂直摇镜", "zh-Hant":"垂直搖鏡", vi:"lia máy dọc" },
  "zoom":                    { "zh-Hans":"变焦", "zh-Hant":"變焦", vi:"thu phóng" },
  "tracking shot":           { "zh-Hans":"跟拍镜头", "zh-Hant":"推軌鏡頭", vi:"cảnh máy di chuyển theo" },
  "diegetic sound":          { "zh-Hans":"剧情内声音", "zh-Hant":"劇情內聲音", vi:"âm thanh trong truyện" },
  "non-diegetic sound":      { "zh-Hans":"剧情外声音", "zh-Hant":"劇情外聲音", vi:"âm thanh ngoài truyện" },
  "soundtrack":              { "zh-Hans":"配乐", "zh-Hant":"配樂", vi:"nhạc phim" },
  "voice-over":              { "zh-Hans":"旁白", "zh-Hant":"旁白", vi:"lời dẫn" },
  "silence":                 { "zh-Hans":"静默", "zh-Hant":"靜默", vi:"sự im lặng" },
  "lighting":                { "zh-Hans":"灯光", "zh-Hant":"燈光", vi:"ánh sáng" },
  "colour":                  { "zh-Hans":"色彩", "zh-Hant":"色彩", vi:"màu sắc" },
  "warm colours":            { "zh-Hans":"暖色调", "zh-Hant":"暖色調", vi:"tông màu ấm" },
  "cold colours":            { "zh-Hans":"冷色调", "zh-Hant":"冷色調", vi:"tông màu lạnh" },
  "archival footage":        { "zh-Hans":"档案影像", "zh-Hant":"檔案影片", vi:"phim tư liệu lưu trữ" },
  "mise en scène":           { "zh-Hans":"场面调度", "zh-Hant":"場面調度", vi:"dàn dựng cảnh" },
  "symbol":                  { "zh-Hans":"象征", "zh-Hant":"象徵", vi:"biểu tượng" },
  "flashback":               { "zh-Hans":"闪回", "zh-Hant":"倒敘", vi:"hồi tưởng" },
  "effect":                  { "zh-Hans":"效果", "zh-Hant":"效果", vi:"tác động" },
  "audience":                { "zh-Hans":"观众", "zh-Hant":"觀眾", vi:"khán giả" },
  "timestamp":               { "zh-Hans":"时间点", "zh-Hant":"時間點", vi:"mốc thời gian" },
  "power":                   { "zh-Hans":"权力", "zh-Hant":"權力", vi:"quyền lực" },
  "vulnerable":              { "zh-Hans":"脆弱的", "zh-Hant":"脆弱的", vi:"dễ bị tổn thương" },
};

/* One slide = { kicker, title, rule?, points?:[[term, text]], qs?:[...],
   figs?:[[diagram, caption]], terms?:[...], note?, table?, frame?, wide? }.
   A point's term can be "" for a plain line. */
const SLIDES = [
  { kicker:"Rabbit-Proof Fence · Film techniques", title:"How a film tells a story without words",
    rule:"A director chooses how we see and hear every moment. Those choices are film techniques.",
    points:[["Shots","how much of the person and the place we see"],
            ["Angles","where the camera stands"],
            ["Movement","how the camera moves"],
            ["Sound","what we hear, and who can hear it"],
            ["Light and colour","how the screen feels"]],
    figs:[["shot:els","The desert and the fence"]] },

  { kicker:"Shots", title:"Framing: how much of the screen the subject fills",
    rule:"The further away the camera, the more we see of the place. The closer the camera, the more we see of the person's feelings.",
    figs:[["shot:els","Extreme long shot"],["shot:ls","Long shot"],["shot:ms","Medium shot"],["shot:cu","Close-up"],["shot:ecu","Extreme close-up"]],
    wide:true, terms:["framing","extreme long shot","long shot","medium shot","close-up","extreme close-up"] },

  { kicker:"Shots", title:"Long shots show the place",
    points:[["Extreme long shot (ELS)","the land fills the screen. People are tiny."],
            ["Long shot (LS)","the whole person, head to feet, and the place around them."],
            ["Effect","shows where we are and how big the land is. A small person in a big place can look alone, lost or free."],
            ["In the film","look for the three girls as small figures against the desert and the fence."]],
    figs:[["shot:els","Extreme long shot"],["shot:ls","Long shot"]],
    terms:["extreme long shot","long shot","setting"] },

  { kicker:"Shots", title:"Medium shot: people and their body language",
    points:[["Medium shot (MS)","shows a person from the waist up."],
            ["Effect","we see gestures, body language and who they are with. It feels like standing near them in real life."],
            ["Use it for","conversations, groups, people working together."]],
    figs:[["shot:ms","Medium shot"]],
    terms:["medium shot","body language"] },

  { kicker:"Shots", title:"Close-ups show feelings",
    points:[["Close-up (CU)","the face fills the screen."],
            ["Extreme close-up (ECU)","one small detail: the eyes, the hands, an object."],
            ["Effect","we read the character's emotion in detail and feel close to them. Often used for private, emotional moments."],
            ["Watch for","an extreme close-up of an object makes it important. Ask why the director wants you to notice it."]],
    figs:[["shot:cu","Close-up"],["shot:ecu","Extreme close-up"]],
    terms:["close-up","extreme close-up"] },

  { kicker:"Angles", title:"Camera angle: where the camera is placed",
    rule:"The angle changes how we judge a person: strong or weak, normal or strange.",
    figs:[["angle:low","Low angle"],["angle:eye","Eye level"],["angle:high","High angle"]],
    wide:true, terms:["camera angle","low angle","eye level","high angle"] },

  { kicker:"Angles", title:"Low angle and high angle",
    points:[["Low angle","the camera looks up at the subject. Effect: they look big, strong and powerful, or threatening."],
            ["High angle","the camera looks down on the subject. Effect: they look small, weak or in danger."],
            ["Not always","a low angle can also show how a child sees an adult. Ask: whose eyes are we looking through?"],
            ["In the film","look for who the camera looks up at, and who it looks down on."]],
    figs:[["angle:low","Low angle: looking up"],["angle:high","High angle: looking down"]],
    terms:["low angle","high angle","power","vulnerable"] },

  { kicker:"Angles", title:"Eye level, bird's-eye and worm's-eye",
    points:[["Eye level","the camera is at the person's eye height, like a person watching. Effect: neutral; we feel equal to the character."],
            ["Bird's-eye view","straight down from high above. Effect: people look tiny, like on a map. It can show a pattern, or a long way to travel."],
            ["Worm's-eye view","from the ground, looking straight up. Effect: an extreme low angle; the subject towers over us."]],
    figs:[["angle:eye","Eye level"],["angle:bird","Bird's-eye view"],["angle:worm","Worm's-eye view"]],
    terms:["eye level","bird's-eye view","worm's-eye view"] },

  { kicker:"Angles", title:"Dutch angle, point of view, over the shoulder",
    points:[["Dutch (canted) angle","the camera is tilted, so the horizon slopes. Effect: something feels wrong: tension, confusion, danger."],
            ["Point of view (POV)","we see exactly what a character sees. Effect: we share their experience and their feelings."],
            ["Over the shoulder (OTS)","the camera is behind one person, looking at another. Effect: we join the conversation."]],
    figs:[["angle:dutch","Dutch angle"],["angle:pov","Point of view"],["angle:ots","Over the shoulder"]],
    terms:["Dutch angle","point of view shot","over-the-shoulder shot"] },

  { kicker:"Movement", title:"Camera movement: how the camera moves while filming",
    rule:"Movement guides our eyes. It can follow someone, show a whole place, or bring us closer.",
    figs:[["move:pan","Pan"],["move:tilt","Tilt"],["move:zoom","Zoom"],["move:track","Tracking shot"]],
    wide:true, terms:["camera movement","pan","tilt","zoom","tracking shot"] },

  { kicker:"Movement", title:"Pan and tilt: the camera turns",
    points:[["Pan","the camera turns left or right from one spot, like turning your head. Effect: shows how wide a place is, or follows something moving across it."],
            ["Tilt","the camera turns up or down from one spot. Effect: shows height: a tall tree, a building, a person from feet to face."]],
    figs:[["move:pan","Pan: turns side to side"],["move:tilt","Tilt: turns up and down"]],
    terms:["pan","tilt"] },

  { kicker:"Movement", title:"Zoom and tracking",
    points:[["Zoom","the lens changes from a wide shot to a closer shot. The camera itself does not move. Effect: pulls our attention to something; can create excitement or shock."],
            ["Tracking (dolly) shot","the camera moves along beside the action, on a vehicle or on rails. Effect: we travel with the characters and feel part of the journey."],
            ["In the film","look for the camera moving with the girls as they walk or run."]],
    figs:[["move:zoom","Zoom: the lens moves in"],["move:track","Tracking: the camera travels"]],
    terms:["zoom","tracking shot"] },

  { kicker:"Sound", title:"Sound: what we hear, and who can hear it",
    points:[["Diegetic sound","the characters can hear it: voices, footsteps, wind, a song someone sings."],
            ["Non-diegetic sound","only the audience can hear it: background music, a narrator's voice-over."],
            ["Silence","no sound at all. Effect: we hold our breath; a moment feels serious, shocking or lonely."],
            ["Test it","ask: could the characters hear this? Yes: diegetic. No: non-diegetic."]],
    figs:[["sound:world","Inside or outside the story world"]],
    terms:["diegetic sound","non-diegetic sound","soundtrack","voice-over","silence"] },

  { kicker:"Activity", title:"Close your eyes… and listen",
    rule:"We will hear the opening of the film, from the start to about 1:54. Keep your eyes closed.",
    qs:["What music did you hear?","What other sounds did you hear: birds, wind, footsteps, voices?","How did the sounds make you feel?","Was each sound diegetic or non-diegetic?"],
    figs:[["icon:listen",""]],
    note:"Teacher: play from the start to about 1:54 with the screen covered or turned away." },

  { kicker:"Activity", title:"Now turn the sound off",
    rule:"Watch the same part again with no sound at all.",
    qs:["What did you see that you did not notice before?","Did the feeling change without sound? How?","What does the music add to the opening?"],
    figs:[["icon:mute",""]],
    note:"Teacher: replay the same part, muted." },

  { kicker:"Light and colour", title:"Light and colour: how the screen feels",
    points:[["Lighting","bright light can feel open and safe. Dark light and shadows can feel scary or secret."],
            ["Colour","warm colours (gold, orange, red earth) can feel free, alive, at home. Cold colours (grey, blue) can feel sad, cold, trapped."],
            ["In the film","compare the colours of the desert with the colours at Moore River. What changes, and why?"]],
    figs:[["light:contrast","Warm and bright, cold and grey"]],
    terms:["lighting","colour","warm colours","cold colours"] },

  { kicker:"Other techniques", title:"Footage, the frame, symbols and flashbacks",
    points:[["Archival footage","real film or photos from the past. Effect: reminds us the story is true. The film ends with footage of the real Molly and Daisy."],
            ["Mise en scène","everything placed in the frame: the setting, costumes, props, where people stand. Ask: why is this here?"],

/* One desert scene; each shot size is just a different crop of it. */
const SHOT_X = 1600, SHOT_Y = 1300, SHOT_U = 0.4;
const CROPS = {           // [centre x, centre y, width] in the girl's own units
  els: null,
  ls:  [0, -78, 320],
  ms:  [0, -112, 140],
  cu:  [0, -133, 64],
  ecu: [0, -137.5, 30],
};
function shotSVG(kind){
  const id = "g" + (++uid);
  let vb = "0 0 3200 1800";
  if (CROPS[kind]){
    const [cx, cy, w] = CROPS[kind], h = w * 9 / 16;
    vb = [SHOT_X + SHOT_U * (cx - w / 2), SHOT_Y + SHOT_U * (cy - h / 2), SHOT_U * w, SHOT_U * h].map((n) => n.toFixed(2)).join(" ");
  }
  let fence = "";
  for (let x = 0; x <= 3200; x += 16) fence += `<rect x="${x - 1.2}" y="1268" width="2.4" height="26" fill="${C.post}"/>`;
  let bush = "";
  [[300,1500,60],[900,1420,40],[2300,1460,55],[2800,1600,70],[1200,1650,80],[1950,1380,30],[600,1340,25],[1530,1312,9],[1685,1318,8]].forEach(([x,y,r]) =>
    bush += `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .45}" fill="#8f8a4a"/>`);
  const label = { els:"Extreme long shot", ls:"Long shot", ms:"Medium shot", cu:"Close-up", ecu:"Extreme close-up" }[kind];
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}: drawing of a girl in the desert">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.skyTop}"/><stop offset="1" stop-color="${C.skyLow}"/></linearGradient></defs>

    <rect y="1240" width="3200" height="560" fill="${C.land}"/>
    <path d="M0 1279 L3200 1279 M0 1288 L3200 1288" stroke="${C.post}" stroke-width="1.6"/>
    ${fence}${bush}
    ${girl(C.dress2, SHOT_U * .82, SHOT_X - 46, SHOT_Y + 4)}
    ${girl(C.dress, SHOT_U, SHOT_X, SHOT_Y)}
    ${girl(C.dress3, SHOT_U * .7, SHOT_X + 42, SHOT_Y + 6)}
  </svg>`;
}

/* Side view: where the camera stands, and what it points at. */
function camera(x, y, deg){
  return `<g transform="translate(${x} ${y}) rotate(${deg})">
    <rect x="-16" y="-10" width="26" height="20" rx="4" fill="${C.camera}"/>
    <path d="M10 -6 L22 -11 L22 11 L10 6 Z" fill="${C.camera}"/>
    <circle cx="-9" cy="-14" r="5" fill="${C.camera}"/><circle cx="3" cy="-14" r="5" fill="${C.camera}"/>
  </g>`;
}
function sideView(camX, camY, label, extra){
  const headY = 210 - 0.9 * 138, tx = 270;
  const deg = Math.atan2(headY - camY, tx - camX) * 180 / Math.PI;
  return `<svg viewBox="0 0 400 240" role="img" aria-label="${label}">
    <rect width="400" height="240" fill="#eef3ee"/>
    <rect y="210" width="400" height="30" fill="${C.land}"/>
    <path d="M${camX} ${camY} L${tx} ${headY - 22} M${camX} ${camY} L${tx} ${headY + 40}" stroke="#6c5f50" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>
    ${girl(C.dress, 0.9, tx, 210)}
    ${camera(camX, camY, deg)}
    ${extra || ""}
  </svg>`;
}

    <text x="121" y="200" text-anchor="middle" font-size="15" font-weight="800" fill="#9a4a1e">Warm and bright</text>
    <text x="121" y="222" text-anchor="middle" font-size="14" fill="#9a4a1e">free, alive, at home</text>
    <text x="359" y="200" text-anchor="middle" font-size="15" font-weight="800" fill="#3e4c5a">Cold and grey</text>
    <text x="359" y="222" text-anchor="middle" font-size="14" fill="#3e4c5a">sad, cold, trapped</text>
  </svg>`;
}

function iconSVG(kind){
  if (kind === "listen") return `<svg viewBox="0 0 400 240" role="img" aria-label="Eyes closed, listening">
      <rect width="400" height="240" fill="#f3efe6"/>
      <path d="M90 120 Q140 150 190 120" stroke="${C.ink}" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M210 120 Q260 150 310 120" stroke="${C.ink}" stroke-width="6" fill="none" stroke-linecap="round"/>
      ${[0,1,2].map((i) => `<path d="M${330 + i * 16} ${96 - i * 10} q${14 + i * 6} ${24 + i * 10} 0 ${48 + i * 20}" stroke="#b5532a" stroke-width="4" fill="none" stroke-linecap="round"/>`).join("")}
      <text x="200" y="200" text-anchor="middle" font-size="16" fill="#6c5f50">eyes closed: just listen</text></svg>`;
  if (kind === "mute") return `<svg viewBox="0 0 400 240" role="img" aria-label="Sound off">
      <rect width="400" height="240" fill="#f3efe6"/>
      <path d="M140 95 L175 95 L215 60 L215 180 L175 145 L140 145 Z" fill="${C.ink}"/>
      <path d="M245 90 L305 150 M305 90 L245 150" stroke="#b5532a" stroke-width="10" stroke-linecap="round"/>
      <text x="200" y="215" text-anchor="middle" font-size="16" fill="#6c5f50">sound off: just watch</text></svg>`;
  if (kind === "film") return `<svg viewBox="0 0 400 240" role="img" aria-label="A strip of old film">
      <rect width="400" height="240" fill="#f3efe6"/>
      <rect x="40" y="50" width="320" height="140" fill="#2a2118"/>
      ${[60,100,140,180,220,260,300,340].map((x) => `<rect x="${x - 6}" y="58" width="12" height="10" rx="2" fill="#f3efe6"/><rect x="${x - 6}" y="172" width="12" height="10" rx="2" fill="#f3efe6"/>`).join("")}
      ${[60,160,260].map((x) => `<rect x="${x}" y="78" width="88" height="84" fill="#b9ad97"/>`).join("")}
      ${[104,204,304].map((x) => `<circle cx="${x}" cy="108" r="12" fill="#6e6252"/><path d="M${x - 18} 160 Q${x} 128 ${x + 18} 160 Z" fill="#6e6252"/>`).join("")}
    </svg>`;
  if (kind === "frame") return `<svg viewBox="0 0 400 240" role="img" aria-label="Everything placed in the frame: setting, costume, props">
      <rect width="400" height="240" fill="${C.skyTop}"/><rect y="160" width="400" height="80" fill="${C.land}"/>
      ${girl(C.dress, 0.8, 200, 205)}
      <rect x="280" y="150" width="60" height="40" fill="#8a6a4a"/>
      <path d="M20 168 L380 168 M20 176 L380 176" stroke="${C.post}" stroke-width="2"/>
      ${[30,70,110,290,330,370].map((x) => `<rect x="${x}" y="160" width="4" height="24" fill="${C.post}"/>`).join("")}
      <g font-size="19" font-weight="700" fill="#1f4b4b">
        <text x="14" y="32">setting: desert, fence</text>
        <text x="222" y="100">costume</text><path d="M224 104 L206 130" stroke="#1f4b4b" stroke-width="2"/>
        <text x="292" y="140">prop</text>
      </g>
      <rect x="2" y="2" width="396" height="236" fill="none" stroke="${C.ink}" stroke-width="3"/></svg>`;
  return "";
}

function diagram(key){
  const [k, v] = key.split(":");
  if (k === "shot") return shotSVG(v);
  if (k === "angle") return angleSVG(v);
  if (k === "move") return moveSVG(v);
  if (k === "sound") return soundSVG();
  if (k === "light") return lightSVG();
  if (k === "icon") return iconSVG(v);
  return "";
}

/* =======================================================================
   APP
   ======================================================================= */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const LANG_KEY = "elc_rpf_lang", SLIDE_KEY = "elc_rpf_slide", RESULT_KEY = "elc_rpf_v1";
let lang = store.get(LANG_KEY, null);
if (lang == null) { try { const p = localStorage.getItem("elc_page_language"); lang = (p === "zh-Hans" || p === "zh-Hant") ? p : ""; } catch (e) { lang = ""; } }
$("lang").value = lang;

function termChip(t){
  const tr = lang && TERMS[t] && TERMS[t][lang];
  return `<span class="term"><b>${esc(t)}</b>${tr ? `<span class="tr" lang="${lang}">${esc(tr)}</span>` : ""}</span>`;
}

/* ---------- slides ---------- */
let si = Math.min(Math.max(0, store.get(SLIDE_KEY, 0) | 0), SLIDES.length - 1);
$("jump").innerHTML = SLIDES.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.title)}</option>`).join("");

function renderSlide(){
  const s = SLIDES[si];
  const figs = (s.figs || []).filter(([k]) => k);
  const figHtml = figs.length ? `<div class="figs" style="--n:${s.wide ? Math.min(figs.length, 5) : Math.min(figs.length, 2)}">${
    figs.map(([k, cap]) => `<figure>${diagram(k)}${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}</figure>`).join("")}</div>` : "";
  const text = `${s.rule ? `<p class="rule">${esc(s.rule)}</p>` : ""}
    ${s.points ? `<ul class="pts">${s.points.map(([t, x]) => `<li>${t ? `<b>${esc(t)}:</b> ` : ""}${esc(x)}</li>`).join("")}</ul>` : ""}
    ${s.qs ? `<ol class="qs">${s.qs.map((q) => `<li>${esc(q)}</li>`).join("")}</ol>` : ""}
    ${s.table ? `<table class="apply"><thead><tr><th>Technique</th><th>Example (time + screenshot)</th><th>Effect on the audience</th></tr></thead><tbody>${
        s.table.map((t) => `<tr><td>${esc(t)}</td><td></td><td></td></tr>`).join("")}</tbody></table>` : ""}
    ${s.frame ? `<p class="frame"><b>Sentence frame:</b> ${esc(s.frame)}</p>` : ""}`;
  $("slide").innerHTML = `<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.title)}</h2>
    <div class="cols${s.wide ? " wide" : ""}">${s.wide ? `<div>${text}${figHtml}</div>` : `<div>${text}</div>${figHtml}`}</div>
    ${s.terms ? `<div class="terms">${s.terms.map(termChip).join("")}</div>` : ""}
    ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}`;
  fitFigs();
  $("count").textContent = `${si + 1} / ${SLIDES.length}`;
  $("prev").disabled = si === 0;
  $("next").disabled = si === SLIDES.length - 1;
  $("jump").value = String(si);
  $("trnote").hidden = !lang;
  store.set(SLIDE_KEY, si);
}
/* Make the pictures as big as the space left on the slide allows: try
   each number of columns and keep the one that gives the biggest. */
function fitFigs(){
  const figs = document.querySelector("#slide .figs");
  if (!figs) return;
  figs.style.gridTemplateColumns = figs.style.justifyContent = "";
  if (matchMedia("(max-width:760px)").matches) return;
  const cols = figs.closest(".cols"), list = [...figs.children];
  const svg0 = list[0].querySelector("svg").getBoundingClientRect();
  const padW = list[0].offsetWidth - svg0.width;
  let padH = list[0].offsetHeight - svg0.height;
  const gap = parseFloat(getComputedStyle(figs).columnGap) || 0;
  const ar = Math.min(...list.map((f) => { const b = f.querySelector("svg").viewBox.baseVal; return b && b.height ? b.width / b.height : 16 / 9; }));
  for (let pass = 0; pass < 2; pass++){
    const W = figs.clientWidth, H = cols.getBoundingClientRect().bottom - figs.getBoundingClientRect().top;
    let best = { w: 0, n: 1, rows: 1 };
    for (let n = 1; n <= list.length; n++){
      const rows = Math.ceil(list.length / n);
      const w = Math.min((W - (n - 1) * gap) / n, ((H - (rows - 1) * gap) / rows - padH) * ar + padW);
      if (w > best.w + 1) best = { w, n, rows };
    }
    figs.style.gridTemplateColumns = `repeat(${best.n}, ${Math.floor(best.w)}px)`;
    figs.style.justifyContent = "center";
    const over = figs.getBoundingClientRect().bottom - cols.getBoundingClientRect().bottom;
    if (over <= 0.5) break;
    padH += over / best.rows;   // a caption wrapped: leave room and try once more
  }
}
addEventListener("resize", fitFigs);
const go = (n) => { si = Math.min(Math.max(0, n), SLIDES.length - 1); renderSlide(); };
$("prev").onclick = () => go(si - 1);
$("next").onclick = () => go(si + 1);
$("jump").onchange = (e) => go(+e.target.value);
$("full").onclick = () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
};
document.addEventListener("keydown", (e) => {
  if ($("slides").hidden || e.target.closest("select,input,textarea")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(si + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(si - 1); }
});

/* ---------- quiz ---------- */
let queue = [], first = {}, done = 0;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function startQuiz(){ queue = QUIZ.map((_, i) => i); first = {}; done = 0; showQ(); }
function showQ(){
  if (!queue.length) return summary();
  const it = QUIZ[queue[0]];
  const opts = it.opts.length === 2 ? it.opts : shuffle(it.opts);
  $("quiz").innerHTML = `<div class="qcard">
    <div class="qtop"><span>${esc(it.fam)}</span><span>${done} of ${QUIZ.length} right</span></div>
    ${it.fig ? `<div class="qfig">${diagram(it.fig)}</div>` : ""}
    <p class="qtext">${esc(it.q)}</p>
    <div class="opts">${opts.map((o) => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div class="qrow"><button type="button" class="btn ghost" id="skip">Skip for now</button><button type="button" class="btn" id="qnext" hidden>Next &rarr;</button></div>
  </div>`;
  const qi = queue[0];
  $("quiz").querySelectorAll(".opts button").forEach((b) => b.onclick = () => {
    const ok = b.dataset.o === it.a;
    if (first[qi] === undefined) first[qi] = ok;
    $("quiz").querySelectorAll(".opts button").forEach((x) => {
      x.disabled = true;
      if (x.dataset.o === it.a) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    const fb = $("fb");
    fb.className = "feedback show " + (ok ? "ok" : "no");
    fb.innerHTML = `<b>${ok ? "Right." : `Not this time. The answer is: ${esc(it.a)}.`}</b> ${esc(it.why)}${ok ? "" : " This one comes back at the end."}`;
    queue.shift();
    if (ok) done++; else queue.push(qi);
    $("skip").hidden = true;
    $("qnext").hidden = false;
    $("qnext").focus();
  });
  $("skip").onclick = () => { queue.push(queue.shift()); showQ(); };
  $("qnext").onclick = showQ;
}
function summary(){
  const right = QUIZ.filter((_, i) => first[i] === true).length;
  const missed = QUIZ.map((it, i) => first[i] === false ? it : null).filter(Boolean);
  const byFam = {};
  missed.forEach((it) => (byFam[it.fam] = byFam[it.fam] || []).push(it.a));
  const day = new Date(), pad = (n) => String(n).padStart(2, "0");
  const date = `${day.getFullYear()}-${pad(day.getMonth() + 1)}-${pad(day.getDate())}`;
  const rec = store.get(RESULT_KEY, { quiz: [] });
  rec.quiz = (rec.quiz || []).concat([{ date, right, total: QUIZ.length, missed: missed.map((m) => m.a) }]).slice(-30);
  store.set(RESULT_KEY, rec);
  const line = `Rabbit-Proof Fence film techniques\t${date}\t${right}/${QUIZ.length} right first try\t${missed.length ? "Missed: " + missed.map((m) => m.a).join("; ") : "No misses"}`;
  $("quiz").innerHTML = `<div class="qcard sum">
    <h2>Quiz finished</h2>
    <div class="big">${right} / ${QUIZ.length}</div>
    <p>right on the first try.</p>
    ${missed.length ? `<p style="margin-top:10px"><b>Go back over these slides:</b></p><ul>${
      Object.keys(byFam).map((f) => `<li><b>${esc(f)}:</b> ${esc(byFam[f].join(", "))}</li>`).join("")}</ul>` : `<p style="margin-top:10px">No misses.</p>`}
    <div class="qrow" style="justify-content:flex-start">
      <button type="button" class="btn" id="again">Try again</button>
      <button type="button" class="btn ghost" id="copy">Copy my result</button>
    </div>
    <p class="honest">Saved on this device only, so it shows in your ELC Hub report. It cannot tell whether you had help.</p>
  </div>`;
  $("again").onclick = startQuiz;
  $("copy").onclick = () => {
    const done = () => { $("copy").textContent = "Copied"; };
    if (navigator.clipboard) navigator.clipboard.writeText(line).then(done, () => prompt("Copy this:", line));
    else prompt("Copy this:", line);
  };
}

/* ---------- modes ---------- */
function setMode(m){
  const quiz = m === "quiz";
  $("slides").hidden = quiz; $("quiz").hidden = !quiz;
  $("tabSlides").setAttribute("aria-selected", String(!quiz));
  $("tabQuiz").setAttribute("aria-selected", String(quiz));
  if (quiz && !queue.length && !Object.keys(first).length) startQuiz();
  history.replaceState(null, "", quiz ? "#quiz" : "#slides");
}
$("tabSlides").onclick = () => setMode("slides");
$("tabQuiz").onclick = () => setMode("quiz");
$("lang").onchange = (e) => { lang = e.target.value; store.set(LANG_KEY, lang); renderSlide(); };

renderSlide();
setMode(location.hash === "#quiz" ? "quiz" : "slides");
</script>
