<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f4b4b'/><path d='M4 13h24M4 19h24' stroke='%23e8b36a' stroke-width='2'/><path d='M9 8v18M16 8v18M23 8v18' stroke='%23f5efe4' stroke-width='3' stroke-linecap='round'/></svg>">
<title>Writing workshops: Rabbit-Proof Fence</title>
<style>
:root{
  --bg:#f5efe4; --card:#fffaf1; --ink:#2a2118; --muted:#6c5f50; --line:#e1d2ba;
  --earth:#b5532a; --deep:#1f4b4b; --good:#1d6b3c; --goodbg:#e3f3e8; --ok:#7a5200; --okbg:#fbefd3;
  --bad:#a3271b; --badbg:#fbe4e0; --r:10px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#17140f; --card:#241f18; --ink:#f4ede1; --muted:#c9bba6; --line:#463c2e;
         --earth:#e58a5c; --deep:#8fcfc6; --good:#86d6a2; --goodbg:#183323; --ok:#f0c56b; --okbg:#3a2e12;
         --bad:#f19a8c; --badbg:#3d1d18; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
.serif{font-family:Georgia,"Times New Roman",serif}

/* ---- top bar ---- */
#top{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 12px;
     background:var(--deep);color:#fff}
#top a.back{color:#fff;text-decoration:none;font-size:13px;opacity:.9;padding:8px 6px}
#top a.back:hover{text-decoration:underline}
#top h1{font:700 16px/1 Georgia,serif;margin:0 10px 0 2px;white-space:nowrap}
#tabs{display:flex;gap:4px;flex-wrap:wrap}
#tabs button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;
     padding:7px 13px;cursor:pointer;font-size:13.5px;min-height:36px}
#tabs button.on{background:#fff;color:#1f4b4b;font-weight:700}
#tabs button .tick{margin-left:5px;font-size:12px}

main{flex:1 1 auto;min-height:0;padding:10px 14px 12px;max-width:1360px;width:100%;margin:0 auto}
.panel{display:none;height:100%;min-height:0}
.panel.on{display:grid}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:0}
.scroll{overflow:auto}
h2{font:700 15px/1.3 system-ui,sans-serif;margin:0 0 8px}
.lab{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.q{font-family:Georgia,serif;font-size:15px;margin:0 0 8px;color:var(--muted)}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;
     font-size:13.5px;min-height:36px}
.pills button.on{border:2px solid var(--ink);font-weight:700;padding:5px 11px}
.pills button .tick{color:var(--good);margin-left:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--deep);color:#fff;border-color:var(--deep)}
@media (prefers-color-scheme:dark){ .btn.main{color:#10201f} }
:focus-visible{outline:3px solid var(--earth);outline-offset:2px}
.small{font-size:12.5px;color:var(--muted)}
.fb{border-radius:8px;padding:8px 11px;font-size:14px;margin-top:8px;min-height:20px}
.fb:empty{display:none}
.fb.good{background:var(--goodbg);color:var(--good)}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}

/* ---- the three colours (values come from CRITERIA, see the script) ---- */
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:9px 14px;min-height:44px;
      font-weight:700;cursor:grab;touch-action:none;user-select:none;border:2px solid var(--fg);
      background:var(--bg2);color:var(--fg)}
.chip.armed{box-shadow:0 0 0 3px var(--ink)}
.chip .g{font-size:15px}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%) rotate(-2deg);
       box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:.95}
.lifting{opacity:.35}
.over{outline:3px dashed var(--ink);outline-offset:2px}

/* ---- colour it ---- */
#p-colour{grid-template-columns:270px minmax(0,1fr);gap:12px}
.chips{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.para{font-family:Georgia,serif;font-size:21px;line-height:2.05;margin:0}
.seg{padding:2px 1px;cursor:pointer;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.seg:hover{background:rgba(127,127,127,.12)}
.seg.on{background:var(--bg2);color:var(--fg);font-weight:700;text-decoration:underline;text-decoration-style:var(--ul);
        text-decoration-thickness:2px;text-underline-offset:4px;cursor:default}
.seg.on .gl{font-size:.62em;vertical-align:.55em;margin-right:2px}
.seg.miss{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.rub{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13.5px;margin-top:10px}
.rub .rk{font-weight:800;color:var(--fg);white-space:nowrap}
.count{font-size:14px;margin:6px 0}

/* ---- sort ---- */
#p-sort{grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:12px}
#sortCols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;border:2px dashed var(--line);border-radius:var(--r);padding:8px;background:var(--card)}
.col.over{outline:none;border-color:var(--ink)}
.col h3{margin:0;font:700 15px/1.2 Georgia,serif}
.col .desc{font-size:11.5px;color:var(--muted);margin:3px 0 6px;line-height:1.35}
.col .drop{flex:1;min-height:60px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;line-height:1.4;
      cursor:grab;touch-action:none;user-select:none;text-align:left;width:100%}
.card .tag{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.card.armed{box-shadow:0 0 0 3px var(--ink)}
.card.right{border-color:var(--good);background:var(--goodbg);cursor:default}
.card.wrong{border-color:var(--bad);background:var(--badbg)}
.card .why{display:block;margin-top:5px;font-size:12px;font-weight:600}
.card.right .why{color:var(--good)} .card.wrong .why{color:var(--bad)}
#tray{display:flex;flex-direction:column;gap:6px}

/* ---- three ways ---- */
#p-ways{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.frame{font-family:Georgia,serif;font-size:20px;line-height:2.1;background:var(--card);border:1px solid var(--line);
       border-radius:var(--r);padding:12px 16px}
.slot{display:inline-block;min-width:110px;border:2px dashed var(--fg,var(--muted));border-radius:6px;padding:0 8px;
      line-height:1.5;vertical-align:baseline;color:var(--muted);font-size:15px;font-family:system-ui,sans-serif}
.slot.cur{background:rgba(127,127,127,.1)}
.slot.filled,.giv{border-style:solid;background:var(--bg2);color:var(--fg);font-weight:700;font-family:Georgia,serif;font-size:20px;
       text-decoration:underline;text-decoration-style:var(--ul);text-underline-offset:4px;border-radius:5px;padding:0 4px}
.giv{border:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tile{display:block;text-align:left;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:42px;
      background:var(--bg2,var(--card));color:var(--fg,var(--ink));font-weight:600;cursor:grab;touch-action:none;user-select:none}
.tile.armed{box-shadow:0 0 0 3px var(--ink)}
.tile.no{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.k-verb,.k-subj,.k-join{--fg:var(--ink);--bg2:var(--card);--ul:solid}

/* ---- climb ---- */
#p-climb{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px 12px}
#strip{min-height:84px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;align-items:center;
       border:2px dashed var(--line);border-radius:var(--r);padding:10px;background:var(--card)}
#strip.over{outline:none;border-color:var(--ink)}
#strip:empty::before{content:"Drag tiles here, or tap them.";color:var(--muted);font-size:14px}
.ct{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-height:40px;
    background:var(--bg2);color:var(--fg);font-weight:600;font-size:14.5px;cursor:grab;touch-action:none;user-select:none}
.ct .gl{font-size:11px}
.ct.ret{background:var(--badbg);color:var(--bad);border:2px solid var(--bad);text-decoration:line-through}
.ct.armed{box-shadow:0 0 0 3px var(--ink)}
.caret{width:3px;align-self:stretch;background:var(--ink);border-radius:2px}
#bank{columns:2 260px;column-gap:16px}
.bankgrp{margin-bottom:8px;break-inside:avoid}
.bankgrp .tiles{display:flex;flex-wrap:wrap;gap:6px}
.needs{list-style:none;padding:0;margin:0;font-size:13.5px}
.needs li{padding:4px 0 4px 24px;position:relative;border-bottom:1px dotted var(--line)}
.needs li::before{content:"○";position:absolute;left:4px;color:var(--muted)}
.needs li.y::before{content:"✓";color:var(--good);font-weight:800}
.needs li.n::before{content:"✗";color:var(--bad);font-weight:800}
.needs li.n{color:var(--bad)}

/* ---- write ---- */
#p-write{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:40px;max-width:100%}
textarea{width:100%;font:17px/1.6 Georgia,serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
         background:var(--card);color:var(--ink);resize:vertical;min-height:150px}
.framebox{font-family:Georgia,serif;font-size:15px;background:var(--bg);border-radius:8px;padding:8px 11px;margin:6px 0 8px}
#mine{font-family:Georgia,serif;font-size:18px;line-height:2;user-select:none;touch-action:none}
#mine .w{padding:2px 1px;border-radius:3px;cursor:pointer}
#mine .w.on{background:var(--bg2);color:var(--fg);font-weight:700;text-decoration:underline;text-decoration-style:var(--ul);text-underline-offset:4px}
.brush{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.brush button{min-height:40px}
.brush button.on{box-shadow:0 0 0 3px var(--ink)}

/* ---- report ---- */
#p-report{grid-template-columns:minmax(0,1fr);gap:10px;grid-template-rows:auto minmax(0,1fr)}
table.rep{border-collapse:collapse;width:100%;font-size:13.5px}
table.rep th,table.rep td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.rep th{background:var(--bg);width:190px}
#tsv{width:100%;font:12px/1.4 ui-monospace,Consolas,monospace;min-height:60px}

@media screen and (max-width:860px){
  body{overflow:auto;height:auto} main{height:auto}
  .panel.on{display:block} .panel.on>*{margin-bottom:10px}
  #sortCols{grid-template-columns:1fr}
  .para{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="kindcss"></style>
</head>
<body>
<div id="top">
  <a class="back" href="index.html">&larr; Rabbit-Proof Fence</a>
  <h1>Writing workshops</h1>
  <nav id="tabs" aria-label="Workshops"></nav>
</div>
<main>
  <!-- 1 · Colour it -->
  <section class="panel" id="p-colour" aria-label="Colour it">
    <div class="box scroll">
      <div class="lab">Question</div>
      <div class="pills" id="colSet"></div>
      <div class="lab">Band</div>
      <div class="pills" id="colBand"></div>
      <div class="lab">Drag a colour onto a phrase</div>
      <div class="chips" id="colChips"></div>
      <div class="count" id="colCount"></div>
      <button class="btn" id="colReset">Start this paragraph again</button>
    </div>
    <div class="box scroll">
      <p class="q" id="colQ"></p>
      <p class="para" id="colPara"></p>
      <div class="fb" id="colFb" aria-live="polite"></div>
      <div id="colRub"></div>
    </div>
  </section>

  <!-- 2 · Sort -->
  <section class="panel" id="p-sort" aria-label="Sort the wall">
    <div class="box scroll">
      <div class="lab">Paragraphs</div>
      <div class="pills" id="sortSet"></div>
      <div id="tray"></div>
      <div class="fb" id="sortFb" aria-live="polite"></div>
    </div>
    <div id="sortCols"></div>
  </section>

  <!-- 3 · Three ways in -->
  <section class="panel" id="p-ways" aria-label="Three ways in">
    <div class="box scroll">
      <div class="pills" id="wayRoutes"></div>
      <div class="frame" id="wayFrame"></div>
      <div class="fb" id="wayFb" aria-live="polite"></div>
      <div id="wayAfter" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="box scroll">
      <div class="lab" id="wayAsk"></div>
      <div class="opts" id="wayOpts"></div>
    </div>
  </section>

  <!-- 4 · The climb -->
  <section class="panel" id="p-climb" aria-label="The climb">
    <div class="box" style="grid-column:1 / -1">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
        <div class="pills" id="climbBand" style="margin:0"></div>
        <span class="q" style="margin:0" id="climbQ"></span>
      </div>
      <div id="strip" aria-label="Your sentence"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <button class="btn main" id="climbCheck">Check</button>
        <button class="btn" id="climbUp"></button>
        <button class="btn" id="climbClear">Clear</button>
        <span class="small">Checks the parts, not the grammar. Read it aloud.</span>
      </div>
    </div>
    <div class="box scroll" id="bank"></div>
    <div class="box scroll">
      <div class="lab" id="needLab"></div>
      <ul class="needs" id="needs"></ul>
      <div class="fb" id="climbFb" aria-live="polite"></div>
    </div>
  </section>

  <!-- 5 · Write -->
  <section class="panel" id="p-write" aria-label="Write your own">
    <div class="box scroll">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
        <label class="small">Theme<br><select id="wTheme"></select></label>
        <label class="small">Moment<br><select id="wMoment"></select></label>
      </div>
      <div class="pills" id="wBand"></div>
      <div class="framebox" id="wFrame"></div>
      <textarea id="wText" aria-label="Your paragraph" spellcheck="true"></textarea>
      <div class="small" id="wSaved"></div>
    </div>
    <div class="box scroll">
      <div class="lab">Colour your own: pick a colour, then tap or drag across words</div>
      <div class="brush" id="brush"></div>
      <div id="mine"></div>
      <div class="fb" id="wFb" aria-live="polite"></div>
    </div>
  </section>

  <!-- Report -->
  <section class="panel" id="p-report" aria-label="Report">
    <div class="box">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn main" id="copyRow">Copy my row</button>
        <button class="btn" id="copyHead">Copy the headings</button>
        <span class="small" id="copied" aria-live="polite"></span>
      </div>
      <textarea id="tsv" readonly aria-label="Report row" style="margin-top:8px"></textarea>
    </div>
    <div class="box scroll"><table class="rep" id="repTable"></table>
      <p class="small">First tries only. Saved in this browser, nowhere else.</p></div>
  </section>
</main>

<script src="writing-content.js"></script>
<script src="workshop-content.js"></script>
<script>
"use strict";
/* =========================================================================
   Rabbit-Proof Fence writing workshops. Content is in workshop-content.js
   and writing-content.js; this script knows nothing about the film.
   ========================================================================= */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KIND = Object.fromEntries(CRITERIA.map(c => [c.key, c]));
const SHORT = Object.fromEntries(WS_KINDS.map(k => [k.key, k.short]));
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

/* ---- colour classes from CRITERIA: ink on paper, lamp in dark mode ---- */
(function(){
  let css = "", dark = "";
  for (const c of CRITERIA) {
    css  += `.k-${c.key}{--fg:${c.ink};--bg2:${c.soft};--ul:${c.underline}}`;
    dark += `.k-${c.key}{--fg:${c.lamp};--bg2:${c.lamp}22}`;
  }
  $("kindcss").textContent = css + `@media (prefers-color-scheme:dark){${dark}}`;
})();
const glyph = k => KIND[k] ? `<span class="gl" aria-hidden="true">${KIND[k].glyph}</span>` : "";

/* ---- saved state ---- */
const KEY = "elc.rpf.workshop.v1";
const S = Object.assign({
  start: Date.now(), secs: 0,
  colour: {},   /* pid -> {done:{i:1}, first:{i:true|false}} */
  colourMiss: {}, /* "evid>purp" -> n  (dropped>actual) */
  sort: {},     /* cardId -> {first: band placed first, right:bool} */
  ways: {},     /* routeId -> {weak:[text], done:bool} */
  climb: { band:2, strip:[], passed:{}, first:{}, firstMiss:{} },
  write: { theme:"belonging", moment:0, band:"C3", text:"", marks:{}, savedAt:null },
  log: []
}, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } })());
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function logEvent(what, detail){
  const day = today();
  if (!S.log.some(e => e.day === day && e.what === what && e.detail === detail)) S.log.push({ day, what, detail });
}
/* time on task: counts only while the page is visible and touched in the last two minutes */
let lastTouch = Date.now();
["pointerdown","keydown"].forEach(ev => addEventListener(ev, () => lastTouch = Date.now(), true));
setInterval(() => { if (document.visibilityState === "visible" && Date.now() - lastTouch < 120000) { S.secs += 15; save(); } }, 15000);

/* =========================================================================
   DRAG: pointer events, so it works with a mouse, a finger or a pen.
   A tap (no movement) falls through to the element's click handler, so
   every drag can also be done as tap-then-tap, and with the keyboard.
   ========================================================================= */
let justDragged = false;
function dragify(el, targetSel, onDrop, onMove){
  el.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
    const move = ev => {
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 7) return;
        ghost = el.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("armed");
        ghost.style.width = el.offsetWidth + "px";
        document.body.appendChild(ghost); el.classList.add("lifting");
      }
      ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
      const hit = document.elementFromPoint(ev.clientX, ev.clientY);
      const t = hit && hit.closest(targetSel);
      if (t !== over) { over && over.classList.remove("over"); over = t; over && over.classList.add("over"); }
      onMove && onMove(ev, t);
    };
    const up = ev => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
      if (!ghost) return;
      ghost.remove(); el.classList.remove("lifting"); over && over.classList.remove("over");
      justDragged = true; setTimeout(() => justDragged = false, 0);
      onDrop(over, ev);
    };
    addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
  });
}
function onTap(el, fn){ el.addEventListener("click", e => { if (!justDragged) fn(e); }); }

/* =========================================================================
   TABS
   ========================================================================= */
const TABS = [
  ["colour","1 · Colour it"], ["sort","2 · Sort"], ["ways","3 · Three ways in"],
  ["climb","4 · The climb"], ["write","5 · Write"], ["report","Report"]
];
function tabDone(id){
  if (id === "colour") return Object.keys(S.colour).some(p => isColourDone(p));
  if (id === "sort")   return Object.values(S.sort).some(c => c.right);
  if (id === "ways")   return Object.values(S.ways).some(w => w.done);
  if (id === "climb")  return !!S.climb.passed[4];
  if (id === "write")  return S.write.text.trim().split(/\s+/).length >= 15;
  return false;
}
function drawTabs(){
  const cur = (location.hash || "#colour").slice(1);
  $("tabs").innerHTML = TABS.map(([id, name]) =>
    `<button data-t="${id}" class="${id===cur?"on":""}" aria-current="${id===cur}">${name}${tabDone(id)?'<span class="tick" aria-label="started">✓</span>':""}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { location.hash = b.dataset.t; });
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + cur));
  if (cur === "report") drawReport();
}
addEventListener("hashchange", drawTabs);

/* =========================================================================
   PARAGRAPHS: parse {key|text} into segments
   ========================================================================= */
function paraText(set, band){
  const p = set.paras[band];
  return p.src === "EXAMPLES" ? EXAMPLES[band] : p.text;
}
function segments(src){
  const out = []; const re = /\{(\w+)\|([^}]*)\}/g; let last = 0, m;
  const plain = t => { if (!t) return;
    /* a run with no letters (". ", ", ") is not a target */
    out.push({ k: /[A-Za-z]/.test(t) ? "plain" : "punct", t }); };
  while ((m = re.exec(src))) { plain(src.slice(last, m.index)); out.push({ k: m[1], t: m[2] }); last = re.lastIndex; }
  plain(src.slice(last));
  return out;
}
const stripMarks = src => src.replace(/\{\w+\|([^}]*)\}/g, "$1");
const isTarget = k => k === "idea" || k === "evid" || k === "purp";

/* =========================================================================
   1 · COLOUR IT
   ========================================================================= */
let colSet = 0, colBand = "C2", armed = null;
const pid = () => WS_SETS[colSet].id + "-" + colBand;
function colRec(){ return S.colour[pid()] || (S.colour[pid()] = { done:{}, first:{} }); }
function isColourDone(p){
  const [sid, band] = p.split("-"); const set = WS_SETS.find(s => s.id === sid); if (!set) return false;
  const segs = segments(paraText(set, band)); const r = S.colour[p];
  return r && segs.every((s, i) => !isTarget(s.k) || r.done[i]);
}
function drawColour(){
  $("colSet").innerHTML = WS_SETS.map((s, i) =>
    `<button data-i="${i}" class="${i===colSet?"on":""}">${esc(s.theme)}</button>`).join("");
  $("colSet").querySelectorAll("button").forEach(b => b.onclick = () => { colSet = +b.dataset.i; drawColour(); });
  $("colBand").innerHTML = WS_BANDS.map(b =>
    `<button data-b="${b}" class="${b===colBand?"on":""}">${b}${isColourDone(WS_SETS[colSet].id+"-"+b)?'<span class="tick">✓</span>':""}</button>`).join("");
  $("colBand").querySelectorAll("button").forEach(b => b.onclick = () => { colBand = b.dataset.b; drawColour(); });

  $("colChips").innerHTML = WS_KINDS.map(k =>
    `<button class="chip k-${k.key} ${armed===k.key?"armed":""}" data-k="${k.key}" aria-pressed="${armed===k.key}">`+
    `<span class="g" aria-hidden="true">${KIND[k.key].glyph}</span>${k.short}</button>`).join("");
  $("colChips").querySelectorAll(".chip").forEach(c => {
    dragify(c, ".seg", t => { if (t) colourDrop(c.dataset.k, +t.dataset.i); });
    onTap(c, () => { armed = armed === c.dataset.k ? null : c.dataset.k; drawColour(); });
  });

  const set = WS_SETS[colSet], segs = segments(paraText(set, colBand)), r = colRec();
  $("colQ").textContent = set.q;
  $("colPara").innerHTML = segs.map((s, i) => {
    if (s.k === "punct") return esc(s.t);
    if (r.done[i]) return `<span class="seg on k-${s.k}">${glyph(s.k)}${esc(s.t)}</span>`;
    /* a span, not a button, so the phrase wraps like the rest of the line;
       spaces at its edges sit outside it */
    const m = s.t.match(/^(\s*)(.*?)(\s*)$/s);
    return `${m[1]}<span class="seg" role="button" tabindex="0" data-i="${i}">${esc(m[2])}</span>${m[3]}`;
  }).join("");
  $("colPara").querySelectorAll("span.seg:not(.on)").forEach(b => b.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); b.click(); } }));
  $("colPara").querySelectorAll("span.seg:not(.on)").forEach(b => onTap(b, () => {
    if (!armed) { say("colFb", "ok", "Pick a colour first: ▲ Theme, ■ Evidence or ● Purpose."); return; }
    colourDrop(armed, +b.dataset.i);
  }));

  const total = segs.filter(s => isTarget(s.k)).length;
  const done = segs.filter((s, i) => isTarget(s.k) && r.done[i]).length;
  const first = segs.filter((s, i) => isTarget(s.k) && r.first[i] === true).length;
  $("colCount").innerHTML = `${done} of ${total} coloured` + (done ? ` · <b>${first}</b> right first try` : "");
  /* when the paragraph is fully coloured, the band's rubric lines appear beside it */
  $("colRub").innerHTML = done === total ? `<div class="lab" style="margin-top:12px">${colBand} ${WS_SKILL[colBand]}: the rubric</div><div class="rub">` +
    WS_KINDS.map(k => `<span class="rk k-${k.key}">${KIND[k.key].glyph} ${k.short}</span><span>${esc(CONTINUUM[k.key][colBand])}</span>`).join("") + `</div>` : "";
  drawTabs();
}
function colourDrop(kind, i){
  const set = WS_SETS[colSet], segs = segments(paraText(set, colBand)), s = segs[i], r = colRec();
  if (!s || r.done[i]) return;
  if (s.k === kind) {
    if (r.first[i] === undefined) r.first[i] = true;
    r.done[i] = 1;
    say("colFb", "good", `${KIND[kind].glyph} ${SHORT[kind]}: ${WS_KINDS.find(k=>k.key===kind).ask}.`);
    if (isColourDone(pid())) logEvent("Colour it", set.theme + " " + colBand);
  } else {
    if (isTarget(s.k) && r.first[i] === undefined) r.first[i] = false;
    const miss = kind + ">" + (isTarget(s.k) ? s.k : "black");
    S.colourMiss[miss] = (S.colourMiss[miss] || 0) + 1;
    const msg = isTarget(s.k) ? WS_WRONG[kind][s.k] : (s.k === "lang" ? WS_WRONG.lang : WS_WRONG.plain);
    say("colFb", "bad", msg);
    const el = $("colPara").querySelector(`[data-i="${i}"]`);
    if (el) { el.classList.remove("miss"); void el.offsetWidth; el.classList.add("miss"); }
  }
  save();
  const fb = $("colFb").innerHTML, cls = $("colFb").className;
  drawColour(); $("colFb").innerHTML = fb; $("colFb").className = cls;
  if (s.k !== kind) { const el = $("colPara").querySelector(`[data-i="${i}"]`); if (el) el.classList.add("miss"); }
}
$("colReset").onclick = () => { delete S.colour[pid()]; save(); say("colFb", "", ""); drawColour(); };
function say(id, cls, html){ const el = $(id); el.className = "fb " + cls; el.innerHTML = html; }

/* =========================================================================
   2 · SORT: drag each paragraph to the band it shows
   ========================================================================= */
const SORT_OPTS = [["all","All nine"]].concat(WS_SETS.map(s => [s.id, s.theme]));
let sortSet = "all", sortArmed = null;
const CARDS = [];
WS_SETS.forEach(s => WS_BANDS.forEach(b => CARDS.push({ id: s.id + "-" + b, set: s, band: b, text: stripMarks(paraText(s, b)) })));
/* a fixed order (WS_SORT_ORDER) so the tray never runs C2, C3, C4 within a question */
CARDS.sort((a, b) => WS_SORT_ORDER.indexOf(a.id) - WS_SORT_ORDER.indexOf(b.id));
const place = {}; /* cardId -> band where it sits now (this visit) */
for (const [id, rec] of Object.entries(S.sort)) if (rec.right) place[id] = CARDS.find(c => c.id === id)?.band;

function drawSort(){
  $("sortSet").innerHTML = SORT_OPTS.map(([id, name]) => `<button data-s="${id}" class="${id===sortSet?"on":""}">${esc(name)}</button>`).join("");
  $("sortSet").querySelectorAll("button").forEach(b => b.onclick = () => { sortSet = b.dataset.s; drawSort(); });
  const shown = CARDS.filter(c => sortSet === "all" || c.set.id === sortSet);
  const cardHtml = c => {
    const rec = S.sort[c.id] || {}, at = place[c.id];
    const st = at ? (at === c.band ? "right" : "wrong") : "";
    let why = "";
    if (st === "right") why = `<span class="why">✓ ${esc(c.set.paras[c.band].why)}</span>`;
    if (st === "wrong") why = `<span class="why">${esc(sortWhy(c, at))}</span>`;
    return `<button class="card ${st} ${sortArmed===c.id?"armed":""}" data-c="${c.id}" ${st==="right"?'aria-disabled="true"':""}>`+
      `<span class="tag">${esc(c.set.theme)}</span>${esc(c.text)}${why}</button>`;
  };
  $("tray").innerHTML = shown.filter(c => !place[c.id]).map(cardHtml).join("") ||
    `<p class="small">All placed.</p>`;
  $("sortCols").innerHTML = WS_BANDS.map(b =>
    `<div class="col" data-b="${b}"><h3>${b} ${WS_SKILL[b]}</h3>`+
    `<div class="desc">${KIND.idea.glyph} ${esc(CONTINUUM.idea[b])}<br>${KIND.purp.glyph} ${esc(CONTINUUM.purp[b])}</div>`+
    `<div class="drop">${shown.filter(c => place[c.id] === b).map(cardHtml).join("")}</div></div>`).join("");
  document.querySelectorAll("#p-sort .card:not(.right)").forEach(el => {
    dragify(el, ".col", t => { if (t) sortDrop(el.dataset.c, t.dataset.b); });
    onTap(el, () => { sortArmed = sortArmed === el.dataset.c ? null : el.dataset.c; drawSort(); });
  });
  document.querySelectorAll("#sortCols .col").forEach(col => onTap(col, e => {
    if (sortArmed && !e.target.closest(".card")) sortDrop(sortArmed, col.dataset.b);
  }));
  drawTabs();
}
function sortWhy(c, at){
  const lo = WS_BANDS.indexOf(at) < WS_BANDS.indexOf(c.band);
  if (lo) return `Too low. This paragraph does more than ${at} ${WS_SKILL[at]}. Read the rubric lines at the top of the next column and find the words that match.`;
  /* too high: say what the band below the one chosen still needs */
  return `Too high. ${c.set.paras[c.band].lack}`;
}
function sortDrop(id, band){
  const c = CARDS.find(x => x.id === id); if (!c) return;
  const rec = S.sort[id] || (S.sort[id] = {});
  if (rec.first === undefined) rec.first = band;
  place[id] = band; sortArmed = null;
  if (band === c.band) { rec.right = true; say("sortFb", "good", `✓ ${esc(c.set.theme)}, ${band}.`);
    if (CARDS.filter(x => x.set === c.set).every(x => S.sort[x.id]?.right)) logEvent("Sort", c.set.theme); }
  else say("sortFb", "bad", esc(sortWhy(c, band)));
  save(); drawSort();
}

/* =========================================================================
   3 · THREE WAYS IN
   ========================================================================= */
let wayI = 0, wayPicks = [], wayArmed = null;
function wayKindOf(step){ return step.kind; }
function drawWays(){
  const R = WS_ROUTES[wayI];
  $("wayRoutes").innerHTML = WS_ROUTES.map((r, i) =>
    `<button data-i="${i}" class="${i===wayI?"on":""}">${esc(r.name)}${S.ways[r.id]?.done?'<span class="tick">✓</span>':""}</button>`).join("");
  $("wayRoutes").querySelectorAll("button").forEach(b => b.onclick = () => { wayI = +b.dataset.i; wayPicks = []; say("wayFb","",""); drawWays(); });

  const stepIdx = wayPicks.length, done = stepIdx >= R.steps.length;
  const filled = {}; R.steps.forEach((st, i) => { if (wayPicks[i] !== undefined) filled[st.kind] = st.opts[wayPicks[i]].t; });
  let html = "", first = true;
  for (const part of R.build) {
    let piece;
    if (part[0] === "@") {
      const k = part.slice(1);
      const gt = first ? R.given.text.charAt(0).toUpperCase() + R.given.text.slice(1) : R.given.text;
      if (R.given.kind === k) piece = `<span class="giv k-${k}">${glyph(k)}${esc(gt)}</span>`;
      else {
        const si = R.steps.findIndex(s => s.kind === k);
        piece = filled[k] !== undefined
          ? `<span class="slot filled k-${k}">${glyph(k)}${esc(filled[k])}</span>`
          : `<span class="slot k-${k} ${si===stepIdx?"cur":""}" data-si="${si}">${esc(R.steps[si].ask)}</span>`;
      }
    } else piece = esc(part);
    if (first && part[0] !== "@") piece = piece.charAt(0).toUpperCase() + piece.slice(1);
    html += (html && !/^[,.]/.test(part) ? " " : "") + piece; first = false;
  }
  $("wayFrame").innerHTML = html;

  if (done) {
    $("wayAsk").textContent = "";
    $("wayOpts").innerHTML = "";
    const next = WS_ROUTES.findIndex(r => !S.ways[r.id]?.done);
    $("wayAfter").innerHTML = `<button class="btn" id="wayAgain">Again, different choices</button>` +
      (next >= 0 ? `<button class="btn main" id="wayNext">${esc(WS_ROUTES[next].name)}</button>` : "");
    $("wayAgain").onclick = () => { wayPicks = []; say("wayFb","",""); drawWays(); };
    if ($("wayNext")) $("wayNext").onclick = () => { wayI = next; wayPicks = []; say("wayFb","",""); drawWays(); };
  } else {
    $("wayAfter").innerHTML = "";
    const st = R.steps[stepIdx];
    $("wayAsk").innerHTML = `${glyph(st.kind)} ${esc(st.ask)}`;
    /* the data lists the best option first; rotate so position never gives it away */
    const rot = (wayI * 3 + stepIdx) % st.opts.length;
    const order = st.opts.map((_, j) => (j + rot) % st.opts.length);
    $("wayOpts").innerHTML = order.map(j =>
      `<button class="tile k-${st.kind} ${wayArmed===j?"armed":""}" data-j="${j}">${esc(st.opts[j].t)}</button>`).join("");
    $("wayOpts").querySelectorAll(".tile").forEach(t => {
      dragify(t, ".slot.cur", tgt => { if (tgt) wayPick(+t.dataset.j); });
      onTap(t, () => wayPick(+t.dataset.j));
    });
  }
  drawTabs();
}
function wayPick(j){
  const R = WS_ROUTES[wayI], st = R.steps[wayPicks.length], o = st.opts[j];
  const rec = S.ways[R.id] || (S.ways[R.id] = { weak:[], done:false });
  if (o.q === "weak") {
    if (!rec.weak.includes(o.t)) rec.weak.push(o.t);
    say("wayFb", "bad", esc(o.why)); save();
    const el = $("wayOpts").querySelector(`[data-j="${j}"]`); if (el) el.classList.add("no");
    return;
  }
  wayPicks.push(j);
  say("wayFb", o.q === "good" ? "good" : "ok", esc(o.why));
  if (wayPicks.length === R.steps.length) { rec.done = true; logEvent("Three ways in", R.name); }
  save(); drawWays();
}

/* =========================================================================
   4 · THE CLIMB
   ========================================================================= */
const T = WS_CLIMB.tiles.map((t, i) => Object.assign({ i }, t));
const BANDNAME = n => "C" + n;
let climbArmed = null, caretAt = -1;
const live = n => t => t.lv[0] <= n && n <= t.lv[1];
const retiredAt = (t, n) => n > t.lv[1];
function drawClimb(){
  const n = S.climb.band;
  $("climbQ").textContent = WS_CLIMB.moment + " · " + WS_CLIMB.q;
  $("climbBand").innerHTML = [2,3,4].map(b =>
    `<button data-b="${b}" class="${b===n?"on":""}">${BANDNAME(b)} ${WS_SKILL[BANDNAME(b)]}${S.climb.passed[b]?'<span class="tick">✓</span>':""}</button>`).join("");
  $("climbBand").querySelectorAll("button").forEach(b => b.onclick = () => setBand(+b.dataset.b));

  /* the sentence */
  const strip = S.climb.strip.map(i => T[i]);
  $("strip").innerHTML = strip.map((t, pos) =>
    (caretAt === pos ? `<span class="caret"></span>` : "") +
    `<button class="ct k-${t.k} ${retiredAt(t, n)?"ret":""} ${climbArmed===("s"+pos)?"armed":""}" data-pos="${pos}" `+
    `aria-label="${esc(t.t)}${retiredAt(t,n)?", retired":""}. Arrow keys move it, Delete removes it.">${glyph(t.k)}${esc(t.t)}</button>`).join("") +
    (caretAt === strip.length ? `<span class="caret"></span>` : "");
  $("strip").querySelectorAll(".ct").forEach(el => {
    const pos = +el.dataset.pos;
    dragify(el, "#strip, #bank", (tgt, ev) => {
      caretAt = -1;
      if (!tgt) { drawClimb(); return; }
      if (tgt.id === "bank") { S.climb.strip.splice(pos, 1); }
      else { const to = insertIndex(ev); const [v] = S.climb.strip.splice(pos, 1); S.climb.strip.splice(to > pos ? to - 1 : to, 0, v); }
      save(); drawClimb();
    }, trackCaret);
    onTap(el, () => { S.climb.strip.splice(pos, 1); save(); drawClimb(); focusStrip(Math.min(pos, S.climb.strip.length - 1)); });
    el.addEventListener("keydown", e => {
      const s = S.climb.strip;
      if ((e.key === "ArrowLeft" && pos > 0) || (e.key === "ArrowRight" && pos < s.length - 1)) {
        const to = e.key === "ArrowLeft" ? pos - 1 : pos + 1; [s[pos], s[to]] = [s[to], s[pos]];
        save(); drawClimb(); focusStrip(to); e.preventDefault();
      }
      if (e.key === "Delete" || e.key === "Backspace") { s.splice(pos, 1); save(); drawClimb(); focusStrip(Math.min(pos, s.length - 1)); e.preventDefault(); }
    });
  });

  /* the bank: only tiles live at this band */
  const groups = [["idea","Theme"],["evid","Evidence"],["purp","Purpose"],["subj","Who"],["verb","Verb"],["join","Joiners"]];
  $("bank").innerHTML = groups.map(([k, name]) => {
    const tiles = T.filter(t => t.k === k && live(n)(t));
    return `<div class="bankgrp"><div class="lab">${glyph(k)} ${name}</div><div class="tiles">` +
      tiles.map(t => `<button class="ct k-${t.k}" data-t="${t.i}">${esc(t.t)}</button>`).join("") + `</div></div>`;
  }).join("");
  $("bank").querySelectorAll(".ct").forEach(el => {
    dragify(el, "#strip", (tgt, ev) => {
      if (tgt) { S.climb.strip.splice(insertIndex(ev), 0, +el.dataset.t); save(); }
      caretAt = -1; drawClimb();
    }, trackCaret);
    onTap(el, () => { S.climb.strip.push(+el.dataset.t); save(); drawClimb(); });
  });

  $("needLab").textContent = BANDNAME(n) + " " + WS_SKILL[BANDNAME(n)] + " needs";
  if (!$("needs").dataset.checked || +$("needs").dataset.checked !== n)
    $("needs").innerHTML = WS_CLIMB.need[n].map(([, msg]) => `<li>${esc(msg)}</li>`).join("");
  $("climbUp").textContent = n < 4 ? "Lift it to " + BANDNAME(n + 1) : "Back to C2";
  drawTabs();
}
function focusStrip(pos){ const el = $("strip").querySelector(`[data-pos="${pos}"]`); if (el) el.focus(); }
function insertIndex(ev){
  const kids = [...$("strip").querySelectorAll(".ct:not(.lifting)")];
  for (const k of kids) {
    const r = k.getBoundingClientRect();
    if (ev.clientY < r.top) return +k.dataset.pos;
    if (ev.clientY <= r.bottom && ev.clientX < r.left + r.width / 2) return +k.dataset.pos;
  }
  return S.climb.strip.length;
}
function trackCaret(ev, tgt){
  const want = tgt && tgt.id === "strip" ? insertIndex(ev) : -1;
  if (want !== caretAt) { caretAt = want;
    const old = $("strip").querySelector(".caret"); if (old) old.remove();
    if (want >= 0) { const c = document.createElement("span"); c.className = "caret";
      const at = $("strip").querySelector(`.ct[data-pos="${want}"]`); $("strip").insertBefore(c, at); } }
}
function setBand(b){
  S.climb.band = b; save(); $("needs").dataset.checked = "";
  const ret = S.climb.strip.map(i => T[i]).filter(t => retiredAt(t, b));
  if (ret.length) say("climbFb", "bad", ret.map(t => `<b>${esc(t.t)}</b>: ${esc(t.retire)}`).join("<br>"));
  else say("climbFb", "", "");
  drawClimb();
}
$("climbUp").onclick = () => setBand(S.climb.band < 4 ? S.climb.band + 1 : 2);
$("climbClear").onclick = () => { S.climb.strip = []; save(); say("climbFb","",""); drawClimb(); };
$("climbCheck").onclick = () => {
  const n = S.climb.band, strip = S.climb.strip.map(i => T[i]);
  const has = f => strip.some(f);
  const TEST = {
    subj: () => has(t => t.k === "subj"), verb: () => has(t => t.k === "verb"), evid: () => has(t => t.k === "evid"),
    ideaOrPurp: () => has(t => t.k === "idea" || t.k === "purp"),
    tech: () => has(t => t.k === "evid" && t.tech), idea3: () => has(t => t.k === "idea" && t.n >= 3),
    purp3: () => has(t => t.k === "purp" && t.n >= 3), con: () => has(t => t.k === "join" && t.con),
    noyce: () => has(t => t.k === "subj" && t.t === "Noyce"), an: () => has(t => t.k === "verb" && t.an),
    exact: () => has(t => t.k === "evid" && t.exact), idea4: () => has(t => t.k === "idea" && t.n >= 4),
    purp4: () => has(t => t.k === "purp" && t.n >= 4)
  };
  const res = WS_CLIMB.need[n].map(([k, msg]) => [TEST[k](), msg, k]);
  /* a sentence, not a heap: dumping every tile in fails */
  const count = k => strip.filter(t => t.k === k).length;
  const extra = [];
  if (count("subj") > 1) extra.push("One subject only. Take one of them out.");
  if (count("verb") > 2) extra.push("Too many verbs. Keep one or two.");
  ["idea","evid","purp"].forEach(k => { if (count(k) > 2) extra.push(`Three ${SHORT[k].toLowerCase()} tiles is a heap, not a sentence. Keep the best one or two.`); });
  const ret = strip.filter(t => retiredAt(t, n));
  ret.forEach(t => extra.push(`“${t.t}” is retired at ${BANDNAME(n)}. ${t.retire}`));
  const pass = res.every(r => r[0]) && !extra.length;
  $("needs").innerHTML = res.map(([ok, msg]) => `<li class="${ok?"y":"n"}">${esc(msg)}</li>`).join("") +
    extra.map(m => `<li class="n">${esc(m)}</li>`).join("");
  $("needs").dataset.checked = n;
  if (S.climb.first[n] === undefined) {
    S.climb.first[n] = pass;
    S.climb.firstMiss[n] = res.filter(r => !r[0]).map(r => r[2]).concat(extra.length ? ["heap or retired"] : []);
  }
  if (pass) {
    S.climb.passed[n] = strip.map(t => t.t).join(" ");
    logEvent("The climb", BANDNAME(n));
    say("climbFb", "good", n < 4 ? `✓ ${BANDNAME(n)}. Now lift the same sentence to ${BANDNAME(n + 1)}.` : "✓ C4. Now write one of your own in 5 · Write.");
  } else say("climbFb", "bad", "Not yet. The crosses say what is missing.");
  save(); drawClimb();
};

/* =========================================================================
   5 · WRITE YOUR OWN, then colour it
   ========================================================================= */
let brush = "idea", painting = false;
function drawWrite(){
  const W = S.write;
  $("wTheme").innerHTML = WS_THEMES.map(t => `<option ${t===W.theme?"selected":""}>${esc(t)}</option>`).join("");
  $("wMoment").innerHTML = WS_MOMENTS.map((m, i) => `<option value="${i}" ${i===+W.moment?"selected":""}>${esc(m)}</option>`).join("");
  $("wBand").innerHTML = WS_BANDS.map(b => `<button data-b="${b}" class="${b===W.band?"on":""}">${b} frame</button>`).join("");
  $("wBand").querySelectorAll("button").forEach(b => b.onclick = () => { W.band = b.dataset.b; save(); drawWrite(); });
  $("wFrame").textContent = WS_FRAMES[W.band];
  if (document.activeElement !== $("wText")) $("wText").value = W.text;
  $("wSaved").textContent = W.savedAt ? "Saved in this browser as you type." : "";
  $("brush").innerHTML = WS_KINDS.map(k => `<button class="btn chip k-${k.key} ${brush===k.key?"on":""}" data-k="${k.key}" style="cursor:pointer">${KIND[k.key].glyph} ${k.short}</button>`).join("") +
    `<button class="btn ${brush==="off"?"on":""}" data-k="off">Rub out</button>`;
  $("brush").querySelectorAll("button").forEach(b => b.onclick = () => { brush = b.dataset.k; drawWrite(); });
  drawMine();
}
function words(){ return S.write.text.split(/(\s+)/); }
function drawMine(){
  const W = S.write; const parts = words(); let wi = 0;
  $("mine").innerHTML = W.text.trim() ? parts.map(p => {
    if (/^\s+$/.test(p) || !p) return esc(p);
    const k = W.marks[wi]; const h = `<span class="w ${k?"on k-"+k:""}" data-w="${wi}">${esc(p)}</span>`; wi++; return h;
  }).join("") : `<span class="small">Write on the left first.</span>`;
  const used = new Set(Object.values(W.marks));
  const missing = WS_KINDS.filter(k => !used.has(k.key)).map(k => KIND[k.key].glyph + " " + k.short);
  if (W.text.trim() && Object.keys(W.marks).length)
    say("wFb", missing.length ? "ok" : "good", (missing.length ? "Not marked yet: " + missing.join(", ") + "." : "All three colours marked.") +
      " This checks that each colour is used, not that it is right. Show your teacher.");
  else say("wFb", "", "");
}
/* paint every word between where the drag started and where the pointer is,
   so a fast drag does not skip words */
let paintFrom = null;
function paint(el){
  if (!el || !el.dataset || el.dataset.w === undefined) return;
  const to = +el.dataset.w; if (paintFrom === null) paintFrom = to;
  const [a, b] = paintFrom < to ? [paintFrom, to] : [to, paintFrom];
  for (let i = a; i <= b; i++) {
    if (brush === "off") delete S.write.marks[i]; else S.write.marks[i] = brush;
    const w = $("mine").querySelector(`.w[data-w="${i}"]`);
    if (w) w.className = "w" + (S.write.marks[i] ? " on k-" + S.write.marks[i] : "");
  }
}
$("mine").addEventListener("pointerdown", e => { painting = true; paintFrom = null; paint(e.target.closest(".w")); });
addEventListener("pointermove", e => { if (painting) paint(document.elementFromPoint(e.clientX, e.clientY)?.closest?.("#mine .w")); });
addEventListener("pointerup", () => { if (painting) { painting = false; save(); drawMine(); drawTabs(); } });
$("wText").addEventListener("input", () => {
  const before = words().filter(w => w.trim()).length;
  S.write.text = $("wText").value; S.write.savedAt = Date.now();
  /* if the number of words changes, the colours no longer line up: clear them */
  if (words().filter(w => w.trim()).length !== before) S.write.marks = {};
  save(); drawMine(); $("wSaved").textContent = "Saved in this browser as you type.";
  if (S.write.text.trim().split(/\s+/).length >= 15) logEvent("Write", S.write.theme);
});
$("wTheme").onchange = () => { S.write.theme = $("wTheme").value; save(); };
$("wMoment").onchange = () => { S.write.moment = +$("wMoment").value; save(); };

/* =========================================================================
   REPORT: one tab-separated row per student, first tries only
   ========================================================================= */
const HEAD = ["Name", "Date", "Minutes on task", "Colour: first tries", "Colour: misses", "Sort: first tries", "Sort: misses",
  "Three ways: weak picks", "Climb: first check", "Climb: highest band passed", "Own theme", "Own moment", "Own words",
  "Own colours used", "Cannot tell you"];
const MISSNAME = { "idea>evid":"theme marked on evidence", "idea>purp":"theme marked on purpose", "evid>idea":"evidence marked on theme",
  "evid>purp":"evidence marked on purpose", "purp>idea":"purpose marked on theme", "purp>evid":"purpose marked on evidence" };
function reportData(){
  let cT = 0, cR = 0;
  for (const [p, r] of Object.entries(S.colour)) for (const v of Object.values(r.first)) { cT++; if (v) cR++; }
  const cm = Object.entries(S.colourMiss).map(([k, n]) => (MISSNAME[k] || (k.split(">")[0] ? SHORT[k.split(">")[0]].toLowerCase() + " on a black part" : k)) + " ×" + n).join("; ");
  const sorted = Object.entries(S.sort).filter(([, r]) => r.first);
  const sR = sorted.filter(([id, r]) => r.first === CARDS.find(c => c.id === id)?.band).length;
  const sm = sorted.filter(([id, r]) => r.first !== CARDS.find(c => c.id === id)?.band).map(([id, r]) => {
    const c = CARDS.find(x => x.id === id); return `${c.set.theme} ${c.band} put in ${r.first}`; }).join("; ");
  const weak = Object.values(S.ways).flatMap(w => w.weak).map(t => "“" + t + "”").join("; ");
  const NEEDNAME = { subj:"subject", verb:"verb", evid:"evidence", ideaOrPurp:"theme or purpose", tech:"technique word",
    idea3:"simple theme", purp3:"audience effect", con:"connective", noyce:"Noyce as subject", an:"analytical verb",
    exact:"exact film term", idea4:"theme as a claim", purp4:"inference about Noyce" };
  const cf = [2,3,4].filter(n => S.climb.first[n] !== undefined).map(n => "C" + n + (S.climb.first[n] ? " ✓" :
    " ✗ (" + S.climb.firstMiss[n].map(k => NEEDNAME[k] || k).join(", ") + ")")).join("; ");
  const top = [4,3,2].find(n => S.climb.passed[n]);
  const used = [...new Set(Object.values(S.write.marks))].map(k => SHORT[k]).join(", ");
  return ["", today(), Math.round(S.secs / 60), cT ? `${cR}/${cT}` : "", cm, sorted.length ? `${sR}/${sorted.length}` : "", sm,
    weak, cf, top ? "C" + top : "", S.write.text.trim() ? S.write.theme : "", S.write.text.trim() ? WS_MOMENTS[S.write.moment] : "",
    S.write.text.trim(), used, "Whether the student’s own colours and sentence are accurate: read the words."];
}
function drawReport(){
  const d = reportData();
  $("tsv").value = d.map(v => String(v).replace(/[\t\r\n]+/g, " ")).join("\t");
  $("repTable").innerHTML = HEAD.slice(1).map((h, i) => `<tr><th>${esc(h)}</th><td>${esc(d[i + 1]) || '<span class="small">nothing yet</span>'}</td></tr>`).join("");
}
function copy(text){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => $("copied").textContent = "Copied. Paste it into the class sheet.",
    () => { $("tsv").select(); document.execCommand("copy"); $("copied").textContent = "Copied."; });
}
$("copyRow").onclick = () => { drawReport(); copy($("tsv").value); };
$("copyHead").onclick = () => copy(HEAD.join("\t"));

/* ---- start ---- */
if (!location.hash) history.replaceState(null, "", "#colour");
drawColour(); drawSort(); drawWays(); drawClimb(); drawWrite(); drawTabs();
</script>
</body>
