<!DOCTYPE html>
<html lang="en-AU">
<head>

<title>Of Mice and Men — Reading &amp; Writing Hub</title>
<style>
/* ============================================================
   ELC · Of Mice and Men hub
   Matches the ELC-Pages house style: CSS variables, light/dark
   via prefers-color-scheme, mobile-first, sized for the 1366×768
   ThinkPads the students actually use. No CDNs, no web fonts,
   no build step — one self-contained file, per ELC-Pages/AGENTS.md.

   The accent is dry-grass ochre: the Salinas valley in the last
   hot days before the harvest.
   ============================================================ */
:root{
  --bg:#f7f4ec; --paper:#fffdf8; --ink:#241f18; --muted:#6b6153; --faint:#8b8172;
  --line:#e3ddd0; --line-soft:#efeae0; --accent:#8a5a1e; --accent-soft:#f7f0e3;
  --correct:#2c6b45; --wrong:#a33a34; --okbg:#eaf4ee; --badbg:#faecea;
  --warnbg:#fdf3e3; --warntx:#835311; --on-accent:#ffffff;
  /* builder tile roles — colour is metalanguage, never decoration */
  --p-bg:#e3e9d8;  --p-tx:#4a5a2c;   /* Point     */
  --e-bg:#fdf0c4;  --e-tx:#7a5a05;   /* Evidence  */
  --x-bg:#e6f0e2;  --x-tx:#3c6030;   /* Explain   */
  --l-bg:#f6e5ee;  --l-tx:#8c3560;   /* Link      */
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16130f; --paper:#201c17; --ink:#f2eee6; --muted:#b3a996; --faint:#978d7c;
    --line:#3a332a; --line-soft:#2b261f; --accent:#d9a75f; --accent-soft:#2a2318;
    --correct:#79c295; --wrong:#e08a82; --okbg:#18291f; --badbg:#2c1d1c;
    --warnbg:#2b2417; --warntx:#e6bd77; --on-accent:#11151d;
    --p-bg:#2c3320; --p-tx:#bcca9c; --e-bg:#3a3218; --e-tx:#e3c877;
    --x-bg:#233020; --x-tx:#a8cd9a; --l-bg:#33203a; --l-tx:#e3a3c6;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
     line-height:1.55;display:flex;justify-content:center;padding:14px 10px 48px}
.container{width:100%;max-width:920px;background:var(--paper);border:1px solid var(--line);
           border-radius:14px;padding:22px 24px 26px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}
h1{font-size:25px;margin:0 0 4px;letter-spacing:-.2px}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.topbar .where{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 2px;font-family:inherit}
.linkbtn:hover{text-decoration:underline}
a{color:var(--accent)}
.btn{padding:10px 17px;border:1px solid var(--line);border-radius:9px;font-size:14.5px;font-weight:600;
     cursor:pointer;background:var(--paper);color:var(--ink);font-family:inherit}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-ghost{background:var(--bg);color:var(--muted)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:0 0 12px}
p.lead{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.hr{height:1px;background:var(--line);margin:18px 0 14px;border:0}

/* ---- home ---- */
.step{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--paper);
      border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:8px;cursor:pointer;
      font-family:inherit;font-size:14.5px;color:inherit}
.step:hover{border-color:var(--accent)}
.step .num{flex:0 0 29px;height:29px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px}
.step.done .num{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
.step .t{font-weight:700}
.step .d{color:var(--muted);font-size:12.5px}
.step .tag{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
           color:var(--muted);white-space:nowrap;text-align:right}
.step.done .tag{color:var(--correct)}
@media (min-width:900px){ .steps2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} }

/* ---- stimulus / passages ---- */
.stim{font-family:Georgia,serif;font-size:16.5px;background:var(--bg);border:1px solid var(--line);
      border-left:4px solid var(--accent);border-radius:9px;padding:13px 15px;margin:0 0 12px}
.stim .pg{display:block;margin-top:6px;font-family:system-ui,sans-serif;font-size:11px;color:var(--faint)}
.passage{font-family:Georgia,serif;font-size:16.5px;line-height:1.78;background:var(--bg);border:1px solid var(--line);
         border-radius:10px;padding:15px 17px;margin:0 0 12px}
.passage .pg{display:block;margin-top:9px;font-family:system-ui,sans-serif;font-size:11.5px;color:var(--faint);line-height:1.5}
/* dialogue-heavy passages read better with a touch more line height */
.report{line-height:1.85}
.q{font-size:15.5px;font-weight:700;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.opts.chips{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
     font-family:inherit;font-size:14.5px;cursor:pointer;color:inherit;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--correct)}
.opt.wrongpick{background:var(--badbg);border-color:var(--wrong)}
.feedback{display:none;border-radius:9px;padding:11px 13px;font-size:13.8px;margin:0 0 12px;line-height:1.55}
.feedback.ok{display:block;background:var(--okbg);color:var(--correct)}
.feedback.bad{display:block;background:var(--badbg);color:var(--wrong)}
.feedback.warn{display:block;background:var(--warnbg);color:var(--warntx)}
.feedback ul{margin:6px 0 0 18px;padding:0}
.feedback li{margin:0 0 5px}
.feedback b{color:inherit}
.requote{font-family:Georgia,serif;background:var(--paper);border:1px solid var(--line);border-radius:6px;
         padding:8px 10px;margin-top:8px;color:var(--ink);font-size:14.5px}
.progress-track{height:7px;background:var(--line-soft);border-radius:99px;margin:0 0 15px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}

/* ---- speaker ---- */
.say{border:0;background:transparent;cursor:pointer;padding:0;margin:0 0 0 6px;display:inline-flex;
     align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;border-radius:8px;
     color:var(--muted);vertical-align:middle;flex:0 0 auto}
.say svg{width:15px;height:15px;fill:currentColor;pointer-events:none}
.say:hover{color:var(--accent);background:var(--accent-soft)}
.say.lg svg{width:19px;height:19px}

/* ---- vocab builder ---- */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tile{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:14px;cursor:pointer;
      font-family:inherit;background:var(--paper);color:inherit;text-align:left;min-height:44px}
.tile:hover{border-color:var(--accent)}
.tile.used{opacity:.35;pointer-events:none}
.tile small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.assembly{min-height:52px;border:2px dashed var(--line);border-radius:10px;background:var(--bg);
          padding:8px 10px;margin:0 0 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.assembly .ph{color:var(--faint);font-size:13px}
.assembly .placed{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);
                  border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer;font-weight:600}
.assembly .placed:after{content:" ✕";font-size:10px;opacity:.7}
.wordline{font-family:Georgia,serif;font-size:20px;font-weight:600;margin:0 0 2px}
.pos{color:var(--faint);font-size:12px;font-style:italic}
.gapline{font-family:Georgia,serif;font-size:16.5px;line-height:1.8;background:var(--bg);border:1px solid var(--line);
         border-radius:9px;padding:13px 15px;margin:0 0 12px}
.gapline .blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--accent);text-align:center;
                font-weight:700;color:var(--accent)}

/* ---- dictation ---- */
.dictbox{display:flex;flex-direction:column;gap:9px;margin:0 0 12px}
.dictbox textarea{width:100%;min-height:74px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
                  font-size:16px;font-family:Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.6}
.marked{font-family:Georgia,serif;font-size:16.5px;line-height:1.9;background:var(--bg);border:1px solid var(--line);
        border-radius:9px;padding:13px 15px;margin:0 0 12px}
.marked .w-ok{color:var(--correct)}
.marked .w-no{background:var(--badbg);color:var(--wrong);border-radius:4px;padding:0 3px;text-decoration:line-through}
.marked .w-add{background:var(--okbg);color:var(--correct);border-radius:4px;padding:0 3px}
.speedrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* ---- evidence ---- */
.seg{cursor:pointer;border-radius:4px;padding:1px 2px;border-bottom:2px solid transparent}
.seg:hover{background:var(--line-soft)}
.seg.picked{background:var(--accent-soft);border-bottom-color:var(--accent)}
.seg.hit{background:var(--okbg);border-bottom-color:var(--correct)}
.seg.miss{background:var(--badbg);border-bottom-color:var(--wrong)}
.idea-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.fchoice{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:9px 15px;font-family:inherit;
         font-size:13.5px;font-weight:600;cursor:pointer;color:inherit;min-height:44px}
.fchoice.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 13px}
.lcard{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--paper);font-size:12px;
       line-height:1.4;cursor:pointer;font-family:inherit;text-align:left;color:inherit}
.lcard .lv{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:3px}
.lcard.now{border:2px solid var(--accent)}
.lcard.got{background:var(--okbg);border-color:var(--correct)}
.lcard.got .lv{color:var(--correct)}
.ladder-hint{display:none;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:9px;
             padding:10px 12px;font-size:13px;margin:0 0 12px}
.ladder-hint.show{display:block}
@media (max-width:700px){.ladder{grid-template-columns:repeat(2,1fr)}}

/* ---- PEEL builder ---- */
.slotrow{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.slot{border:2px dashed var(--line);border-radius:10px;min-height:48px;padding:8px 10px;background:var(--paper);
      display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .slabel{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);flex:0 0 80px}
.slot .placed{border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer;border:1px solid transparent;font-family:inherit}
.slot .placed:after{content:" ✕";font-size:10px;opacity:.6}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0 0 12px}
@media (max-width:900px){.bins{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.bins{grid-template-columns:1fr}}
.bin{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.bin h4{margin:0;padding:7px 10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line-soft)}
.bin .binbody{padding:8px;display:flex;flex-direction:column;gap:6px;max-height:250px;overflow-y:auto}
.btile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;text-align:left;
       cursor:pointer;font-family:inherit;background:var(--paper);color:inherit;line-height:1.45}
.btile:hover{border-color:var(--accent)}
.bin.b-p h4,.placed.k-p,.btile.k-p{background:var(--p-bg);color:var(--p-tx)}
.bin.b-e h4,.placed.k-e,.btile.k-e{background:var(--e-bg);color:var(--e-tx)}
.bin.b-x h4,.placed.k-x,.btile.k-x{background:var(--x-bg);color:var(--x-tx)}
.bin.b-l h4,.placed.k-l,.btile.k-l{background:var(--l-bg);color:var(--l-tx)}
.preview{font-family:Georgia,serif;font-size:16.5px;line-height:1.7;background:var(--bg);border:1px solid var(--line);
         border-radius:9px;padding:13px 15px;margin:0 0 12px;min-height:56px}
.preview .ph{color:var(--faint);font-size:13px;font-family:system-ui,sans-serif}
.wagoll{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--correct);
        border-radius:9px;padding:13px 15px;margin:0 0 12px;font-family:Georgia,serif;font-size:15.5px;line-height:1.75}
.wagoll .tagp{font-family:system-ui,sans-serif;font-size:9.5px;font-weight:800;text-transform:uppercase;
              letter-spacing:.4px;border-radius:4px;padding:1px 5px;margin-right:4px;vertical-align:2px}
.wagoll .t-p{background:var(--p-bg);color:var(--p-tx)}
.wagoll .t-e{background:var(--e-bg);color:var(--e-tx)}
.wagoll .t-x{background:var(--x-bg);color:var(--x-tx)}
.wagoll .t-l{background:var(--l-bg);color:var(--l-tx)}

/* ---- report ---- */
table.rpt{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 12px}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.rpt th{background:var(--bg);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.rowinp{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.rowinp label{font-size:12px;font-weight:700;display:block;margin-bottom:3px}
.rowinp input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;
              font-family:inherit;background:var(--paper);color:var(--ink)}
.vcode{font-family:Georgia,serif;font-size:15px;letter-spacing:1px}
.foot{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;padding:0}
  .container{border:none;max-width:100%;padding:0}
  .noprint{display:none!important}
}
</style>

<script>
/* ============================================================================
   OF MICE AND MEN — READING & WRITING HUB
   ----------------------------------------------------------------------------
   John Steinbeck, "Of Mice and Men" (novella, 1937).

   COPYRIGHT NOTE — this site is public and live.
   The novella is in copyright. This file therefore contains NO reproduced
   extract. Where a real phrase is quoted it is short — a few words inside
   original analytical commentary, the same use any published book review
   makes. Every longer passage is ORIGINAL writing composed for this activity
   in the manner of the novella, and is labelled as such on screen.
   Do not paste chapters, scans or the novella's text into this file.

   ----------------------------------------------------------------------------
   This block is the data spine. The engine below knows nothing about the
   novella; it only runs whatever is in these consts. To add content, copy an
   entry and follow its shape. Every item needs an `id` and an `explain` that
   names the trap and points the reader back to the words.

   Scoring: wrong answers are retried until correct (mastery loop), but only
   the FIRST attempt is scored and reported.
   ============================================================================ */

const TEXT = {
  title:"Of Mice and Men",
  author:"John Steinbeck",
  form:"novella, 1937",
  blurb:"George and Lennie walk from ranch to ranch in Depression-era California, carrying their bedrolls and one plan: to buy a small farm and live on it.",
  hook:"Almost nobody in this book has anybody. George and Lennie are the exception, and the whole novella asks how long two people like that can hold on to each other in a world built to keep men alone."
};

/* Every remaining story-specific string the engine prints. Kept here so the
   engine below is genuinely shared with the other ELC text-study hubs — a new
   text needs a new data spine and nothing else. */
const COPY = {
  key:"elc.miceandmen.hub.v1",
  nav:"ELC English · novel study 2 · Of Mice and Men",
  vocabDone:"These fourteen words are the ones the novella leans on. You now know their pieces, which means you can also read words you have never met that share them — every <i>-ation</i> noun, every <i>-able</i> adjective, every word built on <i>pend</i> or <i>spir</i>.",
  dictDone:"Dictation trains the join between hearing a word and spelling it. Steinbeck spells his characters' speech the way it sounds, so hearing before writing is exactly the skill this book asks of you.",
  qr1Done:"Next quickread: Candy and his dog. Read it knowing what you now know about George and Lennie — Steinbeck wrote the two scenes to be read against each other.",
  qr2Done:"You have now read the novella's two central pairs. The Voice fingerprint activity turns what you noticed into something you can name and point at.",
  extension:"draft a PEEL paragraph on an idea the hub does not cover, such as why Curley's wife is never given a name",
  labels:{ qr1:"Quickread: the bunkhouse", qr2:"Quickread: Candy's dog" },
  recommend:{
    qr1:"Reread with a pencil and mark every place George says something unkind and does something kind. The gap between the two is the character.",
    qr2:"Reread the Candy scene and underline what nobody says out loud. Steinbeck builds pressure through silence and repetition, not argument.",
    voice:"Before you write in character, list the fingerprints: sentence length, whether the speaker repeats himself, whether he asks or tells, and what he never mentions.",
    fig:"Revisit the difference between symbol, motif and foreshadowing, then track the hands through the novella and find one more example of each."
  }
};

/* ==================== 1 · VOCABULARY PRETEACH ==============================
   The program's standing routine, digitised: morpheme matrices. Every student
   meets all fourteen words, but each word arrives as ONE task — assemble it
   from its morphemes, match its meaning, or complete a sentence. The deal is
   stored, so a refresh cannot reroll a hard word into an easy one.
   =========================================================================== */
const VOCAB = [
{ w:"migrant", pos:"noun / adjective",
  meaning:"A person who moves from place to place to find work.",
  tiles:[["migr","move / travel"],["-ant","one who"]],
  decoys:[["im-","into"],["-ate","to make"]],
  note:"Latin <i>migrare</i>, to move. Add the decoy and you get a different word: an <b>im</b>migrant moves INTO a country, an <b>e</b>migrant moves OUT of one, and a migrant just keeps moving. George and Lennie are the third kind.",
  gap:["George and Lennie are", "workers, walking from one ranch to the next."] },
{ w:"itinerant", pos:"adjective",
  meaning:"Travelling from place to place, especially for work.",
  tiles:[["itiner","journey"],["-ant","one who"]],
  decoys:[["intern","inside"],["-ary","relating to"]],
  note:"Same root as <i>itinerary</i> — a plan of a journey. Careful with the decoy: <b>intern</b> looks similar and means the opposite, staying inside one place.",
  gap:["The bunkhouse is full of", "men who never stay long enough to make a friend."] },
{ w:"isolation", pos:"noun",
  meaning:"The state of being alone and separated from others.",
  tiles:[["isol","alone"],["-ation","act or process"]],
  decoys:[["in-","not"],["-ify","to make"]],
  note:"From Latin <i>insula</i>, island — to isolate someone is to make an island of them. Ask it of every character: Candy, Crooks, Curley's wife. Each is an island for a different reason.",
  gap:["Crooks lives in a room off the barn, and his", "is enforced by other people."] },
{ w:"companionship", pos:"noun",
  meaning:"The comfort of having someone with you.",
  tiles:[["com-","together"],["pan","bread"],["-ion","state of"],["-ship","state / condition"]],
  decoys:[["contra-","against"],["-ment","result of"]],
  note:"A companion is literally someone you break <b>bread</b> with — same <b>pan</b> as pantry. Four morphemes, and the middle one is the surprise. This word is the novella's subject.",
  gap:["What George gives Lennie, and what nobody else on the ranch has, is", "."] },
{ w:"predatory", pos:"adjective",
  meaning:"Behaving like a hunter — taking advantage of weaker people.",
  tiles:[["pred","prey / plunder"],["-atory","relating to"]],
  decoys:[["pre-","before"],["-ence","state of"]],
  note:"A trap worth knowing: <b>pred</b> is not <b>pre</b>. A predator hunts; a prediction comes before. Same <b>pred</b> as predator and depredation.",
  gap:["Curley picks fights with big men, which is", "rather than brave."] },
{ w:"contemptuous", pos:"adjective",
  meaning:"Showing that you think someone is worthless.",

      { t:"I am going to write about Curley's wife in this paragraph.", q:"meta",
        fb:"No announcements. Make the claim." },
      { t:"Curley's wife says she “can't talk to nobody but Curley” which shows she is lonely.", q:"early",
        fb:"The quotation belongs in Evidence, and the Point should name the technique, not just the feeling." }],
   e:[{ t:"Every other figure on the ranch is named — Candy, Crooks, Slim, even the dog — while she is defined only by possession, and her one plain admission is that she “can't talk to nobody but Curley”.", q:"good", fb:"" },
      { t:"She says she “can't talk to nobody but Curley”.", q:"thin",
        fb:"Good quotation, but this paragraph is about the missing name — you have to prove the absence by showing what is present." },
      { t:"“I get lonely. You can talk to people, but I can't talk to nobody but Curley. Else he gets mad.”", q:"long",
        fb:"Three sentences, and none of them evidence the missing name. Trim, and add the proof of the absence." },
      { t:"She is only ever called Curley's wife by everybody in the book.", q:"noquote",
        fb:"True and relevant, but there is no quotation. Evidence needs the author's words." }],
   x:[{ t:"Because the omission sits in the narration and not merely in the dialogue, the reader cannot dismiss it as the men's prejudice alone, and is made complicit in seeing her as they do.", q:"good", fb:"" },
      { t:"This shows that the men on the ranch do not respect her.", q:"thin",
        fb:"True but thin, and it misses the sharpest point: it is not only the men. Who else refuses her a name?" },
      { t:"This quote shows that Steinbeck was writing in the 1930s when attitudes were different.", q:"meta",
        fb:"Historical context is not analysis of the words, and it explains the choice away rather than examining it." },
      { t:"She later comes into the barn and talks to Lennie about her life.", q:"retell",
        fb:"Plot. Stay on the words you quoted." }],
   l:[{ t:"Her loneliness is therefore the same loneliness the novella grants its men, withheld from her by a single missing word.", q:"good", fb:"" },
      { t:"That is why Steinbeck never gives Curley's wife a name.", q:"repeat",
        fb:"That is the Point restated. A Link goes somewhere new." },
      { t:"In conclusion, Curley's wife is an interesting character.", q:"thin",
        fb:"'Interesting' names nothing at all." },
      { t:"Curley wears a glove full of vaseline on one hand.", q:"retell",
        fb:"A new detail with no claim attached. Save it for a paragraph about Curley." }] } }
];

/* ==================== MODULE DIRECTORY ======================================
   Nothing is ever locked (ELC-Pages house rule: teachers jump around, and a
   student who wants the writing module first should get it). Order is a
   suggestion, shown by the numbers.
   =========================================================================== */
const MODULES = [
 { id:"vocab", n:1, t:"Vocabulary preteach", d:"14 unit words, built from their morphemes — before you read", kind:"vocab" },
 { id:"dict",  n:2, t:"Dictation warm-up",   d:"Hear the sentence, type it, get it marked word by word", kind:"dict" },
 { id:"qr1",   n:3, t:"Quickread: the bunkhouse", d:"Read it, lose it, prove you understood it", kind:"qr" },
 { id:"qr2",   n:4, t:"Quickread: Candy's dog", d:"Inference under pressure — what nobody says out loud", kind:"qr" },
 { id:"fig",   n:5, t:"Figurative → literal", d:"Say what it means, then name the technique doing the work", kind:"fig" },
 { id:"voice", n:6, t:"Voice fingerprint",    d:"Whose line is it? Name the giveaway in the grammar", kind:"voice" },
 { id:"ev",    n:7, t:"Evidence builder",     d:"Find it, explain it, embed it — the rubric ladder", kind:"ev" },
 { id:"peel",  n:8, t:"PEEL paragraph builder", d:"An annotated model, then build your own — for the essay", kind:"peel" },

/* ============================================================================
   ENGINE — knows nothing about the story. State, router, runners, report.
   Shared shape with the other ELC text-study hubs: change the data above and
   this all still works.
   ============================================================================ */
const KEY=COPY.key;
function blank(){ return {first:{}, done:{}, evLv:0, deal:{}, name:"", sid:"", startedAt:Date.now()}; }
let S=blank();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); if(p&&typeof p==="object") S=Object.assign(blank(),p);} }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function resetAll(){ if(confirm("Start again from scratch? This wipes all your saved answers on this device.")){ S=blank(); save(); go("home"); } }
load();

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function recFirst(key, correct){ if(S.first[key]===undefined){ S.first[key]=!!correct; save(); } }

/* ---------- read aloud (the browser's own engine; absent = no buttons) ---------- */
const SPEAK = {
  can(){ return typeof window!=="undefined" && "speechSynthesis" in window; },
  say(text, rate){
    if(!this.can()||!text) return;
    const synth=window.speechSynthesis; synth.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang="en-AU"; u.rate=rate||0.9;
    const vs=synth.getVoices()||[];
    const v=vs.find(x=>x.lang&&x.lang.toLowerCase()==="en-au")||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith("en"));
    if(v) u.voice=v;
    try{ synth.speak(u); }catch(e){}
  },
  icon:"<svg viewBox='0 0 16 16' aria-hidden='true' focusable='false'>"+
    "<path d='M7.2 2.6 4.1 5.1H2.2a.7.7 0 0 0-.7.7v4.4c0 .4.3.7.7.7h1.9l3.1 2.5c.45.36 1.1.05 1.1-.53V3.13c0-.58-.65-.89-1.1-.53z'/>"+
    "<path d='M10.9 5.2a.62.62 0 0 0-.15.87c.38.53.6 1.2.6 1.93s-.22 1.4-.6 1.93a.62.62 0 1 0 1.02.72A4.6 4.6 0 0 0 12.6 8a4.6 4.6 0 0 0-.83-2.65.62.62 0 0 0-.87-.15z'/></svg>",
  btn(text, cls){
    if(!this.can()||!text) return "";
    return "<button type='button' class='say"+(cls?" "+cls:"")+"' data-say=\""+esc(text)+"\" "+
      "aria-label=\"Listen: "+esc(text).slice(0,60)+"\" title=\"Listen\">"+this.icon+"</button>";
  }
};
document.addEventListener("click",function(e){
  const b=e.target&&e.target.closest&&e.target.closest(".say");
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  SPEAK.say(b.getAttribute("data-say"));
},true);

let screen="home";
function go(s, arg){
  screen=s;
  $("homeBtn").style.display = s==="home" ? "none" : "inline";
  window.scrollTo({top:0,behavior:"smooth"});
  if(s==="home") renderHome();
  else if(s==="vocab") runVocab();
  else if(s==="dict") runDict();
  else if(s==="qr") renderQrIntro(arg||"qr1");
  else if(s==="qr1"||s==="qr2") renderQrIntro(s);
  else if(s==="fig") runFig();
  else if(s==="voice") runVoice();
  else if(s==="ev") renderEv(0);
  else if(s==="peel") runPeel();
  else if(s==="rpt") renderReport();
}

/* ---------- scoring ---------- */
function keysFor(mod){ return Object.keys(S.first).filter(k=>k.split(".")[0]===mod); }
function scoreFor(mod){ const ks=keysFor(mod); return {got:ks.filter(k=>S.first[k]).length, total:ks.length}; }
function plannedTotal(mod){
  if(mod==="vocab") return VOCAB.length;
  if(mod==="dict")  return DICTATION.length;
  if(mod==="qr1")   return QUICKREADS[0].items.length;
  if(mod==="qr2")   return QUICKREADS[1].items.length;
  if(mod==="fig")   return FIG_ITEMS.length*2;
  if(mod==="voice") return VOICE_ITEMS.length*2;
  if(mod==="ev")    return 6;
  if(mod==="peel")  return PEEL_ITEMS.length*4;
  return 0;
}

/* ---------- HOME ---------- */
function renderHome(){
  let h=`<h1>${esc(TEXT.title)}</h1>
  <p class="sub">${esc(TEXT.author)} · ${esc(TEXT.form)} · ELC English, novel study 1 ${SPEAK.btn(TEXT.title+" by "+TEXT.author)}</p>
  <div class="panel"><p class="lead" style="margin:0 0 6px">${esc(TEXT.blurb)}</p>
  <p style="margin:0;font-size:13.5px"><b>The one thing to know before you start:</b> ${esc(TEXT.hook)}</p></div>
  <p class="lead">Nine activities. Work top to bottom if you like — but nothing is locked, so start
  wherever your class is. Wrong answers are retried until you get them right;
  <b>only your first attempt counts on the report</b>.</p>
  <div class="steps2">`;
  MODULES.forEach(m=>{
    const done=!!S.done[m.id], sc=scoreFor(m.id), planned=plannedTotal(m.id);
    let tag = m.id==="rpt" ? "" :
      done ? `${sc.got}/${sc.total} first try` :
      sc.total ? `${sc.total}/${planned} done` : "";
    h+=`<button class="step ${done?"done":""}" onclick="go('${m.kind}','${m.id}')">
      <span class="num">${done?"✓":m.n}</span>
      <span><span class="t">${esc(m.t)}</span><br><span class="d">${esc(m.d)}</span></span>
      <span class="tag">${esc(tag)}</span></button>`;
  });
  h+=`</div><div class="btnrow noprint"><button class="linkbtn" onclick="resetAll()">reset everything on this device</button></div>`;
  $("body").innerHTML=h;
}
const _go=go;
go=function(s,arg){ if(s==="qr"&&!arg) arg="qr1"; if(s==="qr1"||s==="qr2"){ arg=s; s="qr"; } _go(s,arg); };

/* ---------- GENERIC QUIZ RUNNER ----------
   cfg: {mod, title, where, items:[{id, stim?, page?, steps:[{key,q,opts,a,explain,requote?}]}]}
   Mastery loop: a missed item is re-queued; first attempts are recorded once. */
function runQuizzer(cfg){
  let queue=cfg.items.slice(), idx=0, stepIdx=0, round=1;
  function draw(){
    const item=queue[idx], step=item.steps[stepIdx];
    const total=cfg.items.reduce((n,it)=>n+it.steps.length,0);
    const answered=keysFor(cfg.mod).length;
    let h=`<div class="eyebrow">${esc(cfg.where)}</div><h2>${esc(cfg.title)}</h2>`;
    h+=`<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,answered/total*100)}%"></div></div>`;
    if(round>1) h+=`<p class="lead">Mastery round ${round} — the ones you missed come back until they are right. Your first attempts are already saved.</p>`;
    if(item.stim) h+=`<div class="stim">${item.stim}${SPEAK.btn(item.sayText||item.stimPlain||"")}${item.page?`<span class="pg">${esc(item.page)}</span>`:""}</div>`;
    h+=`<p class="q">${esc(step.q)}</p><div class="opts ${step.chips?"chips":""}" id="opts"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <button class="btn btn-primary" id="nextBtn" style="display:none"></button>`;
    $("body").innerHTML=h;
    const order = step.noShuffle ? step.opts.map((_,i)=>i) : shuffle(step.opts.map((_,i)=>i));
    order.forEach(oi=>{
      const b=document.createElement("button");
      b.className="opt"; b.textContent=step.opts[oi];
      b.onclick=()=>grade(oi,b);
      $("opts").appendChild(b);
    });
  }
  function grade(oi,btn){
    const item=queue[idx], step=item.steps[stepIdx];
    const correct = oi===step.a;
    document.querySelectorAll("#opts .opt").forEach(b=>{ b.disabled=true;
      if(b.textContent===step.opts[step.a]) b.classList.add("right"); });
    if(!correct) btn.classList.add("wrongpick");
    recFirst(cfg.mod+"."+item.id+"."+step.key, correct);
    const fb=$("fb");
    fb.className="feedback "+(correct?"ok":"bad");
    fb.innerHTML=(correct?"<b>Correct.</b> ":`<b>Not quite — the answer is “${esc(step.opts[step.a])}”.</b> `)+step.explain
      +(!correct&&step.requote?`<div class="requote">“${esc(step.requote)}”${SPEAK.btn(step.requote)}</div>`:"");
    if(!correct) item._requeue=true;
    const nb=$("nextBtn");
    nb.style.display="inline-block";
    nb.textContent = stepIdx<item.steps.length-1 ? "Next part →" : "Next →";
    nb.onclick=()=>{
      if(stepIdx<item.steps.length-1){ stepIdx++; draw(); return; }
      if(item._requeue){ delete item._requeue; queue.push(item); }
      stepIdx=0; idx++;
      if(idx>=queue.length){ finish(); }
      else { if(idx>=cfg.items.length) round=Math.max(round,2); draw(); }
    };
  }
  function finish(){
    S.done[cfg.mod]=true; save();
    const sc=scoreFor(cfg.mod), pct=sc.total? sc.got/sc.total : 0;
    const band = pct>=0.8 ? "Strong reading. Every miss was retaught and retried — the report shows your first-try picture."
      : pct>=0.6 ? "A good start — here is how to lift it: reread the lines quoted in the feedback, then say out loud WHY the right answer was right."
      : "Worth a slower second pass. Reread the passage, then come back — the re-quoted lines in the feedback are your map.";
    $("body").innerHTML=`<h2>${esc(cfg.title)} — done</h2>
    <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} on first attempt.</b> ${band}</p></div>
    ${cfg.doneNote?`<div class="panel"><p class="lead" style="margin:0">${cfg.doneNote}</p></div>`:""}
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  }
  draw();
}

/* ---------- 1 · VOCABULARY ----------
   Each word gets ONE task, dealt once and remembered, so a refresh cannot
   reroll a build into an easier gap-fill. */
function dealVocab(){
  const kinds=["build","mcq","gap"];
  VOCAB.forEach((v,i)=>{ if(!S.deal[v.w]) S.deal[v.w]=kinds[(i+Math.floor(Math.random()*3))%3]; });
  save();
}
function runVocab(){
  dealVocab();
  let queue=VOCAB.slice(), idx=0, round=1;
  function draw(){
    if(idx>=queue.length){ finish(); return; }
    const v=queue[idx], kind=S.deal[v.w];
    const answered=keysFor("vocab").length;
    let h=`<div class="eyebrow">Before you read · morpheme matrices</div>
    <h2>Vocabulary preteach <span style="font-weight:400;color:var(--muted);font-size:14px">(${idx+1}/${queue.length})</span></h2>
    <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,answered/VOCAB.length*100)}%"></div></div>`;
    if(round>1) h+=`<p class="lead">Mastery round ${round} — the words you missed come back until they are right.</p>`;
    if(kind==="build") h+=drawBuild(v);
    else if(kind==="mcq") h+=drawMcq(v);
    else h+=drawGap(v);
    h+=`<div class="feedback" id="fb" aria-live="polite"></div><div class="btnrow" id="brow"></div>`;
    $("body").innerHTML=h;
    if(kind==="build") wireBuild(v);
    else wireOpts(v,kind);
  }
  /* --- assemble the word from its morphemes --- */
  let picked=[];
  function drawBuild(v){
    picked=[];
    return `<p class="q">Build the word that means: <span style="font-weight:400">${esc(v.meaning)}</span> ${SPEAK.btn(v.meaning)}</p>
    <p class="lead">Tap the pieces in order. Two of them do not belong to this word.</p>
    <div class="assembly" id="asm"><span class="ph">Your word appears here.</span></div>
    <div class="tiles" id="tiles"></div>`;
  }
  function wireBuild(v){
    const all=shuffle(v.tiles.concat(v.decoys));
    const tl=$("tiles");
    all.forEach((t,i)=>{
      const b=document.createElement("button");
      b.className="tile"; b.dataset.i=i;
      b.innerHTML=`<b>${esc(t[0])}</b><small>${esc(t[1])}</small>`;
      b.onclick=()=>{ picked.push({i,t}); b.classList.add("used"); paintAsm(v); };
      tl.appendChild(b);
    });
    $("brow").innerHTML=`<button class="btn btn-primary" onclick="window._vcheck()">Check</button>
      <button class="btn btn-ghost" onclick="window._vreset()">Clear</button>`;
    window._vreset=()=>{ picked=[]; document.querySelectorAll("#tiles .tile").forEach(x=>x.classList.remove("used")); paintAsm(v); $("fb").className="feedback"; };
    window._vcheck=()=>{
      const want=v.tiles.map(t=>t[0]).join("|");
      const got=picked.map(p=>p.t[0]).join("|");
      const ok = want===got;
      recFirst("vocab."+v.w, ok);
      const fb=$("fb");
      if(ok){
        fb.className="feedback ok";
        fb.innerHTML=`<b>Correct — ${esc(v.w)}.</b> ${v.note}`;
        $("brow").innerHTML=`<button class="btn btn-primary" onclick="window._vnext()">Next word →</button>`;
      } else {
        v._requeue=true;
        const extra = picked.some(p=>v.decoys.some(d=>d[0]===p.t[0]))
          ? "One of your pieces is a decoy — it is a real morpheme, but not one of <i>this</i> word's."
          : "Right pieces, wrong order — a word is built prefix → root → suffix.";
        fb.className="feedback bad";
        fb.innerHTML=`<b>Not yet.</b> ${extra} Clear it and try again.`;
      }
    };
    paintAsm(v);
  }
  function paintAsm(v){
    const asm=$("asm"); if(!asm) return;
    if(!picked.length){ asm.innerHTML=`<span class="ph">Your word appears here.</span>`; return; }
    asm.innerHTML="";
    picked.forEach((p,k)=>{
      const b=document.createElement("button"); b.className="placed"; b.textContent=p.t[0];
      b.onclick=()=>{ picked.splice(k,1);
        const tile=document.querySelector('#tiles .tile[data-i="'+p.i+'"]'); if(tile) tile.classList.remove("used");
        paintAsm(v); };
      asm.appendChild(b);
    });
  }
  /* --- meaning → word, and sentence gap --- */
  function drawMcq(v){
    return `<p class="q">Which word means: <span style="font-weight:400">${esc(v.meaning)}</span> ${SPEAK.btn(v.meaning)}</p>
    <div class="opts" id="opts"></div>`;
  }
  function drawGap(v){
    return `<p class="q">Complete the sentence with the right word:</p>
    <div class="gapline">${esc(v.gap[0])} <span class="blank">?</span> ${esc(v.gap[1])}</div>
    <div class="opts" id="opts"></div>`;
  }
  function wireOpts(v,kind){
    const others=shuffle(VOCAB.filter(x=>x.w!==v.w)).slice(0,3).map(x=>x.w);
    const opts=shuffle(others.concat([v.w]));
    opts.forEach(w=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=w;
      b.onclick=()=>{
        const ok = w===v.w;
        recFirst("vocab."+v.w, ok);
        document.querySelectorAll("#opts .opt").forEach(x=>{ x.disabled=true;
          if(x.textContent===v.w) x.classList.add("right"); });
        if(!ok) b.classList.add("wrongpick");
        const fb=$("fb");
        fb.className="feedback "+(ok?"ok":"bad");
        fb.innerHTML=(ok?`<b>Correct — ${esc(v.w)}.</b> `:`<b>Not quite — the word is ${esc(v.w)}.</b> `)
          +`<div class="requote">${v.tiles.map(t=>"<b>"+esc(t[0])+"</b> "+esc(t[1])).join(" + ")}</div>${v.note}`;
        if(!ok) v._requeue=true;
        $("brow").innerHTML=`<button class="btn btn-primary" onclick="window._vnext()">Next word →</button>`;
      };
      $("opts").appendChild(b);
    });
    $("brow").innerHTML="";
  }
  window._vnext=()=>{
    const v=queue[idx];
    if(v._requeue){ delete v._requeue; queue.push(v); }
    idx++;
    if(idx>=VOCAB.length && idx<queue.length) round=Math.max(round,2);
    draw();
  };
  function finish(){
    S.done.vocab=true; save();
    const sc=scoreFor("vocab");
    $("body").innerHTML=`<h2>Vocabulary preteach — done</h2>
    <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} words correct on first attempt.</b>
    ${COPY.vocabDone}</p></div>
    <div class="panel"><p class="lead" style="margin:0">Next: the dictation warm-up uses these same words in
    sentences, so you meet them again in a different job.</p></div>
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  }
  draw();
}

/* ---------- 2 · DICTATION ---------- */
function normWord(w){ return w.toLowerCase().replace(/[^a-z']/g,""); }
function runDict(){
  if(!SPEAK.can()){
    $("body").innerHTML=`<h2>Dictation warm-up</h2>
    <div class="feedback warn" style="display:block"><b>This browser cannot read text aloud.</b>
    The dictation needs the browser's own speech engine, which is not available here.
    Everything else in the hub works — try the vocabulary preteach or a quickread instead.
    On a school laptop, Edge or Chrome will have a voice.</div>
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
    return;
  }
  let queue=DICTATION.slice(), idx=0, rate=0.85, round=1;
  function draw(){
    if(idx>=queue.length){ finish(); return; }
    const d=queue[idx];
    const answered=keysFor("dict").length;
    $("body").innerHTML=`<div class="eyebrow">Warm-up · listening and spelling</div>
    <h2>Dictation <span style="font-weight:400;color:var(--muted);font-size:14px">(${idx+1}/${queue.length})</span></h2>
    <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,answered/DICTATION.length*100)}%"></div></div>
    ${round>1?`<p class="lead">Mastery round ${round} — the sentences you missed come back.</p>`:""}
    <p class="lead">Press play, listen, then type exactly what you hear. Capital letters and full stops count.
    You can replay as many times as you need.</p>
    <div class="btnrow" style="margin:0 0 12px">
      <button class="btn btn-primary" id="play">▶ Play the sentence</button>
      <button class="btn btn-ghost" id="slow">▶ Play slowly</button>
    </div>
    <div class="dictbox"><textarea id="ans" placeholder="Type what you hear…" autocomplete="off" spellcheck="false"></textarea></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="btnrow" id="brow"><button class="btn btn-primary" id="chk">Check</button></div>`;
    $("play").onclick=()=>SPEAK.say(d.s, rate);
    $("slow").onclick=()=>SPEAK.say(d.s, 0.6);
    $("chk").onclick=check;
    $("ans").focus();
    $("ans").addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey)) check(); });
    setTimeout(()=>SPEAK.say(d.s, rate), 350);
  }
  function check(){
    const d=queue[idx];
    const typed=($("ans").value||"").trim();
    if(!typed){ const fb=$("fb"); fb.className="feedback bad"; fb.innerHTML="<b>Nothing typed yet.</b> Press play and write what you hear."; return; }
    const want=d.s.split(/\s+/), got=typed.split(/\s+/);
    /* word-by-word alignment, so one missing word does not mark the rest wrong */
    let i=0,j=0,marked="",wrong=0;
    while(i<want.length||j<got.length){
      const a=want[i], b=got[j];
      if(a!==undefined && b!==undefined && normWord(a)===normWord(b)){
        marked+= (a===b? `<span class="w-ok">${esc(b)}</span> `
                       : `<span class="w-no">${esc(b)}</span> <span class="w-add">${esc(a)}</span> `);
        if(a!==b) wrong++;
        i++; j++;
      } else if (a!==undefined && got[j+1]!==undefined && normWord(a)===normWord(got[j+1])){
        marked+=`<span class="w-no">${esc(b)}</span> `; wrong++; j++;
      } else if (b!==undefined && want[i+1]!==undefined && normWord(b)===normWord(want[i+1])){
        marked+=`<span class="w-add">${esc(a)}</span> `; wrong++; i++;
      } else {
        if(b!==undefined) marked+=`<span class="w-no">${esc(b)}</span> `;
        if(a!==undefined) marked+=`<span class="w-add">${esc(a)}</span> `;
        if(a!==undefined||b!==undefined) wrong++;
        i++; j++;
      }
    }
    const perfect = wrong===0;
    recFirst("dict."+d.id, perfect);
    if(!perfect) d._requeue=true;
    const fb=$("fb");
    fb.className="feedback "+(perfect?"ok":"warn");
    fb.innerHTML=(perfect?"<b>Word perfect.</b>":`<b>${wrong} to fix.</b> Struck-through is what you typed; green is what was said.`)
      +`<div class="marked">${marked}</div>`
      +(perfect?"":`<div style="margin-top:6px">Play it once more and read the correct sentence along with the voice — that is what fixes the spelling.</div>`);
    $("brow").innerHTML=`<button class="btn btn-primary" id="nx">Next sentence →</button>
      <button class="btn btn-ghost" id="again">▶ Replay</button>`;
    $("again").onclick=()=>SPEAK.say(d.s, 0.6);
    $("nx").onclick=()=>{
      if(d._requeue){ delete d._requeue; queue.push(d); }
      idx++;
      if(idx>=DICTATION.length && idx<queue.length) round=Math.max(round,2);
      draw();
    };
  }
  function finish(){
    S.done.dict=true; save();
    const sc=scoreFor("dict");
    $("body").innerHTML=`<h2>Dictation — done</h2>
    <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} word-perfect on first attempt.</b>
    ${COPY.dictDone}</p></div>
    <div class="btnrow"><button class="btn btn-primary" onclick="go('home')">Back to the hub →</button></div>`;
  }
  draw();
}

/* ---------- 7 · EVIDENCE BUILDER ---------- */
let EV=null;
function renderEv(roundIdx){
  const round=EV_ROUNDS[roundIdx];
  if(!round){ evFinish(); return; }
  EV={ roundIdx, round, idea:null, picked:new Set(), checked:false, slots:{stem:null,frag:null,tail:null}, builderChecked:false, locked:false };
  if(round.mode==="idea") renderEvIdea(); else renderEvSelect();
}
function evLadderHtml(active){
  const gotLv=S.evLv||0;
  let h=`<div class="ladder">`;
  EV_LADDER.forEach((L,i)=>{
    const st=(i+1)<=gotLv ? "got" : (i+1)===active ? "now" : "";
    h+=`<button class="lcard ${st}" onclick="evHint(${i})"><span class="lv">${esc(L.lv)} ${(i+1)<=gotLv?"✓":""}</span>${esc(L.text)}</button>`;
  });
  return h+`</div><div class="ladder-hint" id="ladderHint"></div>`;
}
function evHint(i){
  const box=$("ladderHint"); if(!box) return;
  box.className="ladder-hint show";
  box.innerHTML="<b>"+esc(EV_LADDER[i].lv)+" scaffold:</b> "+esc(EV_LADDER[i].hint);
}
function renderEvIdea(){
  const r=EV.round;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="q">${esc(r.question)}</p><div class="idea-chips">`;
  r.ideas.forEach(i=>{ h+=`<button class="fchoice" onclick="evPickIdea('${i.id}')">${esc(i.label)}</button>`; });
  h+=`</div><p class="lead">Pick the idea you want to prove, then the passage opens for evidence-hunting.</p>
  <div class="btnrow"><button class="btn btn-ghost" onclick="go('home')">← back to the hub</button></div>`;
  $("body").innerHTML=h;
}
function evPickIdea(id){ EV.idea=id; EV.picked=new Set(); EV.locked=false; EV.checked=false; renderEvSelect(); }
function renderEvSelect(){
  const r=EV.round;
  const ideaLabel = EV.idea ? r.ideas.find(i=>i.id===EV.idea).label : null;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 1</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(1);
  h+=`<p class="q">${esc(r.mode==="idea" ? "Find the evidence for: "+ideaLabel : r.question)}</p>
  <p class="lead">${esc(r.qNote)}</p><div class="passage" id="pass">`;
  r.segs.forEach((seg,i)=>{ h+=`<span class="seg" id="seg${i}" onclick="evToggle(${i})">${esc(seg.t)}</span> `; });
  h+=`<span class="pg">${esc(r.origin)}</span></div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="evCheck()">Check my evidence</button>
  ${r.mode==="idea"?`<button class="btn btn-ghost" onclick="renderEvIdea()">← different idea</button>`:`<button class="btn btn-ghost" onclick="go('home')">← back</button>`}</div>`;
  $("body").innerHTML=h;
}
function evToggle(i){
  if(EV.locked) return;
  const el=$("seg"+i);
  el.classList.remove("hit","miss");
  if(EV.picked.has(i)){ EV.picked.delete(i); el.classList.remove("picked"); }
  else { EV.picked.add(i); el.classList.add("picked"); }
  $("fb").className="feedback";
}
function segRole(seg){ return EV.round.mode==="idea" ? (seg.roles[EV.idea]||"plain") : seg.role; }
function segFb(seg){ return EV.round.mode==="idea" ? (seg.fbs[EV.idea]||"") : seg.fb; }
function evCheck(){
  const r=EV.round, fb=$("fb");
  if(EV.picked.size===0){ fb.className="feedback bad"; fb.innerHTML="<b>Nothing selected.</b> Click the part of the passage that answers the question, then check."; return; }
  const picked=[...EV.picked].map(i=>({i,seg:r.segs[i],role:segRole(r.segs[i])}));
  const gold=picked.filter(p=>p.role==="gold"), okp=picked.filter(p=>p.role==="ok");
  const bad=picked.filter(p=>["other","plain","frame"].includes(p.role));
  picked.forEach(p=>{ const el=$("seg"+p.i); el.classList.remove("picked");
    el.classList.add(p.role==="gold"||p.role==="ok" ? "hit" : "miss"); });
  const line=p=>"“"+p.seg.t.slice(0,54)+(p.seg.t.length>54?"…”":"”")+" — "+segFb(p.seg);
  const findings=gold.concat(okp).concat(bad).map(line);
  const pass = gold.length>=1 && bad.length===0;
  if(!EV.checked){ recFirst("ev."+r.id+".l1", pass); EV.checked=true; }
  let head,cls;
  if(pass){ head="Strong evidence selected."; cls="ok"; }
  else if(gold.length>=1){ head="A good start — here is how to lift it: your strongest pick is right, but drop the ones that do not belong."; cls="warn"; }
  else if(okp.length>=1){ head="Close — that supports the answer, but there is a stronger line. Deselect and look again."; cls="warn"; }
  else { head="Something needs fixing — none of these picks answer the question yet."; cls="bad"; }
  fb.className="feedback "+cls;
  fb.innerHTML="<b>"+esc(head)+"</b><ul>"+findings.map(f=>"<li>"+esc(f)+"</li>").join("")+"</ul>";
  if(pass){
    EV.locked=true;
    S.evLv=Math.max(S.evLv||0,1); save();
    fb.innerHTML+=`<div style="margin-top:8px"><b>Level 1 achieved:</b> ${esc(EV_LADDER[0].text)}.</div>`;
    document.querySelector(".btnrow").innerHTML=`<button class="btn btn-primary" onclick="renderEvL2()">Level 2: explain the relevance →</button>`;
  } else {
    picked.filter(p=>p.role!=="gold"&&p.role!=="ok").forEach(p=>EV.picked.delete(p.i));
  }
}
function renderEvL2(){
  const r=EV.round;
  const l2 = r.mode==="idea" ? r.l2s[EV.idea] : r.l2;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 2</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(2);
  h+=`<p class="q">${esc(l2.q)}</p><div class="opts" id="opts"></div>
  <div class="feedback" id="fb" aria-live="polite"></div><div class="btnrow" id="brow"></div>`;
  $("body").innerHTML=h;
  let first=true;
  shuffle(l2.opts.map((_,i)=>i)).forEach(oi=>{
    const o=l2.opts[oi];
    const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
    b.onclick=()=>{
      const good=o.q==="good";
      if(first){ recFirst("ev."+r.id+".l2", good); first=false; }
      const fb=$("fb");
      if(good){
        document.querySelectorAll("#opts .opt").forEach(x=>x.disabled=true);
        b.classList.add("right");
        fb.className="feedback ok"; fb.innerHTML="<b>Correct.</b> "+esc(o.fb)
          +`<div style="margin-top:8px"><b>Level 2 achieved:</b> ${esc(EV_LADDER[1].text)}.</div>`;
        S.evLv=Math.max(S.evLv,2); save();
        $("brow").innerHTML=`<button class="btn btn-primary" onclick="renderEvBuilder()">Level 3: embed the quote →</button>`;
      } else {
        b.disabled=true; b.classList.add("wrongpick");
        fb.className="feedback bad"; fb.innerHTML="<b>Not this one.</b> "+esc(o.fb);
      }
    };
    $("opts").appendChild(b);
  });
}
function renderEvBuilder(){
  const r=EV.round;
  const B = r.mode==="idea" ? r.builders[EV.idea] : r.builder;
  EV.slots={stem:null,frag:null,tail:null}; EV.builderChecked=false;
  let h=`<div class="eyebrow">${esc(r.where)} · evidence builder · level 3</div><h2>${esc(r.title)}</h2>`;
  h+=evLadderHtml(3);
  h+=`<p class="lead">${esc(B.intro)} Tap a tile to place it; tap a placed tile to remove it.
  <b style="color:var(--p-tx)">Blue = stem</b>, <b style="color:var(--e-tx)">yellow = quote</b>, <b style="color:var(--l-tx)">pink = ending</b>.</p>
  <div class="slotrow">
    <div class="slot"><span class="slabel">Stem</span><span id="in-stem"></span></div>
    <div class="slot"><span class="slabel">Quote</span><span id="in-frag"></span></div>
    <div class="slot"><span class="slabel">Ending</span><span id="in-tail"></span></div>
  </div>
  <div class="preview" id="prev"></div>
  <div class="bins" style="grid-template-columns:repeat(3,1fr)">
    <div class="bin b-p"><h4>Sentence stems</h4><div class="binbody" id="bin-stem"></div></div>
    <div class="bin b-e"><h4>Trimmed quotes</h4><div class="binbody" id="bin-frag"></div></div>
    <div class="bin b-l"><h4>Endings</h4><div class="binbody" id="bin-tail"></div></div>
  </div>
  <div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"><button class="btn btn-primary" onclick="evBuildCheck()">Check my sentence</button>
  <button class="btn btn-ghost" onclick="renderEvBuilder()">Reset</button></div>`;
  $("body").innerHTML=h;
  const cls={stem:"k-p",frag:"k-e",tail:"k-l"};
  const fill=(kind,list)=>{
    const bin=$("bin-"+kind);
    shuffle(list).forEach(x=>{
      const b=document.createElement("button"); b.className="btile "+cls[kind];
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=x; drawEvSlots(); };
      bin.appendChild(b);
    });
  };
  fill("stem",B.stems); fill("frag",B.frags); fill("tail",B.tails);
  drawEvSlots();
}
function drawEvSlots(){
  const cls={stem:"k-p",frag:"k-e",tail:"k-l"};
  ["stem","frag","tail"].forEach(kind=>{
    const holder=$("in-"+kind); holder.innerHTML="";
    const x=EV.slots[kind];
    if(x){ const b=document.createElement("button"); b.className="placed "+cls[kind];
      b.textContent=x.t; b.onclick=()=>{ EV.slots[kind]=null; drawEvSlots(); }; holder.appendChild(b); }
  });
  const {stem,frag,tail}=EV.slots, prev=$("prev");
  if(stem||frag||tail) prev.textContent=(stem?stem.t:"…")+" "+(frag?"“"+frag.t+"”":"“…”")+(tail?tail.t:" …");
  else prev.innerHTML=`<span class="ph">Your sentence appears here as you build it.</span>`;
  const fb=$("fb"); if(fb) fb.className="feedback";
}
function evBuildCheck(){
  const r=EV.round, {stem,frag,tail}=EV.slots, fb=$("fb");
  if(!stem||!frag||!tail){
    fb.className="feedback bad";
    fb.innerHTML="<b>Something needs fixing.</b> The sentence needs all three parts — a stem, a trimmed quote and an ending.";
    return;
  }
  const findings=[];
  if(stem.q==="point") findings.push({sev:"warn", text:stem.fb});
  if(frag.q==="long"||frag.q==="short") findings.push({sev:"warn", text:frag.fb});
  if(frag.q==="nofit" || (stem.accepts && frag.q==="good" && !stem.accepts.includes(frag.id)))
    findings.push({sev:"err", text: frag.q==="nofit" ? frag.fb :
      "Read the preview aloud — the quote does not continue the stem's grammar. Swap one of them so it flows as a single sentence."});
  if(tail.q==="point"||tail.q==="retell") findings.push({sev:"warn", text:tail.fb});
  const level = findings.some(f=>f.sev==="err") ? "err" : findings.length ? "warn" : "ok";
  const pass = level==="ok";
  if(!EV.builderChecked){ recFirst("ev."+r.id+".l3", pass); EV.builderChecked=true; }
  if(pass){
    fb.className="feedback ok";
    let msg="<b>Strong analytical sentence.</b> Stem, embedded quote and an ending that explains. Read it back out loud — that is an essay sentence.";
    if(tail.q==="bonus") msg+=" <b>You also wove in a second quotation — that is above the standard.</b>";
    fb.innerHTML=msg+`<div style="margin-top:8px"><b>Level 3 achieved:</b> ${esc(EV_LADDER[2].text)}.</div>`;
    S.evLv=Math.max(S.evLv, EV.roundIdx===0?3:3); save();
    const next=EV.roundIdx+1;
    $("brow").innerHTML = EV_ROUNDS[next]
      ? `<button class="btn btn-primary" onclick="renderEv(${next})">Round 2: choose your own idea →</button>`
      : `<button class="btn btn-primary" onclick="evFinish()">Finish the evidence builder →</button>`;
  } else {
    fb.className="feedback "+(level==="err"?"bad":"warn");
    fb.innerHTML="<b>"+(level==="err"?"Something needs fixing.":"A good start — here is how to lift it:")+"</b><ul>"
      +findings.map(f=>"<li>"+esc(f.text)+"</li>").join("")+"</ul>";
  }
}
function evFinish(){
  S.done.ev=true; save();
  const sc=scoreFor("ev");
  $("body").innerHTML=`<h2>Evidence builder — done</h2>
  ${evLadderHtml(4)}
  <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} levels passed on the first check.</b>
  You have climbed three rungs of the assessment ladder: find it → explain it → embed it. The wrong turns you met
  on the way — retelling, overreaching, pointing at the quote — are the exact traps to avoid in the essay.</p></div>
  <div class="panel"><p class="lead" style="margin:0">Level 4 is the whole paragraph. That is the
  <b>PEEL paragraph builder</b> — the last activity, and the one closest to the assessment.</p></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="go('peel')">Go to the PEEL builder →</button>
  <button class="btn btn-ghost" onclick="go('home')">Back to the hub</button></div>`;
}

/* ---------- 8 · PEEL PARAGRAPH BUILDER ---------- */
let PE=null;
function runPeel(){ renderPeel(0, true); }
function renderPeel(i, showModel){
  const it=PEEL_ITEMS[i];
  if(!it){ peelFinish(); return; }
  PE={ i, it, slots:{p:null,e:null,x:null,l:null}, checked:false };
  if(showModel){
    $("body").innerHTML=`<div class="eyebrow">Analytical writing · PEEL · ${i+1} of ${PEEL_ITEMS.length}</div>
    <h2>${esc(it.focus)}</h2>
    <p class="q">${esc(it.question)}</p>
    <p class="lead">First, read a good one. This is a <b>WAGOLL</b> — What A Good One Looks Like.

    <div class="wagoll">${it.wagoll}${SPEAK.btn(it.wagoll.replace(/<[^>]+>/g,""))}</div>
    <div class="panel"><p style="margin:0;font-size:13.5px"><b>Why it works:</b> ${it.wagollNote}</p></div>
    <div class="panel"><p class="lead" style="margin:0">
      <b>P</b> — ${esc(PEEL_PARTS[0].hint)}<br>
      <b>E</b> — ${esc(PEEL_PARTS[1].hint)}<br>
      <b>E</b>xplain — ${esc(PEEL_PARTS[2].hint)}<br>
      <b>L</b> — ${esc(PEEL_PARTS[3].hint)}</p></div>
    <div class="btnrow"><button class="btn btn-primary" onclick="renderPeel(${i},false)">Now build one →</button>
    <button class="btn btn-ghost" onclick="go('home')">← back to the hub</button></div>`;
    return;
  }
  let h=`<div class="eyebrow">Analytical writing · PEEL · ${i+1} of ${PEEL_ITEMS.length}</div>
  <h2>${esc(it.focus)}</h2>
  <p class="q">${esc(it.question)}</p>
  <p class="lead">Build the paragraph. One tile per slot — tap a placed tile to remove it.
  Each bin has one strong option and three that fail in a named way.</p>
  <div class="slotrow">`;
  PEEL_PARTS.forEach(pt=>{
    h+=`<div class="slot"><span class="slabel">${esc(pt.label)}</span><span id="pin-${pt.k}"></span></div>`;
  });
  h+=`</div><div class="preview" id="pprev"></div>
  <div class="bins">`;
  PEEL_PARTS.forEach(pt=>{
    h+=`<div class="bin b-${pt.k}"><h4>${esc(pt.label)}</h4><div class="binbody" id="pbin-${pt.k}"></div></div>`;
  });
  h+=`</div><div class="feedback" id="fb" aria-live="polite"></div>
  <div class="btnrow" id="brow"><button class="btn btn-primary" onclick="peelCheck()">Check my paragraph</button>
  <button class="btn btn-ghost" onclick="renderPeel(${i},true)">See the model again</button></div>`;
  $("body").innerHTML=h;
  PEEL_PARTS.forEach(pt=>{
    const bin=$("pbin-"+pt.k);

function drawPeelSlots(){
  PEEL_PARTS.forEach(pt=>{
    const holder=$("pin-"+pt.k); holder.innerHTML="";
    const x=PE.slots[pt.k];
    if(x){ const b=document.createElement("button"); b.className="placed k-"+pt.k;
      b.textContent=x.t; b.onclick=()=>{ PE.slots[pt.k]=null; drawPeelSlots(); }; holder.appendChild(b); }
  });
  const any=PEEL_PARTS.some(pt=>PE.slots[pt.k]);
  const prev=$("pprev");
  if(any) prev.textContent=PEEL_PARTS.map(pt=>PE.slots[pt.k]?PE.slots[pt.k].t:"…").join(" ");
  else prev.innerHTML=`<span class="ph">Your paragraph appears here as you build it.</span>`;
  const fb=$("fb"); if(fb) fb.className="feedback";
}
function peelCheck(){
  const it=PE.it, fb=$("fb");
  const missing=PEEL_PARTS.filter(pt=>!PE.slots[pt.k]);
  if(missing.length){
    fb.className="feedback bad";
    fb.innerHTML="<b>Not finished.</b> A PEEL paragraph needs all four parts. Still empty: "
      +missing.map(m=>esc(m.label)).join(", ")+".";
    return;
  }
  const findings=[];
  PEEL_PARTS.forEach(pt=>{
    const x=PE.slots[pt.k];
    recFirst("peel."+it.id+"."+pt.k, x.q==="good");
    if(x.q!=="good") findings.push(esc(pt.label)+" — "+x.fb);
  });
  PE.checked=true;
  if(!findings.length){
    fb.className="feedback ok";
    fb.innerHTML=`<b>That is a PEEL paragraph.</b> Point, embedded evidence, an explanation of what the words
    DO, and a link that reaches past the paragraph. Read it back once out loud — this is the standard for the essay.`;
    $("brow").innerHTML = PEEL_ITEMS[PE.i+1]
      ? `<button class="btn btn-primary" onclick="renderPeel(${PE.i+1},true)">Next paragraph →</button>`
      : `<button class="btn btn-primary" onclick="peelFinish()">Finish →</button>`;
  } else {
    fb.className="feedback warn";
    fb.innerHTML="<b>A good start — here is how to lift it:</b><ul>"
      +findings.map(f=>"<li>"+f+"</li>").join("")+"</ul>"
      +"<div style='margin-top:6px'>Swap the parts that are named above and check again.</div>";
  }
}
function peelFinish(){
  S.done.peel=true; save();
  const sc=scoreFor("peel");
  $("body").innerHTML=`<h2>PEEL paragraph builder — done</h2>
  <div class="panel"><p style="margin:0"><b>${sc.got}/${sc.total} parts chosen correctly first try.</b>
  The four moves you just practised are the whole engine of a text-response essay: make a claim, prove it with
  the author's words, explain what those words do, and reach an idea. Every body paragraph you write does this again.</p></div>
  <div class="panel"><p class="lead" style="margin:0">The traps have names now — <b>thin</b> (true but says nothing),
  <b>meta</b> (talking about the essay instead of the text), <b>retell</b> (plot instead of analysis) and
  <b>repeat</b> (a Link that just says the Point again). Mark your own draft against those four.</p></div>
  <div class="btnrow"><button class="btn btn-primary" onclick="go('rpt')">See my report →</button>
  <button class="btn btn-ghost" onclick="go('home')">Back to the hub</button></div>`;
}

/* ---------- 9 · REPORT ---------- */
function vcode(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return "V-"+Math.abs(h).toString(16).toUpperCase().slice(0,6); }
const LABELS={vocab:"Vocabulary preteach",dict:"Dictation warm-up",qr1:COPY.labels.qr1,
  qr2:COPY.labels.qr2,fig:"Figurative → literal",voice:"Voice fingerprint",
  ev:"Evidence builder",peel:"PEEL paragraph builder"};
const RECOMMEND={
 vocab:"Reopen the morpheme matrices — and look the same roots up in the Word Builder, where every piece is translated into your home language.",
 dict:"Replay each sentence slowly and read it aloud with the voice. Spelling by ear is a skill; it improves fast with daily dictation.",
 qr1:COPY.recommend.qr1,
 qr2:COPY.recommend.qr2,
 fig:COPY.recommend.fig,
 voice:COPY.recommend.voice,
 ev:"Practise the three levels on any quotation: find it, say why it answers the question, then embed it in your own sentence.",
 peel:"Mark your own draft paragraph against the four traps: thin, meta, retell, repeat."};
function renderReport(){
  const mods=Object.keys(LABELS);
  let rows="", worst=null, worstErr=-1, anyDone=false;
  mods.forEach(m=>{
    const sc=scoreFor(m); if(!sc.total) return;
    anyDone=true;
    const err=1-sc.got/sc.total;
    if(err>worstErr && sc.total>=3){ worstErr=err; worst=m; }
    rows+=`<tr><td>${esc(LABELS[m])}</td><td>${sc.got} / ${sc.total}</td><td>${S.done[m]?"finished":"in progress"}</td></tr>`;
  });
  const notStarted=mods.filter(m=>!scoreFor(m).total);
  const scAll=mods.reduce((a,m)=>{const s=scoreFor(m);return{got:a.got+s.got,total:a.total+s.total}},{got:0,total:0});
  const code=vcode(JSON.stringify(S.first)+(S.name||"")+(S.sid||""));
  const teach = !anyDone ? "" :
    `This student worked through the <i>${esc(TEXT.title)}</i> hub. Every wrong answer was retried until correct
     (mastery loop), but the scores above are <b>first attempts only</b>, so they show independent reading rather than
     final-state guessing. `
    + (worst!==null && worstErr>0.34 ? `Clearest next step: <b>${esc(LABELS[worst])}</b> — ${esc(RECOMMEND[worst])}` :
       worst!==null && worstErr>0 ? `Errors were spread thin; the softest area was <b>${esc(LABELS[worst])}</b>. ${esc(RECOMMEND[worst])}` :
       `A clean first-attempt run across everything attempted — extension: ${esc(COPY.extension)}.`);
  $("body").innerHTML=`<div class="eyebrow">My report</div><h2><i>${esc(TEXT.title)}</i> hub — report</h2>
  <div class="rowinp noprint">
    <span><label for="nm">Name</label><input id="nm" value="${esc(S.name||"")}" onchange="S.name=this.value;save();renderReport()"></span>
    <span><label for="sid">Student ID</label><input id="sid" value="${esc(S.sid||"")}" onchange="S.sid=this.value;save();renderReport()"></span>
  </div>
  <p class="lead">${esc(S.name||"(no name entered)")}${S.sid?" · "+esc(S.sid):""} · first-attempt scores · overall <b>${scAll.got}/${scAll.total}</b></p>
  <table class="rpt"><tr><th>Activity</th><th>First attempt</th><th>Status</th></tr>
    ${rows||`<tr><td colspan="3">Nothing attempted yet — do an activity first.</td></tr>`}</table>
  ${notStarted.length?`<div class="panel"><b>Not started yet:</b> <span style="color:var(--muted);font-size:13px">${notStarted.map(m=>esc(LABELS[m])).join(" · ")}</span></div>`:""}
  <div class="panel"><b>What this tells your teacher:</b> ${teach||"Attempt at least one activity to generate the summary."}</div>
  <p class="lead">Verification code: <span class="vcode">${code}</span> — this changes if the answers change, so a
  printed report cannot be edited afterwards.</p>
  <div class="btnrow noprint">
    <button class="btn btn-primary" onclick="S.done.rpt=true;save();window.print()">Print / save as PDF</button>
    <button class="btn btn-ghost" onclick="go('home')">← back to the hub</button>
  </div>`;
}

document.getElementById("navWhere").textContent = COPY.nav;
go("home");
</script>
