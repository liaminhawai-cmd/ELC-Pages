<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronunciation Hub — ELC Hub</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f8fc;color:#1c2333}
  .loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
  .loading b{display:block;font-size:1.1rem;margin-bottom:6px}
  .loading span{color:#5b6478;font-size:.88rem}
</style>
</head>
<body>
<div class="loading"><div><b>Loading the Pronunciation Hub…</b><span>Preparing the interactive vocal tract.</span></div></div>
<script>
(() => {
  const build = "20260822-closeup-1";
  fetch(`pronunciation-core.html?v=${build}`, {cache:"no-cache"})
    .then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
    .then(html => {
      const enhancer = `<script src="pronunciation-enhancer.js?v=${build}"><\/script>`;
      html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, enhancer + "</body>") : html + enhancer;
      document.open();
      document.write(html);
      document.close();
    })
    .catch(err => {
      document.body.innerHTML = `<div class="loading"><div><b>The hub did not load.</b><span>${String(err.message || err)}. Refresh the page to try again.</span></div></div>`;
    });
})();
</script>
</body>
</html>
