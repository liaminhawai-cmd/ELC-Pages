<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ELC Hub — reading, writing, speaking and analytical writing rubrics, band by band.">
<title>Rubrics — ELC Hub</title>
<style>
  :root {
    --bg:#f6f8fc; --card:#fff; --ink:#1c2333; --muted:#5b6478; --line:#e3e8f2;
    --accent:#2563eb; --accent-soft:#dbeafe; --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
    /* same three colours as the Analytical Writing Wall, same hex values */
    --evid:#006FC0; --evid-fill:#45B0E1;
    --purp:#008F4C; --purp-fill:#8DD873;
    --idea:#C03A2B; --idea-fill:#F1A983;
  }
  @media (prefers-color-scheme:dark) {
    :root { --bg:#0f1420; --card:#171e2e; --ink:#e8ecf5; --muted:#9aa4b8; --line:#263048;
            --accent:#7aa5ff; --accent-soft:#1d2c4d; --shadow:0 1px 2px rgba(0,0,0,.4);
            --evid:#5FB4EC; --purp:#4FBF83; --idea:#E8836F; }
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.55; }
  header { background:linear-gradient(135deg,#2563eb,#7c3aed 60%,#db2777); color:#fff; padding:20px 20px 26px; text-align:center; }
  header a.back { color:#fff; opacity:.85; text-decoration:none; font-size:.85rem; font-weight:600; }
  header h1 { font-size:clamp(1.4rem,4vw,1.9rem); margin-top:6px; }
  main { max-width:1180px; margin:0 auto; padding:18px 14px 70px; }
  section { margin-top:34px; scroll-margin-top:12px; }
  h2.sec { font-size:1.2rem; margin:0 0 2px; }
  p.sub { color:var(--muted); font-size:.88rem; margin:0 0 12px; }

  .jump { display:flex; flex-wrap:wrap; gap:7px; }
  .jump a { border:1px solid var(--line); background:var(--card); border-radius:999px;
            padding:6px 14px; text-decoration:none; color:inherit; font-size:.88rem; box-shadow:var(--shadow); }
  .jump a:hover { border-color:var(--accent); color:var(--accent); }

  a.card { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
           border-radius:var(--radius); padding:13px 15px; text-decoration:none; color:inherit;
           box-shadow:var(--shadow); transition:transform .12s,border-color .12s; margin-bottom:14px; max-width:640px; }
  a.card:hover { transform:translateY(-2px); border-color:var(--accent); }
  a.card .emoji { font-size:1.6rem; flex:none; }
  a.card h3 { font-size:1rem; margin-bottom:2px; }
  a.card p { font-size:.84rem; color:var(--muted); }
  a.card .go { margin-left:auto; color:var(--accent); font-weight:700; font-size:1.3rem; flex:none; }

  .legend { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:.82rem;
            background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:9px 13px; margin-bottom:12px; }
  .sw { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:11px; height:11px; border-radius:3px; border:1px solid rgba(0,0,0,.18); flex:none; }
  .dot.evid { background:var(--evid-fill); } .dot.purp { background:var(--purp-fill); } .dot.idea { background:var(--idea-fill); }

  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); }
  table.rubric { border-collapse:collapse; width:100%; min-width:760px; }
  .rubric th, .rubric td { padding:10px 13px; text-align:left; vertical-align:top; font-size:.86rem; border:1px solid var(--line); }
  .rubric thead th { font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); background:var(--bg); white-space:nowrap; }
  .rubric td.skill { font-weight:700; }
  .rubric td.empty { background:var(--bg); }
  tr.evid td { background:var(--evid-fill); } tr.purp td { background:var(--purp-fill); } tr.idea td { background:var(--idea-fill); }
  tr.evid td, tr.purp td, tr.idea td { color:#1c2333; }

  /* ---- extensions: related rubrics that reuse a base rubric's shape ---- */
  details.ext { border:1px solid var(--line); border-radius:12px; background:var(--card);
                box-shadow:var(--shadow); margin-top:8px; overflow:hidden; }
  details.ext + details.ext { margin-top:8px; }
  details.ext summary { cursor:pointer; padding:10px 14px; font-weight:600; font-size:.92rem;
                display:flex; align-items:baseline; gap:10px; list-style:none; }
  details.ext summary::-webkit-details-marker { display:none; }
  details.ext summary::before { content:"▸"; color:var(--muted); font-weight:400; }
  details.ext[open] summary::before { content:"▾"; }
  details.ext summary .exsub { font-weight:400; color:var(--muted); font-size:.84rem; }
  details.ext .extbody { padding:0 14px 14px; }
  .extgroup { margin-top:14px; }
  .extgroup > .lbl { font-size:.74rem; text-transform:uppercase; letter-spacing:.5px;
                      color:var(--muted); margin-bottom:6px; }
  table.plain { border-collapse:collapse; width:100%; min-width:640px; }
  table.plain th, table.plain td { padding:9px 12px; text-align:left; vertical-align:top;
                      font-size:.85rem; border:1px solid var(--line); }
  table.plain thead th { font-size:.72rem; text-transform:uppercase; letter-spacing:.5px;
                      color:var(--muted); background:var(--bg); white-space:nowrap; }
  table.plain td.skill { font-weight:700; }

  .phrase { display:inline-block; cursor:pointer; border-bottom:1px dotted currentColor; }
  .phrase .gloss { display:block; margin-top:4px; font-size:.84em; font-weight:400; border-bottom:none;
                    background:var(--accent-soft); color:var(--ink); border-radius:6px; padding:4px 7px; }
  tr.evid .phrase .gloss, tr.purp .phrase .gloss, tr.idea .phrase .gloss {
    background:rgba(255,255,255,.55); color:#1c2333; }
  .gloss b { font-weight:700; margin-right:2px; }

  footer { border-top:1px solid var(--line); margin-top:44px; padding:20px 18px 34px; text-align:center; color:var(--muted); font-size:.85rem; }
</style>
</head>

<script>
function esc(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function phraseHTML(p){
  return `<span class="phrase" data-vi="${esc(p.vi)}" data-zh="${esc(p.zh)}">${esc(p.en)}</span>`;
}

document.getElementById("jump").innerHTML = RUBRICS.map(r =>
  `<a href="#${r.id}">${r.emoji} ${esc(r.title)}</a>`).join("");

document.getElementById("sections").innerHTML = RUBRICS.map(r => {
  const legend = r.legend ? `<div class="legend">
      <span class="sw"><span class="dot evid"></span>Evidence &amp; metalanguage</span>
      <span class="sw"><span class="dot purp"></span>Purpose &amp; interpretation</span>
      <span class="sw"><span class="dot idea"></span>Ideas &amp; themes</span>
    </div>` : "";
  const cta = r.cta ? `<a class="card" href="${r.cta.href}">
      <span class="emoji">${r.cta.emoji}</span>
      <span><h3>${esc(r.cta.h)}</h3><p>${esc(r.cta.p)}</p></span>
      <span class="go">→</span></a>` : "";
  const head = `<thead><tr><th>Skill area</th>${r.bands.map(b=>`<th>${esc(b)}</th>`).join("")}</tr></thead>`;
  const body = "<tbody>" + r.rows.map(row => {
    const cells = r.bands.map((_,i) => {
      const ph = row.cells[i] || [];
      return ph.length
        ? `<td>${ph.map(phraseHTML).join(" ")}</td>`
        : `<td class="empty"></td>`;
    }).join("");
    return `<tr class="${row.cls}"><td class="skill">${phraseHTML(P(row.skill,row.vi,row.zh))}</td>${cells}</tr>`;
  }).join("") + "</tbody>";
  const extras = (r.extensions||[]).map(extHTML).join("");
  return `<section id="${r.id}">
      <h2 class="sec">${r.emoji} ${esc(r.title)}</h2>
      <p class="sub">${esc(r.sub)}</p>
      ${cta}${legend}
      <div class="scroll"><table class="rubric">${head}${body}</table></div>
      ${extras ? `<div class="extgroup"><div class="lbl">Related rubrics — same shape, extra rows</div>${extras}</div>` : ""}
    </section>`;
}).join("");

/* An extension: a related rubric that reuses its parent's row/band shape.
   A cell is either a plain string (no translation yet) or a P(en,vi,zh)
   object (translated) — both render, mixed freely within one table. */
function extHTML(x){
  const head = `<thead><tr><th>Skill area</th>${x.bands.map(b=>`<th>${esc(b)}</th>`).join("")}</tr></thead>`;
  const body = "<tbody>" + x.rows.map(row => {
    const cells = x.bands.map((_,i) => {
      const ph = row.cells[i] || [];
      if(!ph.length) return `<td class="empty"></td>`;
      const first = ph[0];
      const translated = typeof first === "object";
      return `<td>${translated ? ph.map(phraseHTML).join(" ") : ph.map(esc).join(" ")}</td>`;
    }).join("");
    const skillCell = row.vi
      ? `<td class="skill">${phraseHTML(P(row.skill,row.vi,row.zh))}</td>`
      : `<td class="skill">${esc(row.skill)}</td>`;
    return `<tr class="${row.cls||""}">${skillCell}${cells}</tr>`;
  }).join("") + "</tbody>";
  const table = x.rows.some(r=>r.vi) || x.rows.some(r=>(r.cells[0]||[])[0] && typeof (r.cells[0]||[])[0]==="object")
    ? `<table class="rubric">${head}${body}</table>`
    : `<table class="plain">${head}${body}</table>`;
  return `<details class="ext">
      <summary>${esc(x.title)} <span class="exsub">${esc(x.sub)}</span></summary>
      <div class="extbody"><div class="scroll">${table}</div></div>
    </details>`;
}

/* Tap a phrase -> its Vietnamese and Chinese. One phrase at a time,
   independent of every other. */
document.addEventListener("click", e=>{
  const ph = e.target.closest(".phrase");
  if(!ph) return;
  const existing = ph.querySelector(":scope > .gloss");
  if(existing){ existing.remove(); return; }
  const g = document.createElement("span");
  g.className = "gloss";
  g.innerHTML = `<b>VI</b> ${esc(ph.dataset.vi)} &nbsp;&middot;&nbsp; <b>ZH</b> ${esc(ph.dataset.zh)}`;
  ph.appendChild(g);
});
</script>
</body>
</html>
