<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Limerick Workshop — ELC Hub</title>
<style>
html,body{height:100%;margin:0;background:#f4efe6}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="workshop" src="limericks-workshop-shell.html?v=20260807-navfix-1" title="Limerick Workshop"></iframe>
<script>
const frame=document.getElementById('workshop');
frame.addEventListener('load',()=>{
  try{
    const script=frame.contentDocument.createElement('script');
    script.src='limericks-runtime.js?v=20260807-navfix-1';
    script.onerror=()=>console.error('Could not load the limerick workshop runtime.');
    frame.contentDocument.body.appendChild(script);
  }catch(error){
    console.error('Could not start the limerick workshop.',error);
  }
});
</script>
</body>
</html>
