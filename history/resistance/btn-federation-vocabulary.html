<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTN Australian Federation vocabulary</title>
<style>
:root{
  --bg:#fbf7ef; --ink:#1f2328; --muted:#5b6068; --line:#ddd3c0; --deep:#1f4a52;
  --pre:#1f5f99; --pre-bg:#e3eef9;
  --root:#2e6b3a; --root-bg:#e2f1e4;
  --suf:#a2481f; --suf-bg:#fbe7da;
  --whole:#555b63; --whole-bg:#eeeeea;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#d9d2c2}
body{display:flex;align-items:center;justify-content:center}
/* The slide is drawn at 1920 x 1080 and scaled to fit the window, so zooming or resizing keeps it whole. */
#slide{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);color:var(--ink);
  font:22px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:26px 36px 18px;display:flex;flex-direction:column}
h1{margin:0;font-size:38px;color:var(--deep);line-height:1.1}
.sub{color:var(--muted);font-size:17px;margin:2px 0 10px}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:36px;flex:1;min-height:0}
h2{margin:0 0 4px;font-size:22px;color:#fff;background:var(--deep);padding:6px 12px;border-radius:6px}
table{border-collapse:collapse;width:100%;table-layout:fixed}
th{font-size:16px;text-align:left;color:var(--muted);padding:3px 8px;border-bottom:2px solid var(--deep);font-weight:700}
td{padding:0 8px;height:37px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;vertical-align:middle}
col.w{width:262px} col.h{width:168px} col.s{width:168px} col.v{width:auto}
td.word{font-size:27px;font-weight:800}
td.zh{font-size:23px}
td.vi{font-size:22px}
.m{padding:0 1px;border-radius:3px}
.P{color:var(--pre);background:var(--pre-bg);border-bottom:4px solid var(--pre)}
.R{color:var(--root);background:var(--root-bg);border-bottom:4px double var(--root)}
.S{color:var(--suf);background:var(--suf-bg);border-bottom:4px dotted var(--suf)}
.W{color:var(--whole);background:var(--whole-bg);border-bottom:4px dashed var(--whole)}
.key{display:flex;gap:26px;align-items:center;font-size:19px;padding-top:8px}
.key .m{font-weight:800;padding:0 8px}
.note{margin-left:auto;color:var(--muted);font-size:15px}
</style>
</head>
<body>

<!-- =====================================================================
     CONTENT. Edit the lists below.
     Each word: w (as it appears), p (its parts, written "type|text":
     P prefix, R root, S suffix, W a whole word that cannot be split),
     hant (Traditional, Taiwan usage), hans (Simplified), vi (Vietnamese).
     Source: Behind the News (BTN) video "Australian Federation", from its transcript. Words shared with the other vocabulary slides use the same
     translations.
     Translations are drafted and not yet checked by a speaker of each language.
     ===================================================================== -->
<script>
const TIER3 = [
 {w:"federation", p:["R|feder","S|-ation"], hant:"聯邦成立", hans:"联邦成立", vi:"sự thành lập liên bang"},
 {w:"colonies", p:["R|coloni","S|-es"], hant:"殖民地", hans:"殖民地", vi:"các thuộc địa"},
 {w:"continent", p:["R|contin","S|-ent"], hant:"大陸", hans:"大陆", vi:"lục địa"},
 {w:"immigration", p:["P|im-","R|migr","S|-ation"], hant:"移民", hans:"移民", vi:"sự nhập cư"},
 {w:"border", p:["W|border"], hant:"邊界", hans:"边界", vi:"biên giới"},
 {w:"premier", p:["W|premier"], hant:"州長", hans:"州长", vi:"thủ hiến"},
 {w:"delegates", p:["P|de-","R|leg","S|-ate","S|-s"], hant:"代表", hans:"代表", vi:"các đại biểu"},
 {w:"constitution", p:["P|con-","R|stitut","S|-ion"], hant:"憲法", hans:"宪法", vi:"hiến pháp"},
 {w:"draft", p:["W|draft"], hant:"草案", hans:"草案", vi:"bản dự thảo"},
 {w:"Commonwealth", p:["R|Common","R|wealth"], hant:"澳洲聯邦", hans:"澳大利亚联邦", vi:"Liên bang Úc"},
 {w:"democratic", p:["R|democrat","S|-ic"], hant:"民主的", hans:"民主的", vi:"dân chủ"},
 {w:"representatives", p:["P|re-","R|present","S|-ative","S|-s"], hant:"民意代表", hans:"民选代表", vi:"các đại diện"},
 {w:"capital", p:["R|capit","S|-al"], hant:"首都", hans:"首都", vi:"thủ đô"},
 {w:"vote", p:["W|vote"], hant:"投票", hans:"投票", vi:"bỏ phiếu"},
 {w:"states", p:["R|state","S|-s"], hant:"州", hans:"州", vi:"các bang"},
 {w:"federal", p:["R|feder","S|-al"], hant:"聯邦的", hans:"联邦的", vi:"liên bang"},
 {w:"prime minister", p:["W|prime minister"], hant:"總理", hans:"总理", vi:"thủ tướng"},
 {w:"defence", p:["P|de-","R|fence"], hant:"國防", hans:"国防", vi:"quốc phòng"},
 {w:"Her Majesty", p:["W|Her Majesty"], hant:"女王陛下", hans:"女王陛下", vi:"Nữ hoàng"},
 {w:"territory", p:["R|terr","S|-itory"], hant:"領地", hans:"领地", vi:"lãnh thổ"},
 {w:"nation", p:["R|nat","S|-ion"], hant:"國家", hans:"国家", vi:"quốc gia"},
 {w:"proclaimed", p:["P|pro-","R|claim","S|-ed"], hant:"宣告成立", hans:"宣告成立", vi:"được tuyên bố"}
];
const TIER2 = [
 {w:"separate", p:["R|separ","S|-ate"], hant:"分開的", hans:"分开的", vi:"riêng biệt"},
 {w:"divided", p:["R|divid","S|-ed"], hant:"分割的", hans:"分割的", vi:"bị chia cắt"},
 {w:"convinced", p:["P|con-","R|vinc","S|-ed"], hant:"說服", hans:"说服", vi:"thuyết phục"},
 {w:"negotiating", p:["R|negoti","S|-at","S|-ing"], hant:"談判", hans:"谈判", vi:"đàm phán"},
 {w:"economy", p:["W|economy"], hant:"經濟", hans:"经济", vi:"nền kinh tế"},
 {w:"ordinary", p:["R|ordin","S|-ary"], hant:"普通的", hans:"普通的", vi:"bình thường"},
 {w:"generation", p:["R|gener","S|-ation"], hant:"一代人", hans:"一代人", vi:"thế hệ"},
 {w:"eventually", p:["P|e-","R|vent","S|-ual","S|-ly"], hant:"最終", hans:"最终", vi:"cuối cùng"},
 {w:"arguing", p:["R|argu","S|-ing"], hant:"爭論", hans:"争论", vi:"tranh cãi"},
 {w:"decisions", p:["R|decis","S|-ion","S|-s"], hant:"決定", hans:"决定", vi:"các quyết định"},
 {w:"issue", p:["W|issue"], hant:"議題", hans:"议题", vi:"vấn đề"},
 {w:"obvious", p:["R|obvi","S|-ous"], hant:"明顯的", hans:"明显的", vi:"hiển nhiên"},
 {w:"absurd", p:["W|absurd"], hant:"荒謬的", hans:"荒谬的", vi:"vô lý"},
 {w:"superior", p:["R|super","S|-ior"], hant:"更優越的", hans:"更优越的", vi:"vượt trội"},
 {w:"keen", p:["W|keen"], hant:"熱衷的", hans:"热衷的", vi:"háo hức"},
 {w:"agreed", p:["R|agree","S|-d"], hant:"同意", hans:"同意", vi:"đồng ý"},
 {w:"benefited", p:["R|benefit","S|-ed"], hant:"受益", hans:"受益", vi:"được hưởng lợi"},
 {w:"included", p:["P|in-","R|clud","S|-ed"], hant:"被納入", hans:"被纳入", vi:"được bao gồm"},
 {w:"major", p:["W|major"], hant:"重大的", hans:"重大的", vi:"quan trọng"},
 {w:"impact", p:["P|im-","R|pact"], hant:"影響", hans:"影响", vi:"tác động"}
];
</script>

<div id="slide">
  <h1>Australian Federation (BTN): tier 3 and tier 2 words</h1>
  <div class="sub">Video: Behind the News, Australian Federation</div>
  <div class="blocks">
    <section><h2>Tier 3 · topic words</h2><table id="t3"></table></section>
    <section><h2>Tier 2 · words for any subject</h2><table id="t2"></table></section>
  </div>
  <div class="key" aria-label="Key">
    <span class="m P">prefix</span><span class="m R">root</span><span class="m S">suffix</span><span class="m W">whole word</span>
    <span class="note">Translations are drafted and not yet checked by a speaker of each language.</span>
  </div>
</div>

<script>
(function(){
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function word(x){
    /* hyphens are dropped from the parts, except in a word that has its own hyphen (ex-convict, non-Christian) */
    const keep = x.w.includes("-");
    return x.p.map((s) => { const [t, text] = s.split("|"); const shown = keep ? text.replace(/^-/, "") : text.replace(/-/g, "");
      return `<span class="m ${t}">${esc(shown)}</span>`; }).join("");
  }
  function table(id, list){
    document.getElementById(id).innerHTML =
      `<colgroup><col class="w"><col class="h"><col class="s"><col class="v"></colgroup>
       <thead><tr><th>Word</th><th lang="zh-Hant">繁體</th><th lang="zh-Hans">简体</th><th lang="vi">Tiếng Việt</th></tr></thead><tbody>` +
      list.map((x) => `<tr><td class="word">${word(x)}</td><td class="zh" lang="zh-Hant">${esc(x.hant)}</td><td class="zh" lang="zh-Hans">${esc(x.hans)}</td><td class="vi" lang="vi">${esc(x.vi)}</td></tr>`).join("") + "</tbody>";
  }
  table("t3", TIER3); table("t2", TIER2);

  /* Fit the 1920 x 1080 slide to the window. Zooming the browser changes the window size in CSS pixels, so this follows it. */
  const slide = document.getElementById("slide");
  function fit(){
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    slide.style.transform = `scale(${k}) translate(-50%, -50%)`;
  }
  addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
  fit();
})();
</script>
</body>
</html>
